/* ---------------- events ---------------- */
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(function(){ state.toast=null; render(); }, 1800);
}

function wireEvents(){
  var els = root.querySelectorAll("[data-action]");
  els.forEach(function(el){
    el.addEventListener("click", onAction);
  });
  var backdrops = root.querySelectorAll(".modal-backdrop");
  backdrops.forEach(function(bd){
    bd.addEventListener("click", function(e){
      if(e.target!==bd) return;
      // The celebration overlay isn't a navigated screen (it's shown via
      // state.pendingCelebration layered on top of whatever screen is
      // active, regardless of history) -- dismissing it must NOT go through
      // closeModal()/history.back(), or tapping its backdrop would pop
      // whatever real screen/modal history entry is actually current out
      // from under it. Mirrors the "Nice!" button's own ack-celebration case.
      // Same reasoning applies to the two Treasure Hunt pending overlays.
      var backdropType = bd.getAttribute("data-backdrop");
      if(backdropType==="celebration"){
        state.pendingCelebration = null;
        save(); render();
      } else if(backdropType==="treasure-found"){
        state.pendingTreasureFound = null;
        save(); render();
      } else if(backdropType==="map-complete"){
        state.pendingMapComplete = false;
        save(); render();
      } else {
        closeModal();
      }
    });
  });
  var nameInput = root.querySelector("#firstHabitName");
  if(nameInput){
    nameInput.addEventListener("input", function(e){
      state._draft.name = e.target.value;
      var btn = root.querySelector('[data-action="finish-onboarding"]');
      if(btn) btn.disabled = !state._draft.name.trim();
    });
  }
  var firstDescInput = root.querySelector("#firstHabitDescription");
  if(firstDescInput){
    firstDescInput.addEventListener("input", function(e){ state._draft.description = e.target.value; });
  }
  var addNameInput = root.querySelector("#addHabitName");
  if(addNameInput){
    addNameInput.addEventListener("input", function(e){
      state._draft.name = e.target.value;
      var btn = root.querySelector('[data-action="confirm-add-habit"]');
      if(btn) btn.disabled = !e.target.value.trim();
    });
    addNameInput.focus();
  }
  var addDescInput = root.querySelector("#addHabitDescription");
  if(addDescInput){
    addDescInput.addEventListener("input", function(e){ state._draft.description = e.target.value; });
  }
  // Habit-detail edit fields write straight to the habit object (not a
  // _draft) and only save(), never render() -- re-rendering on every
  // keystroke would rebuild the input out from under itself and drop focus/
  // cursor position mid-edit, same reasoning as the name inputs above.
  var detailNameInput = root.querySelector("#habitDetailName");
  if(detailNameInput){
    detailNameInput.addEventListener("input", function(e){
      var h = findHabit(state._detailHabitId);
      if(h){ h.name = e.target.value; save(); }
    });
    detailNameInput.addEventListener("blur", function(e){
      var h = findHabit(state._detailHabitId);
      if(h && !h.name.trim()){ h.name = "Untitled habit"; e.target.value = h.name; save(); }
    });
  }
  var detailDescInput = root.querySelector("#habitDetailDescription");
  if(detailDescInput){
    detailDescInput.addEventListener("input", function(e){
      var h = findHabit(state._detailHabitId);
      if(h){ h.description = e.target.value; save(); }
    });
  }
  // Backup restore <input type=file> -- lives inside whichever screen
  // rendered it (onboarding step 0, or Profile), so it's safe to wire from
  // here (rebuilt fresh by render() every time, unlike the bottombar).
  var restoreInput = root.querySelector("#profileRestoreInput") || root.querySelector("#onbRestoreInput");
  if(restoreInput){
    restoreInput.addEventListener("change", function(){
      importLatestBackupFromFiles(restoreInput.files);
      restoreInput.value = ""; // lets picking the exact same file again re-fire "change"
    });
  }
}

// Just steps history back one entry -- the popstate listener (see
// onPopState below) performs the actual screen restore + render(). Safe to
// call unconditionally here because every modal/screen this closes was
// itself opened via navigateTo(), which always pushed exactly one entry.
function closeModal(){
  history.back();
}

function onAction(e){
  var el = e.currentTarget;
  var action = el.getAttribute("data-action");
  switch(action){
    // Every explicit forward navigation below (onboarding steps, tapping the
    // home-icon/avatar to switch screens, opening the add-habit modal) goes
    // through navigateTo() so it participates in real one-step-at-a-time
    // back navigation (hardware back, Android gesture-nav swipe, the
    // browser's own back button) -- see navigateTo()/onPopState() below.
    case "onb-next":
      navigateTo(function(){ state.onbStep++; });
      break;
    case "pick-avatar":
      state.avatar = el.getAttribute("data-gender");
      navigateTo(function(){ state.onbStep++; });
      break;
    case "pick-emoji":
      state._draft.emoji = el.getAttribute("data-emoji");
      render();
      break;
    case "pick-type":
      if(el.hasAttribute("disabled")) return;
      state._draft.type = el.getAttribute("data-type");
      render();
      break;
    case "finish-onboarding":
      finishOnboarding();
      break;
    case "show-profile":
      navigateTo(function(){ state.screen = "profile-modal"; });
      break;
    case "open-add-habit":
      navigateTo(function(){
        state._draft = { name:"", emoji:"🌴", type: countActive(state,"daily")<maxDailySlots(state) ? "daily" : (state.unlocks.new_task_types ? "monthly":"daily"), description:"" };
        state.screen = "add-habit-modal";
      });
      break;
    case "show-habit-detail":
      navigateTo(function(){
        state._detailHabitId = el.getAttribute("data-id");
        state.screen = "habit-detail-modal";
      });
      break;
    case "show-reward-detail":
      navigateTo(function(){
        state._detailRewardId = el.getAttribute("data-id");
        state.screen = "reward-detail-modal";
      });
      break;
    case "show-sightings-gallery":
      navigateTo(function(){ state.screen = "sightings-gallery-modal"; });
      break;
    case "show-next-rewards-detail":
      navigateTo(function(){ state.screen = "next-rewards-detail-modal"; });
      break;
    case "show-treasure-hunt":
      navigateTo(function(){ state.screen = "treasure-hunt-modal"; });
      break;
    case "treasure-move":
      treasureMove(el.getAttribute("data-dir"));
      break;
    case "treasure-play-again":
      treasurePlayAgain();
      break;
    case "show-story":
      navigateTo(function(){ state.screen = "story-modal"; });
      break;
    case "toggle-sightings-filter":
      state.sightingsFilter = state.sightingsFilter==="favorites" ? "all" : "favorites";
      save(); render();
      break;
    case "toggle-favorite-sighting":
      var sightingIdx = parseInt(el.getAttribute("data-id"), 10);
      var favIdx = state.favoriteSightings.indexOf(sightingIdx);
      if(favIdx!==-1){
        state.favoriteSightings.splice(favIdx,1);
      } else if(state.favoriteSightings.length < SIGHTINGS_FAVORITE_MAX){
        state.favoriteSightings.push(sightingIdx);
      } else {
        showToast("You can favorite up to "+SIGHTINGS_FAVORITE_MAX+" — remove one first.");
        break;
      }
      save(); render();
      break;
    case "toggle-favorite-reward":
      // Nested inside the reward-card's own show-reward-detail element --
      // stop the click from also bubbling up and opening the detail modal.
      e.stopPropagation();
      var rewardId = el.getAttribute("data-id");
      var rIdx = state.favoriteRewards.indexOf(rewardId);
      if(rIdx!==-1){ state.favoriteRewards.splice(rIdx,1); }
      else { state.favoriteRewards.push(rewardId); }
      save(); render();
      break;
    case "close-modal":
      closeModal();
      break;
    case "confirm-add-habit":
      addHabit();
      break;
    case "toggle-daily":
      toggleDaily(el.getAttribute("data-id"));
      break;
    case "toggle-monthly":
      toggleMonthly(el.getAttribute("data-id"));
      break;
    case "toggle-onceoff":
      toggleOnceoff(el.getAttribute("data-id"));
      break;
    case "open-habit-note":
      navigateTo(function(){ state.screen = "habit-note-modal"; });
      break;
    case "save-habit-note":
      var noteInput = root.querySelector("#habitNoteText");
      saveHabitNote(el.getAttribute("data-id"), noteInput ? noteInput.value : "");
      break;
    case "delete-habit-note":
      deleteHabitNote(el.getAttribute("data-id"));
      break;
    case "delete-habit":
      deleteHabit(el.getAttribute("data-id"));
      break;
    case "switch-avatar":
      state.avatar = state.avatar==="female" ? "male" : "female";
      save(); render();
      break;
    case "reset-progress":
      if(confirm("Reset all progress? This cannot be undone.")){
        state = defaultState();
        save(); render();
        // Full reset hands back off to a fresh onboarding flow -- establish
        // it as a new baseline (like the very first load) rather than
        // pushing, so back from onboarding step 0 exits the app instead of
        // returning to whatever screen was open right before the reset.
        try{ history.replaceState(currentNavState(), ""); }catch(err){}
      }
      break;
    case "ack-celebration":
      state.pendingCelebration = null;
      save(); render();
      break;
    case "ack-treasure-found":
      state.pendingTreasureFound = null;
      save(); render();
      break;
    case "ack-map-complete":
      state.pendingMapComplete = false;
      save(); render();
      break;
    case "install-pill":
      if(isInstalled()){ openInfoModal("Uninstall", UNINSTALL_STEPS_HTML); }
      else { triggerInstall(); }
      break;
    case "backup-now":
      backupNow();
      break;
    case "restore-backup":
      openBackupRestorePicker(root.querySelector("#profileRestoreInput") || root.querySelector("#onbRestoreInput"));
      break;
  }
}

function finishOnboarding(){
  var name = state._draft.name.trim();
  if(!name) return;
  state.startDate = todayStr();
  state.habits.push({
    id: uid(), name:name, emoji: state._draft.emoji, type:"daily",
    description: state._draft.description.trim(),
    createdAt: todayStr(), completions:[]
  });
  unlockStarterRewards();
  state.onboarded = true;
  state.screen = "logbook";
  // Must come after state.onboarded=true -- showToast()'s toast only
  // renders as part of renderApp(), not renderOnboarding().
  unlockFirstDiscoveryFree();
  save();
  render();
  // Onboarding finishing and handing off to the main app is a one-time setup
  // flow completing, not a forward navigation -- replaceState establishes a
  // fresh baseline here so the bottombar/topbar are correctly synced (see
  // render()) and so Install/backup features relying on isInstalled()/
  // maybeShowInstallPrompt() start from the real "now in the main app" state.
  try{ history.replaceState(currentNavState(), ""); }catch(e){}
  // Proactive install ask happens here (after onboarding, never during it)
  // -- see maybeShowInstallPrompt() below for the once-ever gate.
  maybeShowInstallPrompt();
}

function addHabit(){
  var d = state._draft;
  var name = d.name.trim();
  if(!name) return;
  state.habits.push({ id:uid(), name:name, emoji:d.emoji, type:d.type, description:d.description.trim(), createdAt:todayStr(), completions:[] });
  save();
  // Pops the add-habit-modal's history entry (pushed by navigateTo() when it
  // was opened) rather than setting state.screen directly -- keeps the
  // history stack accurate so a later back-press doesn't return to a stale
  // add-habit form. onPopState() performs the actual re-render.
  closeModal();
}

function findHabit(id){
  return state.habits.filter(function(h){return h.id===id;})[0];
}

function toggleDaily(id){
  var h = findHabit(id); if(!h) return;
  var t = todayStr();
  var idx = h.completions.indexOf(t);
  if(idx===-1){ h.completions.push(t); state.carrots++; }
  else { h.completions.splice(idx,1); state.carrots=Math.max(0,state.carrots-1); deleteHabitNoteFor(h,t); }
  evaluateRewards();
  save(); render();
}
function toggleMonthly(id){
  var h = findHabit(id); if(!h) return;
  var m = monthStr();
  var idx = h.completions.indexOf(m);
  if(idx===-1){ h.completions.push(m); state.carrots++; }
  else { h.completions.splice(idx,1); state.carrots=Math.max(0,state.carrots-1); deleteHabitNoteFor(h,m); }
  evaluateRewards();
  save(); render();
}
function toggleOnceoff(id){
  var h = findHabit(id); if(!h) return;
  if(h.completions.length){ deleteHabitNoteFor(h,h.completions[0]); h.completions=[]; state.carrots=Math.max(0,state.carrots-1); }
  else { h.completions=[todayStr()]; state.carrots++; }
  evaluateRewards();
  save(); render();
}

/* ---------------- habit log notes ----------------
   A note is optional, per-completion context the player can attach to
   *today's* daily log, *this month's* monthly log, or the one-and-only
   once-off log -- keyed by the exact same date/month string already used
   in h.completions, so it always tracks whichever period is currently
   logged rather than needing its own separate identity. Stored in a
   parallel h.notes map (not inline on completions, which stay plain
   date/month strings everywhere else in this file -- dailyStreak(),
   habitLogged(), evaluateRewards(), onceoffCompletedCount() etc. all still
   just see an array of strings) so nothing else has to change shape. */
function habitNoteKey(h){
  if(h.type==="daily") return todayStr();
  if(h.type==="monthly") return monthStr();
  return h.completions[0]; // onceoff -- undefined if not yet completed
}
function getHabitNote(h){
  return (h.notes||{})[habitNoteKey(h)];
}
function habitHasNote(h){
  return !!getHabitNote(h);
}
function deleteHabitNoteFor(h, key){
  if(h.notes && key in h.notes) delete h.notes[key];
}
// Both close the pop-up (history.back(), same as addHabit()/deleteHabit())
// rather than just re-rendering in place -- the note modal is reached via
// navigateTo() (see "open-habit-note" below) so it owns a real history
// entry that needs popping, exactly like every other modal in this file.
function saveHabitNote(id, text){
  var h = findHabit(id); if(!h) return;
  text = text.trim();
  if(!text) return; // nothing to persist -- delete-habit-note removes an existing one
  var key = habitNoteKey(h);
  if(!h.notes) h.notes = {};
  var existing = h.notes[key];
  var now = new Date().toISOString();
  h.notes[key] = { text: text, loggedAt: existing ? existing.loggedAt : now, updatedAt: now };
  save();
  closeModal();
}
function deleteHabitNote(id){
  var h = findHabit(id); if(!h) return;
  deleteHabitNoteFor(h, habitNoteKey(h));
  save();
  closeModal();
}
function formatNoteTimestamp(iso){
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
// Reached by tapping the day's checkmark once it's already logged (see the
// log-btn.done branches in renderHabitDetailModal()) -- only ever opened
// for a habit whose current period is already logged, so h always has a
// valid habitNoteKey() here.
function renderHabitNoteModal(id){
  var h = findHabit(id);
  if(!h) return '';
  var note = getHabitNote(h);
  var html = '<div class="modal-backdrop" data-backdrop="habit-note">';
  html += '<div class="modal">';
  html += '<button class="modal-close" data-action="close-modal">✕</button>';
  html += '<h3>'+h.emoji+' '+escapeHtml(h.name)+'</h3>';
  if(note){
    html += '<div class="habit-note-meta">'+(note.updatedAt!==note.loggedAt?"Updated ":"Logged ")+formatNoteTimestamp(note.updatedAt)+'</div>';
  }
  html += '<textarea class="habit-note-input" id="habitNoteText" maxlength="280" placeholder="Add a note...">'+escapeHtml(note?note.text:"")+'</textarea>';
  html += '<div class="habit-note-actions">';
  html += '<button class="btn btn-block" data-action="save-habit-note" data-id="'+h.id+'">Save note</button>';
  if(note){ html += '<button class="btn-ghost btn-block" data-action="delete-habit-note" data-id="'+h.id+'">Delete note</button>'; }
  html += '</div>';
  html += '</div></div>';
  return html;
}
function deleteHabit(id){
  if(!confirm("Remove this habit-garden?")) return;
  state.habits = state.habits.filter(function(h){return h.id!==id;});
  save();
  // Only ever called from inside the habit-detail modal now (the compact
  // Logbook row has no inline delete) -- pop that history entry the same way
  // addHabit() pops the add-habit-modal's, rather than leaving state.screen
  // pointed at a detail view for a habit that no longer exists.
  closeModal();
}

/* =========================================================
   HISTORY / BACK-NAVIGATION (Phone gesture support, part 1)
   Every explicit forward navigation (onboarding steps, switching to
   Rewards/Profile/an Add-Habit modal, the bottombar) goes through
   navigateTo(), which both applies the change and pushes exactly one
   history entry. A single popstate listener below just reflects whatever
   the browser already walked back to -- it must NOT push anything itself,
   which is what makes a hardware back press / Android gesture-nav swipe /
   the browser's own back button always undo exactly one step instead of
   jumping straight to some fixed "home" screen.
   ========================================================= */
function currentNavState(){
  return state.onboarded ? {screen: state.screen} : {onbStep: state.onbStep};
}
function navigateTo(mutate){
  mutate();
  save();
  render();
  try{ history.pushState(currentNavState(), ""); }catch(e){}
}
function onPopState(e){
  var target = e.state;
  if(!target){
    // No state to restore (popped past the first entry this app ever
    // established) -- fall back to whatever "root" currently means; in
    // practice the browser is usually navigating away from the app entirely
    // at this point, so this is mostly a defensive no-op.
    target = state.onboarded ? {screen:"logbook"} : {onbStep:0};
  }
  if(typeof target.onbStep === "number"){
    state.onboarded = false;
    state.onbStep = target.onbStep;
  } else if(target.screen){
    state.onboarded = true;
    state.screen = target.screen;
  }
  render(); // reflect only -- see the comment above, must not push
}
window.addEventListener("popstate", onPopState);

/* =========================================================
   INSTALL / HOME SCREEN
   ========================================================= */
// True once actually running as the installed/home-screen app rather than a
// regular browser tab -- display-mode covers Chrome/Edge/Android,
// navigator.standalone is Safari's own (non-standard, iOS-only) equivalent.
function isStandaloneApp(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
// What the Install pill actually checks -- not just isStandaloneApp() alone,
// since a regular tab that just walked through a manual/native install
// doesn't itself flip to display-mode:standalone until the user actually
// relaunches from the real Home Screen icon.
function isInstalled(){
  return isStandaloneApp() || !!state.installPromptAccepted;
}
// Shown top-right on every main screen's topbar (same row as the icon/
// wordmark row) so the call-to-action is visible immediately no matter
// where someone lands -- not just tucked into Profile. Once actually
// installed there's nothing left to act on there, so it disappears from
// Logbook/Rewards; Profile passes keepAfterInstall=true to keep showing it
// as an inert "Installed" status line instead, since that's the one place
// people go looking to confirm state. Label always mirrors isInstalled()
// directly -- no separate "uninstalled" state, since a page can't actually
// uninstall itself (see INSTALL_STEPS_HTML/UNINSTALL_STEPS_HTML below).
function installTopbarBtnHtml(keepAfterInstall){
  var installed = isInstalled();
  if(installed && !keepAfterInstall) return "";
  return '<button class="topbar-install-btn'+(installed?' installed':'')+'" data-action="install-pill">'+(installed?'Installed':'Install')+'</button>';
}
// Platform-agnostic (a page can't reliably detect device type) instructions
// -- the real install/uninstall action always happens at the OS level, so
// these just point at it. Shown via openInfoModal (centered popup), not a
// position-anchored tooltip -- a tooltip pinned to this top-right pill's tap
// point would run off the edge of the screen.
var INSTALL_STEPS_HTML =
  '<strong>iPhone/iPad (Safari):</strong>' +
  '<ol style="margin:4px 0 0;padding-left:18px;">' +
    '<li>Tap the Share icon (square with an arrow) in the toolbar.</li>' +
    '<li>Scroll down and tap "Add to Home Screen".</li>' +
    '<li>Tap "Add" in the top right.</li>' +
  '</ol><br>' +
  '<strong>Android (Chrome):</strong>' +
  '<ol style="margin:4px 0 0;padding-left:18px;">' +
    '<li>Tap the &#8942; menu in the top right.</li>' +
    '<li>Tap "Add to Home screen" or "Install app".</li>' +
    '<li>Tap "Install" (or "Add") to confirm.</li>' +
  '</ol><br>' +
  '<strong>Desktop Chrome/Edge:</strong>' +
  '<ol style="margin:4px 0 0;padding-left:18px;">' +
    '<li>Click the install icon at the right edge of the address bar (or the &#8942; menu &rarr; "Install rHabbits").</li>' +
    '<li>Click "Install" to confirm.</li>' +
  '</ol>';
var UNINSTALL_STEPS_HTML =
  '<strong>iPhone/iPad:</strong>' +
  '<ol style="margin:4px 0 0;padding-left:18px;">' +
    '<li>Touch and hold the rHabbits icon on the Home Screen.</li>' +
    '<li>Tap "Remove App".</li>' +
    '<li>Tap "Delete App" to confirm.</li>' +
  '</ol><br>' +
  '<strong>Android:</strong>' +
  '<ol style="margin:4px 0 0;padding-left:18px;">' +
    '<li>Touch and hold the rHabbits icon on the Home screen.</li>' +
    '<li>Tap "Uninstall" (or drag it to "Uninstall" at the top of the screen).</li>' +
    '<li>Confirm when prompted.</li>' +
  '</ol><br>' +
  '<strong>Desktop Chrome/Edge:</strong>' +
  '<ol style="margin:4px 0 0;padding-left:18px;">' +
    '<li>Right-click the rHabbits icon (Start Menu/Taskbar/Dock).</li>' +
    '<li>Click "Uninstall".</li>' +
    '<li>Confirm when prompted.</li>' +
  '</ol>';
// Reusable centered popup, appended straight to <body> -- deliberately
// outside #app/state.screen, since these can be shown regardless of which
// screen is current (e.g. the auto-restore prompt fires before onboarding
// even renders its first real screen) and don't need back-navigation
// history of their own the way a real screen/modal does.
function openInfoModal(title, bodyHtml){
  var wrap = document.createElement("div");
  wrap.innerHTML =
    '<div class="modal-backdrop center">' +
      '<div class="modal">' +
        '<button class="modal-close" data-close-info>✕</button>' +
        '<h3>'+title+'</h3>' +
        '<div style="color:var(--wood-dark); font-size:.92rem; line-height:1.5;">'+bodyHtml+'</div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);
  function close(){ wrap.remove(); }
  wrap.querySelector("[data-close-info]").addEventListener("click", close);
  wrap.querySelector(".modal-backdrop").addEventListener("click", function(e){ if(e.target===e.currentTarget) close(); });
  return wrap;
}
// Chrome/Edge/Android fire this instead of installing immediately, handing
// over an event whose .prompt() shows the native install UI on demand -- so
// it has to be captured up front (page load) and held until the Install
// pill is actually tapped. preventDefault() stops the browser's own
// separate install mini-infobar so this pill is the one path in.
var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  state.installPromptAccepted = true;
  save();
  render();
});
// Shared by the Install pill's tap and the proactive install-prompt popup's
// "Install" button -- one native-vs-manual branch, not two.
function triggerInstall(){
  if(deferredInstallPrompt){
    var promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null; // one-shot -- the browser invalidates it after a single use either way
    promptEvent.prompt();
    promptEvent.userChoice.then(function(choice){
      if(choice.outcome==="accepted"){
        state.installPromptAccepted = true;
        save();
      }
      render();
    });
  } else {
    // No captured browser-native prompt -- either this browser doesn't
    // support triggering install from a page at all (iOS Safari, plain
    // Firefox), or Chrome/Edge just hasn't fired beforeinstallprompt yet.
    // The manual path always works; there's no signal a page can detect
    // for "the user actually finished the manual steps", so this can't
    // flip to Installed on its own -- only relaunching from the real Home
    // Screen icon can do that.
    openInfoModal("Install on Home Screen", INSTALL_STEPS_HTML);
  }
}
// Proactive "Install rHabbits?" prompt, shown once (ever, per device) after
// onboarding finishes (never during it) when not already installed -- asked,
// not assumed: declining just closes it and points at Profile's Install
// pill for later, and the asked-flag is set either way so this never nags
// on a later visit. A short delay lets beforeinstallprompt (which can
// arrive a moment after load) have a chance to populate
// deferredInstallPrompt first, so "Install" here has the same shot at the
// fast native one-tap path as the pill itself does.
function maybeShowInstallPrompt(){
  if(!state.onboarded) return; // never during onboarding -- see finishOnboarding()
  if(isInstalled()) return;
  if(state.installPromptAsked) return;
  setTimeout(function(){
    if(isInstalled()) return; // could have installed (or been asked elsewhere) during the delay
    state.installPromptAsked = true;
    save();
    var wrap = openInfoModal("Install rHabbits?",
      '<div style="margin-bottom:14px;">Installing adds rHabbits to your Home Screen and gives it the strongest protection against your browser silently clearing its data.</div>' +
      '<button class="btn btn-block" id="install-prompt-yes" style="margin-bottom:8px;">Install</button>' +
      '<button class="btn-ghost btn-block" id="install-prompt-no">Not now</button>'
    );
    wrap.querySelector("#install-prompt-yes").addEventListener("click", function(){ wrap.remove(); triggerInstall(); });
    wrap.querySelector("#install-prompt-no").addEventListener("click", function(){
      wrap.remove();
      showToast("No problem — look for the Install button in your Profile whenever you're ready.");
    });
  }, 1500);
}

/* =========================================================
   DIAGNOSTIC LOG -- there's no dedicated log viewer in rHabbits, so this is
   deliberately minimal: a handful of the most recent entries, persisted so
   they survive a reload, surfaced as a small muted line in Profile (see
   renderProfileModal/latestDiagEntry) -- just enough to be checkable later
   if a user reports data loss, without a whole Settings > Error Log screen.
   ========================================================= */
var DIAG_LOG_KEY = "rhabbits_diag_log";
function logDiag(message){
  try{
    var log = JSON.parse(localStorage.getItem(DIAG_LOG_KEY) || "[]");
    log.unshift({ts: Date.now(), message: message});
    localStorage.setItem(DIAG_LOG_KEY, JSON.stringify(log.slice(0,3)));
  }catch(e){}
}
function latestDiagEntry(){
  try{
    var log = JSON.parse(localStorage.getItem(DIAG_LOG_KEY) || "[]");
    return log[0] || null;
  }catch(e){ return null; }
}
// Best-effort ask not to auto-evict this site's storage under low-disk
// pressure. There's no way to test real eviction behavior on someone else's
// actual phone from here, so a denial (with a rough usage/quota estimate)
// is logged rather than silently swallowed.
function checkStoragePersistence(){
  if(!(navigator.storage && navigator.storage.persist)) return;
  (function(){
    var persistedPromise = navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false);
    persistedPromise.then(function(persisted){
      var work = persisted ? Promise.resolve(true) : navigator.storage.persist();
      work.then(function(granted){
        if(granted) return;
        var detail = "";
        (navigator.storage.estimate ? navigator.storage.estimate() : Promise.resolve(null)).then(function(est){
          if(est && est.quota){ detail = " (using ~"+Math.round((est.usage||0)/1048576)+"MB of ~"+Math.round(est.quota/1048576)+"MB available)"; }
        }).catch(function(){}).then(function(){
          logDiag("Storage is NOT persisted"+detail+" — this browser may silently evict rHabbits' data under storage pressure. Installing to your Home Screen gives the strongest protection.");
        });
      }).catch(function(){});
    }).catch(function(){});
  })();
}

/* =========================================================
   BACKUP / RESTORE -- manual-only, gated entirely behind an explicit tap
   (Profile's "Back up data now", the bottombar Backup icon, or the
   onboarding/auto-restore "Restore" flows). Never called automatically from
   save() or on backgrounding -- an earlier version of this pattern did that
   and it silently piled up dozens of downloaded files plus an
   unsuppressable OS "Download complete" notification every single time.
   The whole state object IS the backup (rHabbits only has the one
   localStorage key, STORAGE_KEY) -- no separate export format to maintain.
   ========================================================= */
// Excluded from the dedup fingerprint below: pure UI/navigation bookkeeping
// that churns on its own (or on every tap) and was never what "back up my
// data" was protecting -- toast/pendingCelebration/screen/onbStep/_draft are
// transient UI state, not user data, and installPromptAsked/Accepted are
// install bookkeeping. Leaving those in would make backupFingerprint()
// change on nearly every render and defeat the dedup entirely.
function backupFingerprint(){
  var d = {
    onboarded: state.onboarded,
    avatar: state.avatar,
    startDate: state.startDate,
    carrots: state.carrots,
    habits: state.habits,
    unlocks: state.unlocks
  };
  return JSON.stringify(d);
}
var BACKUP_LAST_FINGERPRINT_KEY = "rhabbits_last_backup_fingerprint";
var BACKUP_HANDLE_DB = "rhabbits-fs", BACKUP_HANDLE_STORE = "handles", BACKUP_HANDLE_KEY = "backupFile";
function openHandleDb(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(BACKUP_HANDLE_DB, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(BACKUP_HANDLE_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function loadSavedBackupHandle(){
  return openHandleDb().then(function(db){
    return new Promise(function(resolve, reject){
      var req = db.transaction(BACKUP_HANDLE_STORE, "readonly").objectStore(BACKUP_HANDLE_STORE).get(BACKUP_HANDLE_KEY);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  }).catch(function(){ return null; });
}
function saveBackupHandle(handle){
  return openHandleDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(BACKUP_HANDLE_STORE, "readwrite");
      tx.objectStore(BACKUP_HANDLE_STORE).put(handle, BACKUP_HANDLE_KEY);
      tx.oncomplete = resolve; tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ /* best-effort */ });
}
// On browsers with the File System Access API (desktop Chrome/Edge -- absent
// on iOS Safari and most Android Chrome), this lets "Back up now" overwrite
// the SAME on-disk file every time instead of creating a new timestamped one
// on every tap. A saved, already-granted handle is reused silently on every
// call after the first.
function getWritableBackupHandle(){
  if(!window.showSaveFilePicker) return Promise.resolve(null);
  return loadSavedBackupHandle().then(function(handle){
    if(handle){
      return handle.queryPermission({mode:"readwrite"}).then(function(perm){
        if(perm==="granted") return handle;
        return handle.requestPermission({mode:"readwrite"}).then(function(req){
          return req==="granted" ? handle : null;
        });
      });
    }
    return window.showSaveFilePicker({
      suggestedName: "rhabbits-data.json",
      types: [{description:"rHabbits backup", accept:{"application/json":[".json"]}}]
    }).then(function(h){
      return saveBackupHandle(h).then(function(){ return h; });
    });
  }).catch(function(){ return null; }); // user cancelled the picker, or any other failure -- caller falls back
}
// Manual/on-demand only. Skips writing/downloading anything when nothing
// has actually changed since the last backup (see backupFingerprint) --
// without this, repeat taps of "Back up data now" (or the bottombar Backup
// icon) each produce a brand-new timestamped file on any browser without
// the File System Access API (iOS Safari, most Android Chrome -- there's no
// web API on those platforms that can silently overwrite an existing file),
// piling up dozens of near-identical backups over normal use.
function backupNow(){
  var fp = backupFingerprint();
  if(fp === localStorage.getItem(BACKUP_LAST_FINGERPRINT_KEY)){
    showToast("Already up to date — no changes since last backup.");
    return Promise.resolve(false);
  }
  var json = JSON.stringify(state, null, 2);
  return getWritableBackupHandle().then(function(handle){
    if(handle){
      return handle.createWritable().then(function(writable){
        return writable.write(json).then(function(){ return writable.close(); });
      }).then(function(){
        localStorage.setItem(BACKUP_LAST_FINGERPRINT_KEY, fp);
        showToast("Backup saved.");
        return true;
      }).catch(function(){ return downloadBackupFallback(json, fp); });
    }
    return downloadBackupFallback(json, fp);
  });
}
function downloadBackupFallback(json, fp){
  try{
    var blob = new Blob([json], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    // Timestamped, not a fixed name -- a fixed name hits a hard "file
    // already exists" failure on-device rather than a silent auto-rename,
    // on the browsers that land here.
    var stamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.download = "rhabbits-data-"+stamp+".json";
    a.click();
    localStorage.setItem(BACKUP_LAST_FINGERPRINT_KEY, fp);
    showToast("Backup saved to your Downloads.");
    return true;
  }catch(e){
    showToast("Could not save backup: "+e.message);
    return false;
  }
}
function validBackupShape(parsed){
  return !!parsed && typeof parsed==="object" && Array.isArray(parsed.habits) && typeof parsed.unlocks==="object";
}
// Shared by manual restore (Step 7), the onboarding "Restore backup" link,
// and the auto-detected-empty-state restore prompt (see maybeOfferAutoRestore
// below) -- one validate-then-merge implementation, not three.
function applyRestoredState(parsed){
  var merged = Object.assign(defaultState(), parsed);
  merged.unlocks = Object.assign({}, parsed.unlocks || {});
  merged._draft = { name:"", emoji:"🌴", type:"daily", description:"" };
  merged.toast = null;
  merged.pendingCelebration = null;
  merged.pendingTreasureFound = null;
  merged.pendingMapComplete = false;
  merged.screen = "logbook";
  state = merged;
  save();
  render();
  try{ history.replaceState(currentNavState(), ""); }catch(e){}
}
function importDataFromFile(file){
  if(!file) return;
  file.text().then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); }catch(e){ throw new Error("That file isn't valid JSON."); }
    if(!validBackupShape(parsed)) throw new Error("This file does not look like an rHabbits backup.");
    if(!confirm("This will replace all current data on this device with the contents of this backup. Continue?")) return;
    applyRestoredState(parsed);
    showToast("Backup restored.");
  }).catch(function(e){
    showToast("Could not restore that file: "+e.message);
  });
}
// Picks the newest backup out of one or more selected files, so restoring
// never requires eyeballing filenames. Matches this app's own timestamped
// filename first (sorts correctly as a string); anything that doesn't match
// (e.g. a renamed file) falls back to the File object's own lastModified.
function pickLatestBackupFile(files){
  var list = Array.prototype.filter.call(files||[], function(f){ return /\.json$/i.test(f.name); });
  if(list.length===0) return null;
  function stampOf(f){
    var m = f.name.match(/rhabbits-data-(.+)\.json$/i);
    return m ? m[1] : null;
  }
  list.sort(function(a,b){
    var sa=stampOf(a), sb=stampOf(b);
    if(sa && sb) return sa<sb ? 1 : sa>sb ? -1 : 0;
    if(sa && !sb) return -1;
    if(sb && !sa) return 1;
    return b.lastModified - a.lastModified;
  });
  return list[0];
}
function importLatestBackupFromFiles(files){
  var latest = pickLatestBackupFile(files);
  if(!latest){ if(files && files.length) showToast("No .json backup file found in what you selected."); return; }
  importDataFromFile(latest);
}
// On browsers that support it, jumps the native picker straight into the
// Downloads folder and allows multi-select in one go. iOS Safari and most
// Android browsers fall back to the plain <input type=file> picker passed in.
// Returns a Promise resolving to "native" (a file was picked and handed to
// importLatestBackupFromFiles), "cancelled" (user backed out of the native
// picker), or "fallback-clicked" (fallbackInputEl.click() was invoked --
// its own "change" listener, wired by the caller, handles the rest once a
// file is actually chosen). Callers that don't need this (Profile/
// onboarding's plain "Restore from backup" buttons) can just ignore it.
function openBackupRestorePicker(fallbackInputEl){
  if(window.showOpenFilePicker){
    return window.showOpenFilePicker({
      multiple: true,
      startIn: "downloads",
      types: [{description:"rHabbits backup", accept:{"application/json":[".json"]}}]
    }).then(function(handles){
      return Promise.all(handles.map(function(h){ return h.getFile(); }));
    }).then(function(files){
      importLatestBackupFromFiles(files);
      return "native";
    }).catch(function(e){
      if(e && e.name==="AbortError") return "cancelled"; // user backed out -- don't chain into a second picker
      if(fallbackInputEl) fallbackInputEl.click();
      return "fallback-clicked";
    });
  }
  if(fallbackInputEl) fallbackInputEl.click();
  return Promise.resolve("fallback-clicked");
}

/* =========================================================
   RESTORE PROMPT AT STARTUP (auto-detect) -- proactively offers to restore
   when the app's own on-device data looks freshly wiped (fresh browser
   profile, a "Clear browsing data" wipe, storage eviction) but a prior
   backup is still reachable. Only ever runs while !state.onboarded (the
   app's own definition of "looks empty" -- see maybeOfferAutoRestore),
   which also means it naturally never fights with maybeShowInstallPrompt()
   (that one is gated on state.onboarded being true).
   ========================================================= */
// Path A -- silent handle re-read, File System Access browsers only. Query
// only, never requestPermission() here: escalating permission needs a user
// gesture, and there isn't one this early in the page lifecycle.
function tryAutoRestorePathA(){
  if(!window.showSaveFilePicker) return Promise.resolve(false);
  return loadSavedBackupHandle().then(function(handle){
    if(!handle) return false;
    return handle.queryPermission({mode:"read"}).then(function(perm){
      if(perm!=="granted") return false;
      return handle.getFile().then(function(file){ return file.text(); }).then(function(text){
        var parsed = JSON.parse(text);
        if(!validBackupShape(parsed)) return false;
        offerAutoRestore(parsed);
        return true;
      });
    });
  }).catch(function(){ return false; });
}
function offerAutoRestore(parsed){
  var n = (parsed.habits||[]).length;
  var when = parsed.startDate || "a previous session";
  var wrap = openInfoModal("Restore your data?",
    '<div style="margin-bottom:14px;">This device\'s rHabbits data looks empty, but a backup was found — '+n+' habit-garden(s) since '+escapeHtml(when)+'. Restore it?</div>' +
    '<button class="btn btn-block" id="ar-yes" style="margin-bottom:8px;">Restore</button>' +
    '<button class="btn-ghost btn-block" id="ar-no">No, start fresh</button>'
  );
  wrap.querySelector("#ar-yes").addEventListener("click", function(){
    wrap.remove();
    applyRestoredState(parsed);
    showToast("Backup restored.");
    maybeShowInstallPrompt();
  });
  wrap.querySelector("#ar-no").addEventListener("click", function(){
    wrap.remove();
    maybeShowInstallPrompt();
  });
}
// Path B -- every other browser (most phones: iOS Safari, most Android
// Chrome). Nothing can be silently re-read here without a user gesture, so
// the proactive prompt itself IS the ask -- its button goes straight to the
// open-file-picker flow the moment it's tapped.
function offerAutoRestorePathB(){
  var wrap = openInfoModal("Restore your data?",
    '<div style="margin-bottom:14px;">This device\'s rHabbits data looks empty. If you have a backup file saved, you can restore it now.</div>' +
    '<button class="btn btn-block" id="ar-yes" style="margin-bottom:8px;">Restore from file&hellip;</button>' +
    '<input type="file" id="ar-file-input" accept="application/json,.json" class="hidden">' +
    '<button class="btn-ghost btn-block" id="ar-no">No, start fresh</button>'
  );
  var fileInput = wrap.querySelector("#ar-file-input");
  wrap.querySelector("#ar-yes").addEventListener("click", function(){
    // Deliberately does NOT remove/detach wrap (or fileInput, which lives
    // inside it) before calling this -- a detached <input type=file> isn't
    // guaranteed to still open its native picker on a synthetic .click() in
    // every browser. Left in place until we know which path was taken:
    // "native"/"cancelled" clean up here; "fallback-clicked" is cleaned up
    // by the input's own "change" listener below once a file is chosen.
    openBackupRestorePicker(fileInput).then(function(result){
      if(result==="native" || result==="cancelled"){ wrap.remove(); maybeShowInstallPrompt(); }
    });
  });
  fileInput.addEventListener("change", function(){
    wrap.remove();
    importLatestBackupFromFiles(fileInput.files);
    maybeShowInstallPrompt();
  });
  wrap.querySelector("#ar-no").addEventListener("click", function(){ wrap.remove(); maybeShowInstallPrompt(); });
}
function maybeOfferAutoRestore(){
  if(state.onboarded) return; // real on-device data exists -- never prompt over it
  // Every brand-new first-ever visit also has empty state by definition, so
  // gating on emptiness alone would show "Restore your data?" to people who
  // have never used the app at all. This flow exists for the installed-app-
  // got-wiped case specifically -- only offer it once there's a real signal
  // this device previously ran the app as an installed PWA.
  if(!isInstalled()) return;
  tryAutoRestorePathA().then(function(handled){
    if(!handled) offerAutoRestorePathB();
  });
}

/* =========================================================
   UPDATE CHECKING -- two independent signals, run together (see
   checkForUpdate). Deliberately does NOT reload while a field is focused;
   it just defers and retries on the next check instead of yanking an
   in-progress habit name out from under someone.
   ========================================================= */
function isUserTyping(){
  var el = document.activeElement;
  if(!el) return false;
  if(el.tagName === "TEXTAREA") return true;
  if(el.tagName === "INPUT") return /^(text|search|number)$/i.test(el.type || "text");
  return false;
}
// Signal 1: index.html's own etag/last-modified, remembered across sessions
// so the very first check of a new session can catch "what got served just
// now is already behind what's on the server."
var DEPLOYED_TAG_KEY = "rhabbitsDeployedTag";
var deployedVersionTag = (function(){ try{ return localStorage.getItem(DEPLOYED_TAG_KEY); }catch(e){ return null; } })();
// Signal 2: forces the service worker's own update check right now instead
// of waiting on the browser's lazy schedule (up to ~24h). Once a genuinely
// new worker activates (it calls skipWaiting()/clients.claim() itself --
// see sw.js), 'controllerchange' fires and that's what actually triggers
// the reload, not reg.update() itself (which only starts the check).
var swReloadPending = false, swReloadTriggered = false;
function reloadForNewServiceWorker(){
  if(swReloadTriggered) return; // controllerchange can fire more than once per page life
  if(isUserTyping()){ swReloadPending = true; return; } // retried from checkForUpdate's next call
  swReloadTriggered = true;
  location.reload();
}
if(navigator.serviceWorker){
  navigator.serviceWorker.addEventListener("controllerchange", reloadForNewServiceWorker);
}
// Returns a status string so callers wanting feedback (pull-to-refresh) can
// react -- the interval/visibilitychange callers just ignore it.
function checkForUpdate(){
  if(swReloadPending && !isUserTyping()){ reloadForNewServiceWorker(); return Promise.resolve("reloading"); }
  var swCheck = (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
    ? navigator.serviceWorker.getRegistration().then(function(reg){ if(reg) reg.update().catch(function(){}); }).catch(function(){})
    : Promise.resolve();
  return swCheck.then(function(){
    return fetch(location.pathname+"?_="+Date.now(), {cache:"no-store", method:"HEAD"}).then(function(res){
      var tag = res.headers.get("etag") || res.headers.get("last-modified");
      if(!tag) return "unknown";
      if(deployedVersionTag===null){
        deployedVersionTag = tag;
        try{ localStorage.setItem(DEPLOYED_TAG_KEY, tag); }catch(e){}
        return "up-to-date";
      }
      if(tag===deployedVersionTag) return "up-to-date";
      if(isUserTyping()) return "deferred";
      deployedVersionTag = tag;
      try{ localStorage.setItem(DEPLOYED_TAG_KEY, tag); }catch(e){}
      location.reload();
      return "reloading";
    }).catch(function(){ return "offline"; }); // offline or blocked -- silently skip, next successful check catches up
  });
}

/* =========================================================
   BOTTOM NAV -- lives in the page shell (a sibling of #app in <body>), not
   inside the DOM subtree render() tears down and rebuilds, so its click
   handlers are wired exactly ONCE at bootstrap (initBottombar, called
   below) rather than from wireEvents(), which re-runs on every render().
   Wiring it from wireEvents() instead would accumulate one additional
   listener on these same nodes every single render -- a single tap would
   then fire backupNow() once per render that's happened since page load.
   ========================================================= */
function initBottombar(){
  var bar = document.getElementById("bottombar");
  if(!bar) return;
  var buttons = bar.querySelectorAll("[data-nav]");
  buttons.forEach(function(btn){
    btn.addEventListener("click", function(){
      var target = btn.getAttribute("data-nav");
      if(target==="backup"){ backupNow(); return; }
      if(state.screen===target) return; // already there -- no-op push
      navigateTo(function(){ state.screen = target; });
    });
  });
}
// Called at the end of every render() to keep the (persistent, un-rebuilt)
// bottombar's visibility and active-tab highlight in sync with state.
function syncBottombarUI(){
  var bar = document.getElementById("bottombar");
  if(!bar) return;
  bar.classList.toggle("hidden", !state.onboarded);
  bar.querySelectorAll("[data-nav]").forEach(function(btn){
    var target = btn.getAttribute("data-nav");
    btn.classList.toggle("active", target===state.screen);
  });
}

/* =========================================================
   PULL-TO-REFRESH -- forces an update check on demand instead of waiting
   for backgrounding/foregrounding to trigger one. Only activates when the
   touch starts at the very top of the page's scroll (this app's screens all
   scroll the whole document, no per-screen internal scroll container) and
   no modal is open, so it doesn't fight normal scrolling or a modal's own
   touch handling.
   ========================================================= */
(function(){
  var indicator = document.getElementById("pullRefresh");
  if(!indicator) return;
  var THRESHOLD = 70;
  var startY = null, dragging = false, ready = false;
  document.addEventListener("touchstart", function(e){
    if(window.scrollY===0 && !document.querySelector(".modal-backdrop")){
      startY = e.touches[0].clientY;
      dragging = true; ready = false;
      indicator.classList.remove("hidden");
      indicator.classList.add("dragging");
    }
  }, {passive:true});
  document.addEventListener("touchmove", function(e){
    if(!dragging || startY===null) return;
    var dy = e.touches[0].clientY - startY;
    if(dy>0 && window.scrollY===0){
      var dist = Math.min(dy, THRESHOLD*1.6);
      ready = dy > THRESHOLD;
      indicator.style.transform = "translate(-50%, "+(dist-60)+"px)";
      indicator.classList.toggle("ready", ready);
    }
  }, {passive:true});
  document.addEventListener("touchend", function(){
    if(!dragging) return;
    dragging = false;
    indicator.classList.remove("dragging");
    if(!ready){
      indicator.classList.remove("ready");
      indicator.style.transform = "";
      indicator.classList.add("hidden");
      startY = null;
      return;
    }
    indicator.classList.remove("ready");
    indicator.classList.add("spinning");
    indicator.style.transform = "translate(-50%, 10px)";
    checkForUpdate().then(function(status){
      if(status !== "reloading"){ // otherwise the page is already navigating away
        indicator.classList.remove("spinning");
        indicator.style.transform = "";
        indicator.classList.add("hidden");
      }
      startY = null;
    });
  }, {passive:true});
})();

/* =========================================================
   BOOTSTRAP
   ========================================================= */
evaluateRewards();
save();
render();
try{ history.replaceState(currentNavState(), ""); }catch(e){} // the first screen shown on load establishes the baseline
initBottombar();

if(!state.onboarded){
  maybeOfferAutoRestore();
} else {
  maybeShowInstallPrompt();
}

checkForUpdate();
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible") checkForUpdate();
});

checkStoragePersistence();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
</body>
</html>
