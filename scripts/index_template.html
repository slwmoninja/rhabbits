// Chrome/Edge/Android fire this instead of installing immediately, handing
// over an event whose .prompt() shows the native install UI on demand -- so
// it has to be captured up front (page load) and held until the Install
// pill is actually tapped. preventDefault() stops the browser's own
// separate install mini-infobar so this pill is the one path in.
var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener("appinstalled", function(){
  deferredInstallPrompt = null;
  state.installPromptAccepted = true;
  save();
  render();
});
// Shared by the Install pill's tap and the proactive install-prompt popup's
// "Install" button -- one native-vs-manual branch, not two.
function triggerInstall(){
  if(deferredInstallPrompt){
    var promptEvent = deferredInstallPrompt;
    deferredInstallPrompt = null; // one-shot -- the browser invalidates it after a single use either way
    promptEvent.prompt();
    promptEvent.userChoice.then(function(choice){
      if(choice.outcome==="accepted"){
        state.installPromptAccepted = true;
        save();
      }
      render();
    });
  } else {
    // No captured browser-native prompt -- either this browser doesn't
    // support triggering install from a page at all (iOS Safari, plain
    // Firefox), or Chrome/Edge just hasn't fired beforeinstallprompt yet.
    // The manual path always works; there's no signal a page can detect
    // for "the user actually finished the manual steps", so this can't
    // flip to Installed on its own -- only relaunching from the real Home
    // Screen icon can do that.
    openInfoModal("Install on Home Screen", INSTALL_STEPS_HTML);
  }
}
// Proactive "Install rHabbits?" prompt, shown once (ever, per device) after
// onboarding finishes (never during it) when not already installed -- asked,
// not assumed: declining just closes it and points at Profile's Install
// pill for later, and the asked-flag is set either way so this never nags
// on a later visit. A short delay lets beforeinstallprompt (which can
// arrive a moment after load) have a chance to populate
// deferredInstallPrompt first, so "Install" here has the same shot at the
// fast native one-tap path as the pill itself does.
function maybeShowInstallPrompt(){
  if(!state.onboarded) return; // never during onboarding -- see finishOnboarding()
  if(isInstalled()) return;
  if(state.installPromptAsked) return;
  setTimeout(function(){
    if(isInstalled()) return; // could have installed (or been asked elsewhere) during the delay
    state.installPromptAsked = true;
    save();
    var wrap = openInfoModal("Install rHabbits?",
      '<div style="margin-bottom:14px;">Installing adds rHabbits to your Home Screen and gives it the strongest protection against your browser silently clearing its data.</div>' +
      '<button class="btn btn-block" id="install-prompt-yes" style="margin-bottom:8px;">Install</button>' +
      '<button class="btn-ghost btn-block" id="install-prompt-no">Not now</button>'
    );
    wrap.querySelector("#install-prompt-yes").addEventListener("click", function(){ wrap.remove(); triggerInstall(); });
    wrap.querySelector("#install-prompt-no").addEventListener("click", function(){
      wrap.remove();
      showToast("No problem — look for the Install button in your Profile whenever you're ready.");
    });
  }, 1500);
}

// Best-effort ask not to auto-evict this site's storage under low-disk
// pressure -- fire-and-forget; nothing surfaces this on a denial, so
// there's nothing to await or branch on beyond attempting it.
function checkStoragePersistence(){
  if(!(navigator.storage && navigator.storage.persist)) return;
  (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false)).then(function(persisted){
    if(!persisted) navigator.storage.persist().catch(function(){});
  }).catch(function(){});
}

/* =========================================================
   BACKUP / RESTORE -- manual-only, gated entirely behind an explicit tap
   (Profile's "Back up data now", the bottombar Backup icon, or the
   onboarding/auto-restore "Restore" flows). Never called automatically from
   save() or on backgrounding -- an earlier version of this pattern did that
   and it silently piled up dozens of downloaded files plus an
   unsuppressable OS "Download complete" notification every single time.
   The whole state object IS the backup (rHabbits only has the one
   localStorage key, STORAGE_KEY) -- no separate export format to maintain.
   ========================================================= */
// Excluded from the dedup fingerprint below: pure UI/navigation bookkeeping
// that churns on its own (or on every tap) and was never what "back up my
// data" was protecting -- toast/pendingCelebration/screen/onbStep/_draft are
// transient UI state, not user data, and installPromptAsked/Accepted are
// install bookkeeping. Leaving those in would make backupFingerprint()
// change on nearly every render and defeat the dedup entirely.
function backupFingerprint(){
  var d = {
    onboarded: state.onboarded,
    avatar: state.avatar,
    startDate: state.startDate,
    carrots: state.carrots,
    habits: state.habits,
    unlocks: state.unlocks
  };
  return JSON.stringify(d);
}
var BACKUP_LAST_FINGERPRINT_KEY = "rhabbits_last_backup_fingerprint";
var BACKUP_HANDLE_DB = "rhabbits-fs", BACKUP_HANDLE_STORE = "handles", BACKUP_HANDLE_KEY = "backupFile";
function openHandleDb(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(BACKUP_HANDLE_DB, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(BACKUP_HANDLE_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function loadSavedBackupHandle(){
  return openHandleDb().then(function(db){
    return new Promise(function(resolve, reject){
      var req = db.transaction(BACKUP_HANDLE_STORE, "readonly").objectStore(BACKUP_HANDLE_STORE).get(BACKUP_HANDLE_KEY);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  }).catch(function(){ return null; });
}
function saveBackupHandle(handle){
  return openHandleDb().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(BACKUP_HANDLE_STORE, "readwrite");
      tx.objectStore(BACKUP_HANDLE_STORE).put(handle, BACKUP_HANDLE_KEY);
      tx.oncomplete = resolve; tx.onerror = function(){ reject(tx.error); };
    });
  }).catch(function(){ /* best-effort */ });
}
// On browsers with the File System Access API (desktop Chrome/Edge -- absent
// on iOS Safari and most Android Chrome), this lets "Back up now" overwrite
// the SAME on-disk file every time instead of creating a new timestamped one
// on every tap. A saved, already-granted handle is reused silently on every
// call after the first.
function getWritableBackupHandle(){
  if(!window.showSaveFilePicker) return Promise.resolve(null);
  return loadSavedBackupHandle().then(function(handle){
    if(handle){
      return handle.queryPermission({mode:"readwrite"}).then(function(perm){
        if(perm==="granted") return handle;
        return handle.requestPermission({mode:"readwrite"}).then(function(req){
          return req==="granted" ? handle : null;
        });
      });
    }
    return window.showSaveFilePicker({
      suggestedName: "rhabbits-data.json",
      types: [{description:"rHabbits backup", accept:{"application/json":[".json"]}}]
    }).then(function(h){
      return saveBackupHandle(h).then(function(){ return h; });
    });
  }).catch(function(){ return null; }); // user cancelled the picker, or any other failure -- caller falls back
}
// Manual/on-demand only. Skips writing/downloading anything when nothing
// has actually changed since the last backup (see backupFingerprint) --
// without this, repeat taps of "Back up data now" (or the bottombar Backup
// icon) each produce a brand-new timestamped file on any browser without
// the File System Access API (iOS Safari, most Android Chrome -- there's no
// web API on those platforms that can silently overwrite an existing file),
// piling up dozens of near-identical backups over normal use.
function backupNow(){
  var fp = backupFingerprint();
  if(fp === localStorage.getItem(BACKUP_LAST_FINGERPRINT_KEY)){
    showToast("Already up to date — no changes since last backup.");
    return Promise.resolve(false);
  }
  var json = JSON.stringify(state, null, 2);
  return getWritableBackupHandle().then(function(handle){
    if(handle){
      return handle.createWritable().then(function(writable){
        return writable.write(json).then(function(){ return writable.close(); });
      }).then(function(){
        localStorage.setItem(BACKUP_LAST_FINGERPRINT_KEY, fp);
        showToast("Backup saved.");
        return true;
      }).catch(function(){ return downloadBackupFallback(json, fp); });
    }
    return downloadBackupFallback(json, fp);
  });
}
function downloadBackupFallback(json, fp){
  try{
    var blob = new Blob([json], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    // Timestamped, not a fixed name -- a fixed name hits a hard "file
    // already exists" failure on-device rather than a silent auto-rename,
    // on the browsers that land here.
    var stamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.download = "rhabbits-data-"+stamp+".json";
    a.click();
    localStorage.setItem(BACKUP_LAST_FINGERPRINT_KEY, fp);
    showToast("Backup saved to your Downloads.");
    return true;
  }catch(e){
    showToast("Could not save backup: "+e.message);
    return false;
  }
}
function validBackupShape(parsed){
  return !!parsed && typeof parsed==="object" && Array.isArray(parsed.habits) && typeof parsed.unlocks==="object";
}
// Shared by manual restore (Step 7), the onboarding "Restore backup" link,
// and the auto-detected-empty-state restore prompt (see maybeOfferAutoRestore
// below) -- one validate-then-merge implementation, not three.
function applyRestoredState(parsed){
  var merged = Object.assign(defaultState(), parsed);
  merged.unlocks = Object.assign({}, parsed.unlocks || {});
  merged._draft = { name:"", emoji:"🌴", type:"daily", description:"", dueDate:todayStr(), everyUnit:"days", everyN:2, dayOfWeek:new Date().getDay() };
  merged._specialDayDraft = freshSpecialDayDraft();
  merged._detailSpecialDayId = null;
  merged.toast = null;
  merged.pendingCelebration = null;
  merged.pendingTreasureFound = null;
  merged.pendingMapComplete = false;
  merged.screen = "logbook";
  state = merged;
  save();
  render();
  try{ history.replaceState(currentNavState(), ""); }catch(e){}
}
function importDataFromFile(file){
  if(!file) return;
  file.text().then(function(text){
    var parsed;
    try{ parsed = JSON.parse(text); }catch(e){ throw new Error("That file isn't valid JSON."); }
    if(!validBackupShape(parsed)) throw new Error("This file does not look like an rHabbits backup.");
    if(!confirm("This will replace all current data on this device with the contents of this backup. Continue?")) return;
    applyRestoredState(parsed);
    showToast("Backup restored.");
  }).catch(function(e){
    showToast("Could not restore that file: "+e.message);
  });
}
// Picks the newest backup out of one or more selected files, so restoring
// never requires eyeballing filenames. Matches this app's own timestamped
// filename first (sorts correctly as a string); anything that doesn't match
// (e.g. a renamed file) falls back to the File object's own lastModified.
function pickLatestBackupFile(files){
  var list = Array.prototype.filter.call(files||[], function(f){ return /\.json$/i.test(f.name); });
  if(list.length===0) return null;
  function stampOf(f){
    var m = f.name.match(/rhabbits-data-(.+)\.json$/i);
    return m ? m[1] : null;
  }
  list.sort(function(a,b){
    var sa=stampOf(a), sb=stampOf(b);
    if(sa && sb) return sa<sb ? 1 : sa>sb ? -1 : 0;
    if(sa && !sb) return -1;
    if(sb && !sa) return 1;
    return b.lastModified - a.lastModified;
  });
  return list[0];
}
function importLatestBackupFromFiles(files){
  var latest = pickLatestBackupFile(files);
  if(!latest){ if(files && files.length) showToast("No .json backup file found in what you selected."); return; }
  importDataFromFile(latest);
}
// On browsers that support it, jumps the native picker straight into the
// Downloads folder and allows multi-select in one go. iOS Safari and most
// Android browsers fall back to the plain <input type=file> picker passed in.
// Returns a Promise resolving to "native" (a file was picked and handed to
// importLatestBackupFromFiles), "cancelled" (user backed out of the native
// picker), or "fallback-clicked" (fallbackInputEl.click() was invoked --
// its own "change" listener, wired by the caller, handles the rest once a
// file is actually chosen). Callers that don't need this (Profile/
// onboarding's plain "Restore from backup" buttons) can just ignore it.
function openBackupRestorePicker(fallbackInputEl){
  if(window.showOpenFilePicker){
    return window.showOpenFilePicker({
      multiple: true,
      startIn: "downloads",
      types: [{description:"rHabbits backup", accept:{"application/json":[".json"]}}]
    }).then(function(handles){
      return Promise.all(handles.map(function(h){ return h.getFile(); }));
    }).then(function(files){
      importLatestBackupFromFiles(files);
      return "native";
    }).catch(function(e){
      if(e && e.name==="AbortError") return "cancelled"; // user backed out -- don't chain into a second picker
      if(fallbackInputEl) fallbackInputEl.click();
      return "fallback-clicked";
    });
  }
  if(fallbackInputEl) fallbackInputEl.click();
  return Promise.resolve("fallback-clicked");
}

/* =========================================================
   RESTORE PROMPT AT STARTUP (auto-detect) -- proactively offers to restore
   when the app's own on-device data looks freshly wiped (fresh browser
   profile, a "Clear browsing data" wipe, storage eviction) but a prior
   backup is still reachable. Only ever runs while !state.onboarded (the
   app's own definition of "looks empty" -- see maybeOfferAutoRestore),
   which also means it naturally never fights with maybeShowInstallPrompt()
   (that one is gated on state.onboarded being true).
   ========================================================= */
// Path A -- silent handle re-read, File System Access browsers only. Query
// only, never requestPermission() here: escalating permission needs a user
// gesture, and there isn't one this early in the page lifecycle.
function tryAutoRestorePathA(){
  if(!window.showSaveFilePicker) return Promise.resolve(false);
  return loadSavedBackupHandle().then(function(handle){
    if(!handle) return false;
    return handle.queryPermission({mode:"read"}).then(function(perm){
      if(perm!=="granted") return false;
      return handle.getFile().then(function(file){ return file.text(); }).then(function(text){
        var parsed = JSON.parse(text);
        if(!validBackupShape(parsed)) return false;
        offerAutoRestore(parsed);
        return true;
      });
    });
  }).catch(function(){ return false; });
}
function offerAutoRestore(parsed){
  var n = (parsed.habits||[]).length;
  var when = parsed.startDate || "a previous session";
  var wrap = openInfoModal("Restore your data?",
    '<div style="margin-bottom:14px;">This device\'s rHabbits data looks empty, but a backup was found — '+n+' rHabbit(s) since '+escapeHtml(when)+'. Restore it?</div>' +
    '<button class="btn btn-block" id="ar-yes" style="margin-bottom:8px;">Restore</button>' +
    '<button class="btn-ghost btn-block" id="ar-no">No, start fresh</button>'
  );
  wrap.querySelector("#ar-yes").addEventListener("click", function(){
    wrap.remove();
    applyRestoredState(parsed);
    showToast("Backup restored.");
    maybeShowInstallPrompt();
  });
  wrap.querySelector("#ar-no").addEventListener("click", function(){
    wrap.remove();
    maybeShowInstallPrompt();
  });
}
// Path B -- every other browser (most phones: iOS Safari, most Android
// Chrome). Nothing can be silently re-read here without a user gesture, so
// the proactive prompt itself IS the ask -- its button goes straight to the
// open-file-picker flow the moment it's tapped.
function offerAutoRestorePathB(){
  var wrap = openInfoModal("Restore your data?",
    '<div style="margin-bottom:14px;">This device\'s rHabbits data looks empty. If you have a backup file saved, you can restore it now.</div>' +
    '<button class="btn btn-block" id="ar-yes" style="margin-bottom:8px;">Restore from file&hellip;</button>' +
    '<input type="file" id="ar-file-input" accept="application/json,.json" class="hidden">' +
    '<button class="btn-ghost btn-block" id="ar-no">No, start fresh</button>'
  );
  var fileInput = wrap.querySelector("#ar-file-input");
  wrap.querySelector("#ar-yes").addEventListener("click", function(){
    // Deliberately does NOT remove/detach wrap (or fileInput, which lives
    // inside it) before calling this -- a detached <input type=file> isn't
    // guaranteed to still open its native picker on a synthetic .click() in
    // every browser. Left in place until we know which path was taken:
    // "native"/"cancelled" clean up here; "fallback-clicked" is cleaned up
    // by the input's own "change" listener below once a file is chosen.
    openBackupRestorePicker(fileInput).then(function(result){
      if(result==="native" || result==="cancelled"){ wrap.remove(); maybeShowInstallPrompt(); }
    });
  });
  fileInput.addEventListener("change", function(){
    wrap.remove();
    importLatestBackupFromFiles(fileInput.files);
    maybeShowInstallPrompt();
  });
  wrap.querySelector("#ar-no").addEventListener("click", function(){ wrap.remove(); maybeShowInstallPrompt(); });
}
function maybeOfferAutoRestore(){
  if(state.onboarded) return; // real on-device data exists -- never prompt over it
  // Every brand-new first-ever visit also has empty state by definition, so
  // gating on emptiness alone would show "Restore your data?" to people who
  // have never used the app at all. This flow exists for the installed-app-
  // got-wiped case specifically -- only offer it once there's a real signal
  // this device previously ran the app as an installed PWA.
  if(!isInstalled()) return;
  tryAutoRestorePathA().then(function(handled){
    if(!handled) offerAutoRestorePathB();
  });
}

/* =========================================================
   UPDATE CHECKING -- two independent signals, run together (see
   checkForUpdate). Deliberately does NOT reload while a field is focused;
   it just defers and retries on the next check instead of yanking an
   in-progress habit name out from under someone.
   ========================================================= */
function isUserTyping(){
  var el = document.activeElement;
  if(!el) return false;
  if(el.tagName === "TEXTAREA") return true;
  if(el.tagName === "INPUT") return /^(text|search|number)$/i.test(el.type || "text");
  return false;
}
// Signal 1: index.html's own etag/last-modified, remembered across sessions
// so the very first check of a new session can catch "what got served just
// now is already behind what's on the server."
var DEPLOYED_TAG_KEY = "rhabbitsDeployedTag";
var deployedVersionTag = (function(){ try{ return localStorage.getItem(DEPLOYED_TAG_KEY); }catch(e){ return null; } })();
// Signal 2: forces the service worker's own update check right now instead
// of waiting on the browser's lazy schedule (up to ~24h). Once a genuinely
// new worker activates (it calls skipWaiting()/clients.claim() itself --
// see sw.js), 'controllerchange' fires and that's what actually triggers
// the reload, not reg.update() itself (which only starts the check).
var swReloadPending = false, swReloadTriggered = false;
function reloadForNewServiceWorker(){
  if(swReloadTriggered) return; // controllerchange can fire more than once per page life
  if(isUserTyping()){ swReloadPending = true; return; } // retried from checkForUpdate's next call
  swReloadTriggered = true;
  // See purgeCachedShell() below (defined later in this file, but function
  // declarations hoist) -- same stale-reload risk as checkForUpdate()'s own
  // reload, so the same fix applies here.
  purgeCachedShell().then(function(){ location.reload(); });
}
if(navigator.serviceWorker){
  navigator.serviceWorker.addEventListener("controllerchange", reloadForNewServiceWorker);
}
// Returns a status string so callers wanting feedback (pull-to-refresh) can
// react -- the interval/visibilitychange callers just ignore it.
// Deletes index.html from every Cache Storage bucket this origin owns
// (not just sw.js's current CACHE_NAME -- reading that constant from here
// would just be a second copy to keep in sync) so the reload triggered
// below actually gets fresh content. Without this, sw.js's fetch handler
// is stale-while-revalidate: it answers a navigation from cache FIRST and
// only refreshes that cache in the background, so location.reload() alone
// would just redisplay the exact same stale page it was trying to escape,
// while deployedVersionTag above has *already* been bumped to the new tag
// -- meaning every check after that reload sees "tag === deployedVersionTag"
// and never retries. The only way out at that point used to be manually
// clearing site data.
function purgeCachedShell(){
  if(!("caches" in window)) return Promise.resolve();
  return caches.keys().then(function(names){
    return Promise.all(names.map(function(n){
      return caches.open(n).then(function(c){ return c.delete("./index.html"); });
    }));
  }).catch(function(){});
}
function checkForUpdate(){
  if(swReloadPending && !isUserTyping()){ reloadForNewServiceWorker(); return Promise.resolve("reloading"); }
  var swCheck = (navigator.serviceWorker && navigator.serviceWorker.getRegistration)
    ? navigator.serviceWorker.getRegistration().then(function(reg){ if(reg) reg.update().catch(function(){}); }).catch(function(){})
    : Promise.resolve();
  return swCheck.then(function(){
    return fetch(location.pathname+"?_="+Date.now(), {cache:"no-store", method:"HEAD"}).then(function(res){
      var tag = res.headers.get("etag") || res.headers.get("last-modified");
      if(!tag) return "unknown";
      if(deployedVersionTag===null){
        deployedVersionTag = tag;
        try{ localStorage.setItem(DEPLOYED_TAG_KEY, tag); }catch(e){}
        return "up-to-date";
      }
      if(tag===deployedVersionTag) return "up-to-date";
      if(isUserTyping()) return "deferred";
      deployedVersionTag = tag;
      try{ localStorage.setItem(DEPLOYED_TAG_KEY, tag); }catch(e){}
      return purgeCachedShell().then(function(){
        location.reload();
        return "reloading";
      });
    }).catch(function(){ return "offline"; }); // offline or blocked -- silently skip, next successful check catches up
  });
}

/* =========================================================
   BOTTOM NAV -- lives in the page shell (a sibling of #app in <body>), not
   inside the DOM subtree render() tears down and rebuilds, so its click
   handlers are wired exactly ONCE at bootstrap (initBottombar, called
   below) rather than from wireEvents(), which re-runs on every render().
   Wiring it from wireEvents() instead would accumulate one additional
   listener on these same nodes every single render -- a single tap would
   then fire backupNow() once per render that's happened since page load.
   ========================================================= */
function initBottombar(){
  var bar = document.getElementById("bottombar");
  if(!bar) return;
  var buttons = bar.querySelectorAll("[data-nav]");
  buttons.forEach(function(btn){
    btn.addEventListener("click", function(){
      var target = btn.getAttribute("data-nav");
      if(target==="backup"){ backupNow(); return; }
      if(state.screen===target) return; // already there -- no-op push
      navigateTo(function(){ state.screen = target; });
    });
  });
}
// Called at the end of every render() to keep the (persistent, un-rebuilt)
// bottombar's visibility and active-tab highlight in sync with state.
function syncBottombarUI(){
  var bar = document.getElementById("bottombar");
  if(!bar) return;
  bar.classList.toggle("hidden", !state.onboarded);
  bar.querySelectorAll("[data-nav]").forEach(function(btn){
    var target = btn.getAttribute("data-nav");
    btn.classList.toggle("active", target===state.screen);
  });
}

/* =========================================================
   COCO CANNON -- Space-Invaders-style mini-game reward. Runs on a
   persistent canvas kept OUTSIDE the render()-owned #app subtree (see the
   HTML comment above #cocoScreen) -- render() replaces #app's entire
   innerHTML on every state change, which would tear down a live canvas +
   its 2D context mid-frame, every single habit toggle.

   Levels 1-7 spawn that many crows at once (level N = N crows). Advancing
   requires actually shooting down N crows total -- a crow that escapes
   past the danger line costs a life but doesn't count toward that, and
   the same wave (same crow count) respawns until the player has shot
   down all of them (see levelKills in initCocoCannon()). After level 7,
   Captain Crow appears alone -- a red crow that takes 3 hits instead of 1,
   falls faster than any regular crow, and respawns rather than being
   skipped if he reaches the ground undefeated -- then it loops back to
   level 1. cocoLives IS state.cocoLives directly (see evaluateCocoCannon()
   above): it resets, once per day, to that day's ration (day 1 = 1 life,
   day 2 = 2, up to 7) rather than accumulating +1 on top of whatever's
   left, and spending only happens when a crow reaches the bottom row, so
   quitting mid-level never costs anything.
   ========================================================= */
var COCO_MAX_LEVEL = 7; // Captain Crow is the encounter right after this, then it loops back to 1

// Real cutout photos (see scripts/process_coco_assets.py) -- preloaded
// once, module-scope, rather than per-frame. Fall back to a plain hand-
// drawn shape if a data-URI image somehow isn't decoded yet on a given
// frame (should be effectively instant with no network round-trip, but
// costs nothing to guard against a blank frame).
var cocoImgCannon = new Image(); cocoImgCannon.src = ASSET.coco_cannon_img;
var cocoImgCrow = new Image(); cocoImgCrow.src = ASSET.coco_crow;
var cocoImgCrowRed = new Image(); cocoImgCrowRed.src = ASSET.coco_crow_red;
var cocoImgCoconut = new Image(); cocoImgCoconut.src = ASSET.coco_coconut;

function cocoImgAspect(img, fallback){
  return (img.complete && img.naturalWidth) ? img.naturalHeight/img.naturalWidth : fallback;
}
function cocoDrawCrow(ctx, x, y, isCaptain){
  var img = isCaptain ? cocoImgCrowRed : cocoImgCrow;
  var w = isCaptain ? 44 : 34; // 30% larger than the original 34/26
  var h = w * cocoImgAspect(img, 0.7);
  if(img.complete && img.naturalWidth){
    ctx.drawImage(img, x-w/2, y-h/2, w, h);
  } else {
    ctx.fillStyle = isCaptain ? "#a33a2c" : "#241a10";
    ctx.beginPath(); ctx.ellipse(x, y, w*0.4, h*0.4, 0, 0, Math.PI*2); ctx.fill();
  }
}
// Barrel-only real photo -- the fixed mount/base it pivots on (see
// cocoCannonBarrelLen()/update()'s swivel-aim handling) is still a simple
// hand-drawn shape, drawn separately and un-rotated in draw().
function cocoDrawCannonBarrel(ctx, x, y, angle, w){
  var h = w * cocoImgAspect(cocoImgCannon, 4.4);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  if(cocoImgCannon.complete && cocoImgCannon.naturalWidth){
    ctx.drawImage(cocoImgCannon, -w/2, -h, w, h);
  } else {
    ctx.fillStyle = "#3e2714";
    ctx.fillRect(-w*0.15, -h, w*0.3, h);
  }
  ctx.restore();
}
function cocoDrawCannonBase(ctx, x, y, w){
  ctx.fillStyle = "#241a10";
  ctx.beginPath(); ctx.ellipse(x, y+4, w*0.55, w*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#3e2714";
  ctx.beginPath(); ctx.ellipse(x, y, w*0.42, w*0.18, 0, 0, Math.PI*2); ctx.fill();
}
function cocoDrawCoconut(ctx, x, y){
  var img = cocoImgCoconut;
  var w = 20, h = w * cocoImgAspect(img, 1);
  if(img.complete && img.naturalWidth){
    ctx.drawImage(img, x-w/2, y-h/2, w, h);
  } else {
    ctx.fillStyle = "#6b4526";
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill();
  }
}
// Small burst of fading gray puffs at the muzzle tip on every shot fired.
function cocoSpawnSmoke(list, x, y){
  for(var i=0;i<5;i++){
    list.push({
      x:x, y:y,
      vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*40 - 20,
      age:0, maxAge:0.4+Math.random()*0.2, r:3+Math.random()*3
    });
  }
}
// Small gold star burst at a crow's position on every hit (not just the
// killing one) -- Captain Crow's 3 hits each get their own burst.
function cocoSpawnStars(list, x, y){
  for(var i=0;i<5;i++){
    var ang = (i/5)*Math.PI*2 + Math.random()*0.4;
    list.push({
      x:x, y:y,
      vx:Math.cos(ang)*50, vy:Math.sin(ang)*50 - 10,
      age:0, maxAge:0.35+Math.random()*0.15, size:10+Math.random()*4
    });
  }
}
function cocoUpdateParticles(list, dt){
  for(var i=list.length-1;i>=0;i--){
    var p = list[i];
    p.age += dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    if(p.age>=p.maxAge) list.splice(i,1);
  }
}
function cocoDrawSmoke(ctx, list){
  ctx.fillStyle = "#d8d4c8";
  for(var i=0;i<list.length;i++){
    var p = list[i], t = p.age/p.maxAge;
    ctx.globalAlpha = Math.max(0, 1-t);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(1+t*1.5), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function cocoDrawStars(ctx, list){
  ctx.fillStyle = "#f0c93e";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(var i=0;i<list.length;i++){
    var p = list[i], t = p.age/p.maxAge;
    ctx.globalAlpha = Math.max(0, 1-t);
    ctx.font = Math.round(p.size*(1-t*0.3))+"px sans-serif";
    ctx.fillText("★", p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

// Reassigned by initCocoCannon() (called once at bootstrap, below) --
// declared up front so syncCocoScreenUI() always has something callable
// even on the very first render() before bootstrap finishes wiring it.
var cocoStart = function(){}, cocoStop = function(){};

function initCocoCannon(){
  var screenEl = document.getElementById("cocoScreen");
  if(!screenEl) return; // defensive -- always present in the real page shell
  var canvas = document.getElementById("cocoCanvas");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("cocoOverlay");
  var livesEl = document.getElementById("cocoLivesDisplay");
  var scoreEl = document.getElementById("cocoScoreDisplay");
  var leftBtn = document.getElementById("cocoLeftBtn");
  var rightBtn = document.getElementById("cocoRightBtn");
  var fireBtn = document.getElementById("cocoFireBtn");
  var backBtn = screenEl.querySelector("[data-coco-back]");

  var W = 320, H = 480; // logical (CSS-pixel) play-field size, recomputed on resize
  var running = false, rafId = null, lastTs = 0;
  var moveLeft = false, moveRight = false;
  var cannon, coconut, crows, level, score, phase, sinceLevelStart, smoke, stars, levelKills;

  var MAX_ANGLE = Math.PI/2; // full turret sweep: straight left/ground to straight right/ground

  function resizeCanvas(){
    var rect = canvas.parentNode.getBoundingClientRect();
    W = Math.max(200, rect.width);
    H = Math.max(280, rect.height);
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W*dpr);
    canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function cannonY(){ return H*0.90; }
  function dangerY(){ return H*0.84; }
  function clampAngle(a){ return Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, a)); }
  // Direction the barrel currently points, as a unit vector -- angle 0 is
  // straight up, +-MAX_ANGLE is straight along the ground to the right/left.
  function aimDir(){ return { x: Math.sin(cannon.angle), y: -Math.cos(cannon.angle) }; }
  function barrelLen(){ return cannon.w * cocoImgAspect(cocoImgCannon, 4.4) * 0.92; }

  function newCrow(isCaptain){
    return {
      baseX: 30 + Math.random()*(W-60),
      y: -20 - Math.random()*40,
      phase: Math.random()*Math.PI*2,
      hp: isCaptain ? 3 : 1,
      captain: !!isCaptain,
      alive: true
    };
  }
  function levelCrowSpeed(isCaptain){
    // Captain Crow moves a bit faster than any regular level -- levels 1-7
    // ramp gently, level 7's own speed is the ceiling for "regular" crows.
    if(isCaptain) return (34 + (COCO_MAX_LEVEL-1)*3) * 1.35;
    return 34 + (level-1)*3; // px/sec
  }
  function spawnLevel(){
    crows = [];
    if(level > COCO_MAX_LEVEL){ crows.push(newCrow(true)); }
    else { for(var i=0;i<level;i++){ crows.push(newCrow(false)); } }
    sinceLevelStart = 0;
  }
  function resetGame(){
    // The base is fixed at bottom-center and never moves -- only the
    // barrel's aim angle changes, by holding a direction button/key (see
    // update()'s moveLeft/moveRight handling).
    cannon = { x0: W/2, angle: 0, w: 13, rotSpeed: 1.85 }; // rad/sec while held; x0 is the fixed base position -- w halved from 26 (see close-range hit tolerance boost in update() below, which compensates for the shorter barrel this implies)
    coconut = null;
    smoke = []; stars = [];
    // Resume from the last level-cleared checkpoint (see saveCocoCheckpoint())
    // rather than always level 1/score 0 -- this only runs once, the first
    // time start() is ever called after a fresh page load, so it's exactly
    // the "reopened the app" moment a mid-level exit should resume from.
    level = state.cocoCheckpointLevel || 1;
    levelKills = 0;
    score = state.cocoCheckpointScore || 0;
    phase = "ready";
    spawnLevel();
    updateHud();
    draw();
    showOverlay();
  }
  function updateHud(){
    livesEl.innerHTML = carrotPipsHtml(state.cocoLives, 7);
    scoreEl.textContent = "Score: " + score;
  }
  function showOverlay(){
    overlay.classList.remove("hidden");
    if(phase==="ready"){
      overlay.innerHTML =
        '<h3>Coco Cannon</h3>' +
        '<p>Captain Crow and his flock are after your carrot seeds. Shoot them down before they land!</p>' +
        (level>1 ? '<div class="coco-sub">Resuming at Level '+level+' · Score '+score+'</div>' : '') +
        (state.cocoHighScore ? '<div class="coco-sub">Best score: '+state.cocoHighScore+'</div>' : '') +
        (state.cocoLives>0
          ? '<button class="btn" id="cocoStartBtn">Start</button>'
          : '<p>You\'re out of carrots -- log a rHabbit today to earn one.</p>');
    } else if(phase==="gameover"){
      var beat = score>0 && score===state.cocoHighScore;
      overlay.innerHTML =
        '<h3>Garden Overrun!</h3>' +
        '<p>Final score: '+score+(beat?' -- new best!':'')+'</p>' +
        (state.cocoLives>0
          ? '<button class="btn" id="cocoStartBtn">Play Again</button>'
          : '<p>Log a rHabbit today to earn another life.</p>');
    }
    var startBtn = document.getElementById("cocoStartBtn");
    if(startBtn) startBtn.addEventListener("click", startPlaying);
  }
  function hideOverlay(){ overlay.classList.add("hidden"); overlay.innerHTML = ""; }
  // Non-interactive banner shown over live gameplay (not gated behind
  // "ready"/"gameover" like showOverlay()) -- pauses crow/cannon/coconut
  // updates for a beat (see update()'s phase==="banner" guard) while smoke/
  // star particles keep animating, then hands off to a fresh level 1.
  function showWinBanner(){
    phase = "banner";
    overlay.classList.remove("hidden");
    overlay.innerHTML = '<h3>🎉 Win!</h3><p>Captain Crow retreats -- the garden is safe, for now.</p>';
    setTimeout(function(){
      hideOverlay();
      level = 1;
      levelKills = 0;
      spawnLevel();
      phase = "playing";
      saveCocoCheckpoint(level, score);
    }, 1600);
  }
  // Shown exactly once, right after the one-time trial top-up in
  // startPlaying() below -- unlike showWinBanner() this needs a tap (not a
  // timeout) since it's the very first thing a brand new player sees, and
  // it's worth making sure the expiry warning actually registers rather
  // than risking it flashing by unread.
  function showTrialBanner(){
    phase = "trial-intro";
    overlay.classList.remove("hidden");
    overlay.innerHTML =
      '<h3>🥕 7 Free Carrots!</h3>' +
      '<p>You\'ve got a full week\'s worth of lives today only, so you can really get a feel for the game. They expire tomorrow -- make them count!</p>' +
      '<button class="btn" id="cocoTrialOkBtn">Let\'s Go!</button>';
    var okBtn = document.getElementById("cocoTrialOkBtn");
    if(okBtn) okBtn.addEventListener("click", function(){
      phase = "playing";
      hideOverlay();
      updateHud();
    });
  }

  function startPlaying(){
    // One-time practice budget: the very first time the player actually
    // presses Start (not just when the reward unlocks), top them up to the
    // full 7 lives so their first session has room to see most of what the
    // game does, regardless of which day's ration they'd otherwise have --
    // then explain the tradeoff via showTrialBanner() instead of dropping
    // straight into gameplay, since it's a one-time deal worth reading.
    if(!state.cocoTrialGrantedOn){
      state.cocoTrialGrantedOn = todayStr();
      state.cocoLives = 7;
      save();
      updateHud();
      showTrialBanner();
      return;
    }
    if(state.cocoLives<=0){ showOverlay(); return; }
    if(phase==="gameover"){ level=1; levelKills=0; score=0; spawnLevel(); }
    phase = "playing";
    hideOverlay();
    updateHud();
  }
  function loseLife(){
    state.cocoLives = Math.max(0, state.cocoLives-1);
    save();
    updateHud();
    if(state.cocoLives<=0) endGame();
  }
  // Persists the run's current level+score as the resume point (see
  // resetGame()) -- called only at the moment a level is actually cleared
  // (or a fresh run/level 1 begins), never mid-level, so a level in
  // progress when the app closes is never itself the checkpoint.
  function saveCocoCheckpoint(lvl, sc){
    state.cocoCheckpointLevel = lvl;
    state.cocoCheckpointScore = sc;
    save();
  }
  function endGame(){
    phase = "gameover";
    if(score > state.cocoHighScore){ state.cocoHighScore = score; save(); }
    // The run is over -- the next Start (whether "Play Again" now or
    // reopening the app later) begins a brand new run at level 1, not a
    // resume of this dead one.
    saveCocoCheckpoint(1, 0);
    showOverlay();
  }
  function fire(){
    if(phase!=="playing" || coconut) return; // one coconut in flight at a time, classic Space Invaders balance
    var dir = aimDir(), len = barrelLen();
    var tipX = cannon.x0 + dir.x*len, tipY = cannonY() + dir.y*len;
    coconut = { x: tipX, y: tipY, vx: dir.x*260, vy: dir.y*260 };
    cocoSpawnSmoke(smoke, tipX, tipY);
  }

  function update(dt){
    cocoUpdateParticles(smoke, dt);
    cocoUpdateParticles(stars, dt);
    if(phase!=="playing") return;
    sinceLevelStart += dt;
    if(moveLeft) cannon.angle = clampAngle(cannon.angle - cannon.rotSpeed*dt);
    if(moveRight) cannon.angle = clampAngle(cannon.angle + cannon.rotSpeed*dt);

    if(coconut){
      coconut.x += coconut.vx*dt;
      coconut.y += coconut.vy*dt;
      if(coconut.y < -10 || coconut.x < -10 || coconut.x > W+10) coconut = null;
    }

    var anyAlive = false;
    for(var i=0;i<crows.length;i++){
      var c = crows[i];
      if(!c.alive) continue;
      anyAlive = true;
      c.y += levelCrowSpeed(c.captain)*dt;
      c.drawX = c.baseX + Math.sin(sinceLevelStart*2 + c.phase) * 14;
      if(coconut){
        var dx = c.drawX - coconut.x, dy = c.y - coconut.y;
        // Crows low enough to be near the danger line force a near-horizontal
        // shot from the (now smaller/shorter-barreled) cannon -- a steep angle
        // where a small aim error swings the muzzle a lot, and there's very
        // little vertical travel left before the crow's gone -- so widen the
        // hit window a bit down there specifically, rather than making every
        // shot easier across the board.
        var closeRange = c.y > H*0.6;
        var hitTol = closeRange ? 24 : 18; // 18 matches the 30%-larger crow sprite
        if(Math.abs(dx) < hitTol && Math.abs(dy) < hitTol){
          c.hp--;
          coconut = null;
          cocoSpawnStars(stars, c.drawX, c.y);
          if(c.hp<=0){
            c.alive = false;
            if(c.captain){
              score += 500;
              updateHud();
              showWinBanner(); // handles the level=1 restart itself, once the banner clears
            } else {
              score += 10*level;
              levelKills++;
              updateHud();
            }
          }
        }
      }
      if(c.alive && c.y >= dangerY()){
        c.alive = false;
        loseLife();
      }
    }
    if(!anyAlive && phase==="playing"){
      if(level > COCO_MAX_LEVEL){
        // Captain Crow reached the ground without being fully defeated --
        // face him again rather than handing the player a free win.
        spawnLevel();
      } else if(levelKills < level){
        // Some of this level's crows escaped instead of being shot down --
        // repeat the same level (same crow count) until the player has
        // actually eliminated all of them before moving on.
        spawnLevel();
      } else {
        level++;
        levelKills = 0;
        spawnLevel();
        saveCocoCheckpoint(level, score);
      }
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#2a1f14";
    ctx.fillRect(0, H-28, W, 28); // soil floor band
    cocoDrawCannonBase(ctx, cannon.x0, cannonY(), cannon.w);
    cocoDrawCannonBarrel(ctx, cannon.x0, cannonY(), cannon.angle, cannon.w);
    cocoDrawSmoke(ctx, smoke);
    if(coconut) cocoDrawCoconut(ctx, coconut.x, coconut.y);
    for(var i=0;i<crows.length;i++){
      var c = crows[i];
      if(!c.alive) continue;
      cocoDrawCrow(ctx, c.drawX!==undefined ? c.drawX : c.baseX, c.y, c.captain);
    }
    cocoDrawStars(ctx, stars);
  }

  function loop(ts){
    if(!running) return;
    var dt = Math.min(0.05, (ts-lastTs)/1000 || 0);
    lastTs = ts;
    update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }
  function start(){
    if(running) return;
    running = true;
    resizeCanvas();
    if(!cannon) resetGame(); else { updateHud(); draw(); if(phase!=="playing" && phase!=="banner" && phase!=="trial-intro") showOverlay(); }
    lastTs = (window.performance && performance.now) ? performance.now() : Date.now();
    rafId = requestAnimationFrame(loop);
  }
  function stop(){
    running = false;
    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  }

  // Hold-only aiming -- no tap-to-nudge. A quick-tap gesture on Android is
  // reserved by the OS/browser for double-tap-to-zoom, so a tap-based nudge
  // on these buttons would fight that system gesture instead of aiming.
  function dirDown(sign){
    if(sign<0) moveLeft=true; else moveRight=true;
  }
  function dirUp(sign){
    if(sign<0) moveLeft=false; else moveRight=false;
  }
  // Wired exactly once here, like initBottombar() -- never from wireEvents().
  function bindDir(btn, sign){
    btn.addEventListener("touchstart", function(e){ e.preventDefault(); dirDown(sign); }, {passive:false});
    btn.addEventListener("touchend", function(e){ e.preventDefault(); dirUp(sign); }, {passive:false});
    btn.addEventListener("mousedown", function(){ dirDown(sign); });
    btn.addEventListener("mouseup", function(){ dirUp(sign); });
    btn.addEventListener("mouseleave", function(){ if(sign<0) moveLeft=false; else moveRight=false; });
  }
  bindDir(leftBtn, -1);
  bindDir(rightBtn, 1);
  fireBtn.addEventListener("click", fire);
  backBtn.addEventListener("click", function(){ closeModal(); });
  document.addEventListener("keydown", function(e){
    if(state.screen!=="coco-cannon") return;
    // Guard against key-repeat re-firing dirDown() on every repeated
    // keydown while a key is held -- harmless either way, just noise.
    if(e.key==="ArrowLeft"){ if(!moveLeft) dirDown(-1); }
    else if(e.key==="ArrowRight"){ if(!moveRight) dirDown(1); }
    else if(e.key===" "){ e.preventDefault(); fire(); }
  });
  document.addEventListener("keyup", function(e){
    if(e.key==="ArrowLeft") dirUp(-1);
    else if(e.key==="ArrowRight") dirUp(1);
  });
  window.addEventListener("resize", function(){ if(running) resizeCanvas(); });

  cocoStart = start;
  cocoStop = stop;
}
// Called at the end of every render() (see render() above) to start/stop
// the game loop and show/hide the persistent canvas based on state.screen
// -- same reasoning as syncBottombarUI().
function syncCocoScreenUI(){
  var el = document.getElementById("cocoScreen");
  if(!el) return;
  var active = state.screen === "coco-cannon";
  el.classList.toggle("hidden", !active);
  if(active) cocoStart(); else cocoStop();
}

/* =========================================================
   PULL-TO-REFRESH -- forces an update check on demand instead of waiting
   for backgrounding/foregrounding to trigger one. Only activates when the
   touch starts at the very top of the page's scroll (this app's screens all
   scroll the whole document, no per-screen internal scroll container) and
   no modal is open, so it doesn't fight normal scrolling or a modal's own
   touch handling.
   ========================================================= */
(function(){
  var indicator = document.getElementById("pullRefresh");
  if(!indicator) return;
  var THRESHOLD = 70;
  var startY = null, dragging = false, ready = false;
  document.addEventListener("touchstart", function(e){
    if(window.scrollY===0 && !document.querySelector(".modal-backdrop")){
      startY = e.touches[0].clientY;
      dragging = true; ready = false;
      indicator.classList.remove("hidden");
      indicator.classList.add("dragging");
    }
  }, {passive:true});
  document.addEventListener("touchmove", function(e){
    if(!dragging || startY===null) return;
    var dy = e.touches[0].clientY - startY;
    if(dy>0 && window.scrollY===0){
      var dist = Math.min(dy, THRESHOLD*1.6);
      ready = dy > THRESHOLD;
      indicator.style.transform = "translate(-50%, "+(dist-60)+"px)";
      indicator.classList.toggle("ready", ready);
    }
  }, {passive:true});
  document.addEventListener("touchend", function(){
    if(!dragging) return;
    dragging = false;
    indicator.classList.remove("dragging");
    if(!ready){
      indicator.classList.remove("ready");
      indicator.style.transform = "";
      indicator.classList.add("hidden");
      startY = null;
      return;
    }
    indicator.classList.remove("ready");
    indicator.classList.add("spinning");
    indicator.style.transform = "translate(-50%, 10px)";
    checkForUpdate().then(function(status){
      if(status !== "reloading"){ // otherwise the page is already navigating away
        indicator.classList.remove("spinning");
        indicator.style.transform = "";
        indicator.classList.add("hidden");
      }
      startY = null;
    });
  }, {passive:true});
})();

/* =========================================================
   BOOTSTRAP
   ========================================================= */
evaluateRewards();
save();
render();
try{ history.replaceState(currentNavState(), ""); }catch(e){} // the first screen shown on load establishes the baseline
initBottombar();
initCocoCannon();

if(!state.onboarded){
  maybeOfferAutoRestore();
} else {
  maybeShowInstallPrompt();
}

checkForUpdate();
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible") checkForUpdate();
});

checkStoragePersistence();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
})();
</script>
</body>
</html>
