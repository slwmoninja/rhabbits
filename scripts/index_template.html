<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rHabbits</title>
<meta name="description" content="Build better rHabbits by tracking daily progress and earning carrots.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<!-- iOS Safari reads this tag (not manifest.json) for the Home Screen icon.
     The ?v= hash must be kept in sync with icon-192.png's content by hand for
     now -- scripts/sync_icon_version.py only stamps manifest.json today, not
     this tag or index_template.html. Recompute (sha256 of icon-192.png,
     first 8 hex chars) and bump this whenever icon-192.png's bytes change,
     or iPhone installs will keep showing a stale icon after an update. -->
<link rel="apple-touch-icon" href="./icon-192.png?v=fce2a942">
<meta name="theme-color" content="#0E3634">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="rHabbits">
<style>
:root{
  --ink:#241a10;
  --teal-deep:#0e3634;
  --teal-glow:#1b534e;
  --teal-glow2:#123f3c;
  --parchment:#f1e4c2;
  --parchment-hi:#f8efd8;
  --parchment-edge:#d9c48f;
  --wood:#6b4526;
  --wood-dark:#3e2714;
  --wood-darker:#2a1a0d;
  --carrot:#e07b2e;
  --carrot-deep:#b85a1b;
  --leaf:#5c7a3f;
  --leaf-deep:#3f5a2a;
  --gold:#c6992f;
  --danger:#a33a2c;
  --shadow: 0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 50% -10%, var(--teal-glow) 0%, transparent 60%),
    linear-gradient(180deg, var(--teal-glow2) 0%, var(--teal-deep) 55%, #082523 100%);
  background-attachment:fixed;
  min-height:100%;
}
h1,h2,h3,h4{
  font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  margin:0 0 .4em;
  letter-spacing:.02em;
}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
#app{max-width:480px; margin:0 auto; min-height:100%; padding-bottom:96px; position:relative;}
.hidden{display:none !important;}

/* ---------- Onboarding ---------- */
.onb-screen{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:36px 24px;
  text-align:center;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.onb-logo img{width:132px; height:132px; object-fit:contain; margin:0 auto 18px; filter:drop-shadow(0 10px 16px rgba(0,0,0,.45));}
.onb-title{
  color:var(--parchment-hi);
  font-size:2.5rem;
  text-shadow:0 3px 0 var(--wood-darker), 0 8px 18px rgba(0,0,0,.5);
}
.onb-sub{color:var(--parchment-edge); font-size:.85rem; letter-spacing:.16em; text-transform:uppercase; margin-bottom:20px;}
.onb-copy{
  color:var(--parchment-hi);
  font-size:1.02rem;
  line-height:1.6;
  max-width:38ch;
  margin:0 auto 14px;
}
.onb-copy b{color:var(--gold);}
.story-home{width:min(78vw,300px); margin:0 auto 18px; filter:drop-shadow(0 14px 20px rgba(0,0,0,.5));}
.btn{
  appearance:none; border:none; border-radius:14px;
  padding:15px 30px;
  font-size:1.05rem; font-weight:700; letter-spacing:.02em;
  background:linear-gradient(180deg, var(--carrot), var(--carrot-deep));
  color:#fff7ea;
  box-shadow:0 4px 0 var(--wood-darker), var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--wood-darker);}
.btn:disabled{opacity:.4; filter:grayscale(.4); box-shadow:0 4px 0 var(--wood-darker);}
.btn:disabled:active{transform:none;}
.btn-wood{background:linear-gradient(180deg, var(--wood), var(--wood-dark)); color:var(--parchment-hi);}
.btn-ghost{
  background:transparent; color:var(--parchment-edge);
  box-shadow:none; border:1px solid var(--parchment-edge);
  padding:10px 20px; font-size:.9rem; font-weight:600;
}
.btn-danger{background:linear-gradient(180deg,#c0503b,var(--danger)); color:#fff2ec;}
.btn-block{width:100%;}
.btn-sm{padding:8px 16px; font-size:.8rem; border-radius:10px; box-shadow:0 2px 0 var(--wood-darker), var(--shadow);}
.btn-sm:active{box-shadow:0 1px 0 var(--wood-darker);}
.mt{margin-top:22px;}
/* Profile's single "Settings" section -- every account/data action (Switch
   Castaway, Back up, Restore, Reset) and every toggle (holidays shown)
   share this one small chip style, wrapped multiple-per-row, instead of
   full-width stacked buttons -- de-emphasized vs. the castaway story/stats
   above, and visually uniform regardless of whether a given chip is a
   one-shot action or a toggle (an "on" toggle just fills solid; nothing
   else about its size/shape differs from a plain action chip). */
.settings-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.settings-chip{
  appearance:none; border:1px solid var(--parchment-edge); border-radius:20px;
  padding:8px 14px; font-size:.85rem; font-weight:700; font-family:inherit;
  background:var(--parchment-hi); color:var(--wood-dark);
}
.settings-chip:active{transform:translateY(1px);}
.settings-chip.on{background:var(--leaf); border-color:var(--leaf-deep); color:#fff;}

.avatar-choice{display:flex; gap:18px; margin:8px 0 26px;}
.avatar-option{
  border:3px solid transparent; border-radius:50%; padding:4px;
  background:rgba(0,0,0,.15);
  transition:border-color .15s ease, transform .15s ease;
}
.avatar-option img{width:128px; height:128px; border-radius:50%;}
.avatar-option.selected{border-color:var(--gold); transform:translateY(-4px);}

.field{width:100%; max-width:340px; text-align:left; margin:0 auto 16px;}
.field label{display:block; color:var(--parchment-edge); font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; margin-bottom:6px;}
.field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
  width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--parchment-edge);
  background:var(--parchment-hi); color:var(--ink); font-size:1rem; font-family:inherit;
}
.field textarea{resize:vertical; min-height:52px;}
/* ---------- Frequency picker sub-fields (Once's due date, Every X's
   number+unit) -- nested inside .type-picker right under the selected
   option, rather than styled as a standalone .field, so it reads as part
   of that option rather than a separate form section. ---------- */
.freq-subfield{max-width:none; margin:-4px 0 4px; padding:0 2px;}
.freq-every-inputs{display:flex; gap:8px;}
.freq-every-inputs input[type=number]{width:80px; flex-shrink:0;}
.freq-every-inputs select{flex:1;}
.emoji-picker{display:flex; flex-wrap:wrap; gap:8px; max-width:340px; margin:0 auto 18px; justify-content:center;}
.emoji-opt{
  width:42px; height:42px; border-radius:10px; border:2px solid transparent;
  background:transparent; font-size:1.3rem; display:flex; align-items:center; justify-content:center;
}
.emoji-opt.selected{border-color:var(--gold); background:rgba(198,153,47,.25);}

/* ---------- App shell ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  padding:12px 16px;
  background:linear-gradient(180deg, rgba(14,54,52,.96), rgba(14,54,52,.85));
  backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(198,153,47,.35);
}
.topbar-row1{display:flex; align-items:center; justify-content:space-between;}
/* Only rendered when the Install pill has something to show (installTopbarBtnHtml
   returns non-empty) -- see renderTopbar(). Keeps the icon/wordmark row above
   untouched once installed, when there's nothing left to show here at all. */
.topbar-row2{display:flex; justify-content:flex-end; margin-top:8px;}
.icon-btn{background:none; border:none; padding:0;}
.avatar-thumb{
  width:44px; height:44px; border-radius:50%; object-fit:cover;
  border:2px solid var(--gold); box-shadow:var(--shadow);
}
.wordmark{
  color:var(--parchment-hi); font-size:1.35rem; text-align:center;
  text-shadow:0 2px 0 var(--wood-darker);
}
.topbar-spacer{width:44px; height:44px; flex-shrink:0;}
.add-habit-fab{
  width:40px; height:40px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(180deg, var(--danger), #7a2318);
  color:#fff7ea; font-size:1.5rem; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--gold); box-shadow:var(--shadow);
  padding-bottom:3px; /* the "+" glyph's own metrics sit a bit high in its
    box in most fonts, which reads as low once centered -- nudge up */
}
.add-habit-fab:active{transform:translateY(1px);}
.topbar-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.due-today-btn{
  position:relative; width:40px; height:40px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(180deg, var(--danger), #7a2318);
  font-size:1.1rem; line-height:1;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--gold); box-shadow:var(--shadow);
}
.due-today-btn:active{transform:translateY(1px);}
.due-today-badge{
  position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 3px;
  border-radius:8px; background:var(--gold); color:var(--wood-darker);
  font-size:.62rem; font-weight:800; line-height:16px; text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}
.special-day-btn{
  width:40px; height:40px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(180deg, #d6597a, #a13a56);
  font-size:1.1rem; line-height:1;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--gold); box-shadow:var(--shadow);
}
.special-day-btn:active{transform:translateY(1px);}

/* ---------- Install pill (topbar + Profile) ---------- */
.topbar-install-btn{
  flex-shrink:0; border:none; border-radius:20px; padding:7px 16px;
  font-size:.78rem; font-weight:700; letter-spacing:.02em;
  color:#fff7ea; background:linear-gradient(180deg, var(--carrot), var(--carrot-deep));
  box-shadow:0 2px 0 var(--wood-darker);
}
.topbar-install-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--wood-darker);}
.topbar-install-btn.installed{
  background:var(--parchment); color:var(--wood); border:1px solid var(--parchment-edge);
  box-shadow:none; font-weight:600;
}

/* ---------- Bottom nav (persistent app chrome -- lives outside #app,
   see initBottombar()/syncBottombarUI() -- not rebuilt by render()) ---------- */
.bottombar{
  position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex;
  background:linear-gradient(0deg, rgba(14,54,52,.98), rgba(14,54,52,.9));
  border-top:1px solid rgba(198,153,47,.35);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  max-width:480px; margin:0 auto;
}
.bottombar.hidden{display:none;}
.bottom-tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  background:none; border:none; color:var(--parchment-edge); padding:6px 2px; border-radius:10px;
}
.bottom-tab .bt-icon{font-size:1.15rem;}
.bottom-tab .bt-label{font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700;}
.bottom-tab.active{color:var(--gold);}
.bottom-tab:active{opacity:.65;}

/* ---------- Pull-to-refresh (forces an update check on demand) ---------- */
.pull-refresh{
  position:fixed; top:10px; left:50%; transform:translate(-50%,-60px);
  width:36px; height:36px; border-radius:50%;
  background:linear-gradient(180deg, var(--parchment-hi), var(--parchment));
  border:2px solid var(--wood);
  box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; color:var(--wood-dark); z-index:90;
}
.pull-refresh.hidden{display:none;}
.pull-refresh.dragging{transition:none;}
.pull-refresh:not(.dragging){transition:transform .2s ease, opacity .2s ease;}
.pull-refresh .arrow{transition:transform .15s ease; line-height:1;}
.pull-refresh.ready .arrow{transform:rotate(180deg);}
.pull-refresh.spinning .arrow{display:none;}
.pull-refresh.spinning::after{
  content:''; width:16px; height:16px; border-radius:50%;
  border:2px solid var(--parchment-edge); border-top-color:var(--carrot);
  animation:pr-spin .7s linear infinite;
}
@keyframes pr-spin{to{transform:rotate(360deg);}}

.screen{padding:16px;}

/* ---------- Carrot plaque (signature element) ---------- */
.plaque-wrap{display:flex; justify-content:center; margin:6px 0 20px;}
.plaque{
  position:relative;
  background:linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
  border:2px solid var(--wood-darker);
  border-radius:10px;
  padding:16px 20px 14px;
  width:100%;
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.05);
}
.plaque::before, .plaque::after{
  content:""; position:absolute; top:-22px; width:2px; height:24px;
  background:repeating-linear-gradient(180deg,#8a7550 0 4px, transparent 4px 8px);
}
.plaque::before{left:22px;}
.plaque::after{right:22px;}
.plaque-rivet{position:absolute; width:7px; height:7px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #e8d9a8, var(--wood-darker) 70%); box-shadow:inset 0 0 2px #000;}
.plaque-rivet.tl{top:8px; left:8px;} .plaque-rivet.tr{top:8px; right:8px;}
.plaque-rivet.bl{bottom:8px; left:8px;} .plaque-rivet.br{bottom:8px; right:8px;}
.plaque-count{
  display:flex; align-items:baseline; justify-content:center; gap:8px;
  color:var(--parchment-hi); font-family:Georgia,serif; font-size:2.1rem; font-weight:700;
  text-shadow:0 2px 0 rgba(0,0,0,.4);
}
.plaque-count .unit{font-size:.95rem; font-weight:400; color:var(--parchment-edge);}
.plaque-label{text-align:center; color:var(--gold); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; margin-bottom:10px;}
.pip-row{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
.pip{font-size:1.15rem; opacity:.28; filter:grayscale(1);}
.pip.filled{opacity:1; filter:none;}
/* Sized to hold 7 pips on one line inside a narrow reward-card body (~190px
   usable width) without wrapping -- the plain .pip-row above is tuned for
   the wider Logbook plaque instead. */
.pip-row.compact{gap:2px; flex-wrap:nowrap; justify-content:flex-start; margin-top:6px;}
.pip-row.compact .pip{font-size:.78rem;}
.plaque-progress-text{text-align:center; color:var(--parchment-edge); font-size:.76rem; margin-top:8px;}

/* ---------- Habit rows (compact, tap for detail) ---------- */
.section-label{color:var(--parchment-edge); font-size:.75rem; text-transform:uppercase; letter-spacing:.14em; margin:18px 4px 8px;}
/* .section-label's light color is tuned for the Logbook screen's dark
   background (where it's normally used) -- inside a .modal (light parchment
   background, e.g. Profile's "Manage"/"Holidays shown" labels), that same
   color would be near-invisible low-contrast, so darken it in that context. */
.modal .section-label{color:var(--wood);}
.habit-row{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left;
  background:linear-gradient(180deg, var(--parchment-hi), var(--parchment));
  border:1px solid var(--parchment-edge); border-radius:9px;
  padding:10px 12px; margin-bottom:8px;
}
.habit-row:active{transform:translateY(1px);}
.due-today-empty{color:var(--wood); font-size:.9rem; text-align:center; padding:12px 0 4px;}
.habit-status{width:30px; flex-shrink:0; text-align:center; font-size:1rem;}
.habit-status.done{color:var(--leaf-deep); font-weight:800;}
.habit-status.streak{font-size:.8rem; font-weight:700; color:var(--carrot-deep);}
.habit-status.idle::after{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; border:1.5px solid var(--parchment-edge);}
/* ---------- Habit detail modal (reuses habit-head/emoji/name/badge above) ---------- */
.habit-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.habit-emoji{font-size:1.4rem;}
/* Detail modal's emoji is a real <button> (tap to change icon, see
   toggle-detail-emoji-picker) -- strip native button chrome so it still
   reads as a plain icon, matching the <span> it doubles for elsewhere. */
.habit-emoji-btn{background:none; border:none; padding:0; line-height:1; cursor:pointer; border-radius:6px;}
.habit-emoji-btn:active{opacity:.7;}
/* Special Days rows only (birthdays/anniversaries/other + built-in
   holidays) -- 30% smaller than the base 1.4rem habit-icon size, since a
   flag/emoji icon shouldn't dominate a compact list row the way it can for
   the small number of habit cards on the Logbook. */
.habit-emoji.special-day-icon{font-size:.98rem;}
.habit-name{flex:1; font-family:inherit; font-size:1rem; font-weight:700; color:var(--wood-dark); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
/* Built-in holidays (see GLOBAL_HOLIDAYS) render as a plain <div>, not a
   <button> like every other habit-row/special-day entry -- <button> has no
   inherited font-size/family of its own in this app's reset (see the bare
   `button{font-family:inherit; cursor:pointer;}` rule above), so without
   this, a holiday's name text picks up the browser's own default control
   font instead of matching the rest of the list. font-size/family are
   pinned explicitly above so every row (button or div) renders identically
   regardless of element type; this just also drops the bold weight so
   holidays read as visually lighter than a user's own birthdays/
   anniversaries/etc. -- same size and font, less emphasis. */
.habit-name.builtin-holiday{font-weight:400;}
.habit-name-input{
  flex:1; min-width:0; border:none; border-bottom:1px dashed transparent; background:transparent;
  font-weight:700; color:var(--wood-dark); font-size:1rem; font-family:inherit; padding:2px 0;
}
.habit-name-input:focus{outline:none; border-bottom-color:var(--carrot);}
.habit-desc-input{
  width:100%; border:1px solid var(--parchment-edge); border-radius:8px; background:var(--parchment-hi);
  color:var(--wood); font-size:.82rem; font-family:inherit; padding:8px 10px; margin-bottom:12px;
  resize:vertical; min-height:44px;
}
.habit-type-badge{
  font-size:.62rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
  color:var(--leaf-deep); background:rgba(92,122,63,.15); padding:3px 7px; border-radius:6px;
}
.habit-week{display:flex; gap:5px; margin-bottom:10px;}
.day-pip{
  flex:1; height:22px; border-radius:5px; background:rgba(107,69,38,.15); position:relative;
  display:flex; align-items:center; justify-content:center; font-size:.7rem; color:var(--wood);
  border:none; padding:0; margin:0; font-family:inherit;
}
.day-pip.done{background:var(--leaf); color:#fff;}
.day-pip-note{position:absolute; top:-6px; right:-4px; font-size:.6rem; filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));}
.day-pip.today{outline:2px solid var(--carrot); outline-offset:1px;}
.log-btn{
  width:100%; border:none; border-radius:9px; padding:11px; font-weight:700; font-size:.92rem;
  background:linear-gradient(180deg, var(--carrot), var(--carrot-deep)); color:#fff7ea;
  box-shadow:0 3px 0 var(--wood-darker);
}
.log-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--wood-darker);}
.log-btn.done{background:linear-gradient(180deg,#7c9c5e,var(--leaf-deep)); box-shadow:0 3px 0 #2c4019;}
/* Habit Detail's Log/Delete row (see renderHabitDetailModal()) -- both
   buttons shrunk and pinned to opposite edges so a mistap while logging
   can't land on Delete. log-btn-sm must come after .log-btn/.log-btn.done
   above to win the width/padding/font-size tiebreak (equal specificity). */
.habit-log-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px;}
.log-btn-sm{width:auto; padding:8px 16px; font-size:.8rem; border-radius:10px;}
.habit-meta{color:var(--wood); font-size:.78rem; margin-top:8px;}
.habit-meta.done{color:var(--leaf-deep); font-weight:700;}

/* ---------- Habit log notes (see renderHabitNoteModal()) ---------- */
.habit-note-daylabel{color:var(--wood); font-size:.78rem; font-weight:700; margin-bottom:4px;}
.habit-note-info{color:var(--wood); font-size:.68rem; line-height:1.4; opacity:.8; margin-bottom:8px;}
.habit-note-meta{color:var(--carrot-deep); font-size:.68rem; font-weight:700; margin-bottom:8px;}
.note-save-btn{
  appearance:none; border:none; border-radius:50%; width:30px; height:30px; padding:0;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem; font-weight:700; line-height:1; color:#fff7ea;
  background:linear-gradient(180deg, var(--carrot), var(--carrot-deep));
  box-shadow:0 2px 0 var(--wood-darker);
  transition:transform .12s ease, box-shadow .12s ease;
}
.note-save-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--wood-darker);}
.habit-note-input{
  width:100%; min-height:70px; resize:vertical; border-radius:9px; border:1px solid var(--parchment-edge);
  background:var(--parchment-hi); color:var(--wood-dark); font:inherit; font-size:.85rem; padding:8px 12px;
  box-sizing:border-box;
}
.habit-note-actions{display:flex; flex-direction:column; gap:8px; margin-top:8px;}


/* ---------- Rewards screen ---------- */
.reward-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

/* ---------- New Discovery (open-ended collectible track) ---------- */
.sightings-teaser{color:var(--parchment-edge); font-size:.85rem; line-height:1.5;}
.sightings-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:8px;}
.sighting-tile{
  border-radius:8px; border:1px solid var(--parchment-edge); box-shadow:var(--shadow);
  background-repeat:no-repeat; width:100%; aspect-ratio:1/1; position:relative; padding:0;
}
.sightings-footer{color:var(--parchment-edge); font-size:.78rem; margin-top:10px;}
/* The single most recent discovery, picture + its Castaway's Log story
   together -- sits above the plain thumbnail grid (which stays a bare,
   browsable overview of everything found so far). */
.sighting-featured{
  display:flex; gap:12px; align-items:flex-start; text-align:left;
  background:rgba(107,69,38,.07); border:1px solid var(--parchment-edge); border-radius:9px;
  padding:10px 12px; margin-bottom:14px;
}
.sighting-featured-img{
  width:64px; height:64px; flex-shrink:0; border-radius:8px; border:2px solid var(--gold);
  box-shadow:var(--shadow); background-repeat:no-repeat;
}
.sighting-featured-text .log-entry-when{display:block; margin-bottom:3px;}
.sighting-featured-text .log-entry-body{margin:0;}

.story-link{
  width:100%; display:flex; align-items:center; gap:10px; text-align:left;
  background:rgba(107,69,38,.08); border:1px solid var(--parchment-edge); border-radius:9px;
  padding:8px 12px; margin:2px 0 14px; color:var(--wood-dark); font-weight:700; font-size:.85rem;
}
/* Profile's "Story So Far" link sits on the light parchment modal, where
   --wood-dark reads fine -- the Special Days link sits directly on the
   dark teal Logbook background instead, where that same dark text is
   nearly invisible, so it needs its own bright color. */
.story-link.on-dark{color:var(--parchment-hi);}
.story-icon{width:36px; height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.story-icon img{width:100%; height:100%; object-fit:contain;}
.story-icon.emoji{font-size:1.5rem;}
.special-days-add-btn{background:none; border:none; font-size:1.5rem; font-weight:700; color:var(--carrot-deep); line-height:1; padding:2px 4px;}
.special-day-date{font-size:.72rem; color:var(--wood); flex-shrink:0; white-space:nowrap;}
.log-entries{text-align:left; margin-bottom:14px;}
.log-entry{
  background:rgba(107,69,38,.07); border:1px solid var(--parchment-edge); border-radius:9px;
  padding:10px 12px; margin-bottom:8px;
}
.log-entry-find{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.log-entry-sighting{
  width:32px; height:32px; border-radius:6px; flex-shrink:0;
  background-repeat:no-repeat; border:1px solid var(--parchment-edge);
}
.log-entry-sighting-icon{
  background-color:var(--parchment); display:flex; align-items:center; justify-content:center;
}
.log-entry-sighting-icon img{width:70%; height:70%; object-fit:contain;}
.log-entry-when{
  font-size:.72rem; font-style:italic; font-weight:700; color:var(--carrot-deep); line-height:1.3;
}
.log-entry-title{font-weight:700; color:var(--wood-dark); font-size:.86rem; margin-bottom:4px;}
.log-entry-body{color:var(--wood); font-size:.8rem; line-height:1.5; font-style:italic;}
.reward-card{
  background:linear-gradient(180deg, var(--parchment-hi), var(--parchment));
  border-radius:12px; border:1px solid var(--parchment-edge); box-shadow:var(--shadow);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
  cursor:pointer;
}
.reward-card:active{transform:translateY(1px);}
.reward-media{
  height:118px; background:linear-gradient(160deg, var(--teal-glow), var(--teal-deep));
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.reward-media img{width:100%; height:100%; object-fit:contain;}
.reward-media .medallion{font-size:2.6rem;}
/* Square variant for the New Discovery summary card -- its thumbnail is
   a sprite-sheet tile (background-position math assumes a 1:1 element,
   unlike the other cards' real <img> which can object-fit:cover a
   non-square box). */
.reward-media.square{height:auto; aspect-ratio:1/1;}
.sighting-hero{width:100%; height:100%; background-repeat:no-repeat;}
.reward-body{padding:10px 12px 12px;}
.reward-title{font-weight:700; color:var(--wood-dark); font-size:.86rem; margin-bottom:3px;}
.reward-desc{color:var(--wood); font-size:.72rem; line-height:1.4; margin-bottom:6px;}
.next-rewards-list{list-style:none; padding:0; margin:0; font-size:.72rem; color:var(--wood-dark); font-weight:700; line-height:1.6;}
.reward-status{font-size:.68rem; font-weight:700;}
.reward-status.unlocked{color:var(--leaf-deep);}
.reward-status.locked{color:#8a7a5c;}
.reward-card.locked .reward-media img{filter:grayscale(1) brightness(.55);}
.reward-card.locked .reward-media .medallion{filter:grayscale(1); opacity:.5;}
.reward-card.locked{opacity:.82;}
.reward-lock{
  position:absolute; top:8px; right:8px; background:rgba(20,20,20,.55); color:#fff;
  width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.85rem;
}
.reward-ribbon{
  position:absolute; top:8px; left:8px; background:var(--gold); color:var(--wood-darker);
  font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  padding:3px 7px; border-radius:6px; box-shadow:0 2px 4px rgba(0,0,0,.35);
}
.reward-heart{
  position:absolute; top:6px; right:6px; background:rgba(20,20,20,.45); border:none;
  width:26px; height:26px; border-radius:50%; font-size:.85rem; line-height:1;
  display:flex; align-items:center; justify-content:center; filter:grayscale(1); opacity:.75;
}
.reward-heart.favorited{filter:none; opacity:1; background:rgba(20,20,20,.3);}
.reward-heart:active{transform:translateY(1px);}

/* ---------- Treasure Hunt ---------- */
/* Aspect ratio matches Graphics/TreasureMap.jpeg's native 1408x768 exactly
   -- the 26x16 fog grid below is the map art's own hand-drawn gridlines
   (see the TREASURE_COLS/ROWS comment in the script), so any mismatch here
   would drift the fog off the coastline. */
.tmap-wrap{position:relative; width:100%; aspect-ratio:1408/768; background:var(--teal-deep); overflow:hidden;}
.tmap-card .tmap-wrap{border-radius:0;}
.tmap-wrap img{width:100%; height:100%; object-fit:cover;}
.tmap-grid{
  position:absolute; inset:0; display:grid;
  grid-template-columns:repeat(26,1fr); grid-template-rows:repeat(16,1fr);
}
.tmap-cell{display:flex; align-items:center; justify-content:center;}
/* Fully opaque -- fogged cells must hide the map underneath completely, not
   just dim it, so background-color (not an alpha channel) carries the
   white. The two radial-gradient layers add a soft puffy-cloud texture on
   top of that opaque base rather than relying on transparency for texture. */
.tmap-cell.fogged{
  background-color:#f4f1ea;
  background-image:
    radial-gradient(circle at 30% 25%, #ffffff 0%, rgba(255,255,255,0) 55%),
    radial-gradient(circle at 72% 68%, #ffffff 0%, rgba(255,255,255,0) 60%);
  box-shadow:inset 0 0 0 .5px rgba(120,110,95,.3);
}
.tmap-cell.revealed{background:transparent;}
/* Sized down from the original 4-per-row cardinal-only grid -- 26 columns
   packs cells much tighter, so the marker must shrink to fit inside one
   without spilling into its neighbors. tmap-pin is a photo (object-fit,
   width/height), tmap-found is still an emoji (font-size). */
.tmap-found{font-size:.55rem; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));}
.tmap-pin{width:130%; height:130%; object-fit:contain; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));}
.tmap-card .tmap-found{font-size:.36rem;}
.tmap-card .tmap-pin{width:150%; height:150%;}
.tmap-status{color:var(--wood-dark); font-weight:700; font-size:.85rem; text-align:center; margin:12px 0 0;}
.tmap-hint{color:var(--wood); font-size:.75rem; text-align:center; margin:6px 0 0;}
.tmap-dpad{
  display:grid; grid-template-columns:repeat(3,42px); grid-auto-rows:42px; gap:4px;
  justify-content:center; margin:14px auto 0;
}
.tmap-dbtn{
  background:var(--wood); color:var(--parchment-hi); border:1px solid var(--wood-dark);
  border-radius:8px; font-size:1rem; display:flex; align-items:center; justify-content:center;
}
.tmap-dbtn:active{transform:translateY(1px);}
.tmap-dbtn[disabled]{opacity:.35; cursor:default;}
.tmap-dpad-center{display:flex; align-items:center; justify-content:center; font-size:1.1rem; opacity:.7;}
.treasure-hunt-modal{text-align:center;}

/* ---------- Modals ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(8,20,19,.72); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center; z-index:60; animation:fadeIn .18s ease;
}
.modal{
  width:100%; max-width:480px; background:linear-gradient(180deg,var(--parchment-hi),var(--parchment));
  border-radius:18px 18px 0 0; padding:22px 22px calc(22px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.5);
}
/* Centered popup variant -- used for install/uninstall instructions, the
   proactive install-prompt, and the auto-restore-detected prompt (all appended
   directly to <body> via openInfoModal, outside #app). A bottom sheet pinned
   to a top-right topbar tap runs off-screen; a centered popup doesn't. */
.modal-backdrop.center{align-items:center; padding:24px;}
.modal-backdrop.center .modal{border-radius:16px; width:min(420px,100%); max-height:80vh;}
.modal h3{color:var(--wood-dark);}
.modal-close{float:right; background:none; border:none; font-size:1.3rem; color:var(--wood); line-height:1;}
.type-picker{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
.type-opt{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
  background:rgba(107,69,38,.08); border:1px solid transparent;
}
.type-opt.selected{border-color:var(--carrot); background:rgba(224,123,46,.14);}
.type-opt.disabled{opacity:.45;}
.type-opt .t-title{font-weight:700; color:var(--wood-dark); font-size:.92rem;}
.type-opt .t-sub{font-size:.72rem; color:var(--wood);}

.celebration{text-align:center;}
.celebration .confetti{font-size:2rem; margin-bottom:6px;}
.celebration h4{color:var(--carrot-deep); font-size:1.2rem;}
.celebration p{color:var(--wood); font-size:.92rem; line-height:1.5;}

.reward-detail{text-align:center;}
.reward-detail h3{color:var(--carrot-deep); font-size:1.2rem; margin-top:4px;}
.reward-detail p{color:var(--wood); font-size:.92rem; line-height:1.5;}
.reward-detail .reward-status{font-size:.8rem; font-weight:700; margin-top:6px;}
.reward-detail .reward-status.unlocked{color:var(--leaf-deep);}
.reward-detail .reward-status.locked{color:#8a7a5c;}
.medallion-lg{font-size:3.4rem; margin:6px 0;}
.medallion-lg.locked{filter:grayscale(1); opacity:.55;}
img.reward-hero{max-height:240px; max-width:100%; margin:0 auto 10px; border-radius:12px; display:block;}

.profile-cutout{max-height:130px; max-width:35%; margin:0; display:block; filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));}
.profile-cutout-row{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
.profile-stats{display:flex; justify-content:space-around; margin:14px 0 20px; text-align:center;}
.profile-stat b{display:block; font-size:1.3rem; color:var(--wood-dark);}
.profile-stat span{font-size:.68rem; color:var(--wood); text-transform:uppercase; letter-spacing:.06em;}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--wood-dark); color:var(--parchment-hi); padding:10px 18px; border-radius:20px;
  font-size:.85rem; box-shadow:var(--shadow); z-index:80; animation:fadeIn .2s ease;
}

/* ---------- Coco Cannon ---------- */
.coco-screen{
  position:fixed; inset:0; z-index:65; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#233a24 0%, #14210f 70%, #0b1508 100%); color:var(--parchment-hi);
}
.coco-screen.hidden{display:none;}
.coco-header{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
}
.coco-back{background:none; border:none; color:var(--parchment-hi); font-size:1.25rem; padding:4px; line-height:1;}
.coco-score{font-weight:700; font-size:.85rem; color:var(--gold); white-space:nowrap;}
.coco-lives{display:flex; justify-content:center; gap:5px; font-size:1.3rem; padding:8px 14px 4px;}
.coco-lives .pip{font-size:1.3rem;}
.coco-canvas-wrap{flex:1; position:relative; min-height:0;}
.coco-canvas{width:100%; height:100%; display:block; touch-action:none;}
.coco-overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:12px; padding:24px; background:rgba(8,14,7,.68);
}
.coco-overlay.hidden{display:none;}
.coco-overlay h3{color:var(--parchment-hi); font-size:1.35rem; margin:0; text-shadow:0 2px 0 rgba(0,0,0,.5);}
.coco-overlay p{color:var(--parchment-edge); font-size:.85rem; max-width:280px; margin:0; line-height:1.5;}
.coco-overlay .coco-sub{color:var(--gold); font-size:.8rem; font-weight:700;}
.coco-controls{
  display:flex; align-items:center; justify-content:center; gap:16px;
  padding:14px calc(14px + env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-right));
}
.coco-btn{
  width:64px; height:56px; border-radius:12px; background:var(--wood); color:var(--parchment-hi);
  border:1px solid var(--wood-dark); font-size:1.3rem; box-shadow:0 3px 0 var(--wood-darker);
}
.coco-btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--wood-darker);}
.coco-fire{background:var(--carrot); border-color:var(--carrot-deep); box-shadow:0 3px 0 var(--carrot-deep); font-size:1.5rem;}
.coco-card-lives{margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="pull-refresh hidden" id="pullRefresh"><span class="arrow">&#8595;</span></div>
<!-- Persistent app chrome: lives outside #app so it survives every render()
     rebuild of #app's innerHTML -- see initBottombar()/syncBottombarUI() in
     the script below. Click handlers are wired exactly once, at bootstrap,
     never from wireEvents() (which re-runs on every render()). -->
<nav class="bottombar hidden" id="bottombar">
  <button class="bottom-tab" data-nav="logbook"><span class="bt-icon">&#128214;</span><span class="bt-label">Logbook</span></button>
  <button class="bottom-tab" data-nav="rewards"><span class="bt-icon"><svg viewBox="0 0 24 24" width="1.15em" height="1.15em" style="vertical-align:-2px" aria-hidden="true"><path d="M3 11 C3 6 6 4 12 4 C18 4 21 6 21 11 Z" fill="#6b4526" stroke="#3e2714" stroke-width="0.8"/><rect x="3" y="11" width="18" height="8" rx="1.5" fill="#6b4526" stroke="#3e2714" stroke-width="0.8"/><rect x="6.4" y="4" width="1.7" height="15" fill="#c6992f"/><rect x="15.9" y="4" width="1.7" height="15" fill="#c6992f"/><rect x="3" y="10.4" width="18" height="1.4" fill="#c6992f"/><rect x="10.1" y="9.2" width="3.8" height="4.4" rx="1" fill="#c6992f" stroke="#3e2714" stroke-width="0.5"/></svg></span><span class="bt-label">Rewards</span></button>
</nav>
<!-- Coco Cannon -- same "lives outside #app, wired once" reasoning as the
     bottombar above, but for a stronger reason: this holds a <canvas> with
     a live requestAnimationFrame loop. If it were part of #app's innerHTML,
     any render() during a game (which happens constantly -- every habit
     toggle, every toast) would destroy and recreate the canvas, losing its
     2D context and killing the loop mid-frame. See initCocoCannon()/
     syncCocoScreenUI() in the script below. -->
<div class="coco-screen hidden" id="cocoScreen">
  <div class="coco-header">
    <button class="coco-back" data-coco-back aria-label="Close Coco Cannon">✕</button>
    <div class="coco-score" id="cocoScoreDisplay">Score: 0</div>
  </div>
  <div class="coco-canvas-wrap">
    <canvas class="coco-canvas" id="cocoCanvas"></canvas>
    <div class="coco-overlay hidden" id="cocoOverlay"></div>
  </div>
  <div class="coco-lives" id="cocoLivesDisplay"></div>
  <div class="coco-controls">
    <button class="coco-btn" id="cocoLeftBtn" aria-label="Move left">◀</button>
    <button class="coco-btn coco-fire" id="cocoFireBtn" aria-label="Fire coconut">🥥</button>
    <button class="coco-btn" id="cocoRightBtn" aria-label="Move right">▶</button>
  </div>
</div>
<script>
(function(){
"use strict";

var ASSET = {
  avatar_male: "__AVATAR_MALE__",
  avatar_female: "__AVATAR_FEMALE__",
  home_scene: "__HOME_SCENE__",
  home_icon: "__HOME_ICON__",
  cutout_male: "__CUTOUT_MALE__",
  cutout_female: "__CUTOUT_FEMALE__",
  sightings_sprite: "__SIGHTINGS_SPRITE__",
  chest: "__CHEST__",
  bottle: "__BOTTLE__",
  treasure_map: "__TREASURE_MAP__",
  carrot_juice: "__CARROT_JUICE__",
  coco_cannon_img: "__COCO_CANNON_IMG__",
  coco_crow: "__COCO_CROW__",
  coco_crow_red: "__COCO_CROW_RED__",
  coco_coconut: "__COCO_COCONUT__"
};

var STORAGE_KEY = "rhabbits_state_v1";
// Human-readable build marker shown in Profile > Version -- bump this on
// every future code change to this file so a reload can be visually
// confirmed against what was actually deployed. Distinct from any
// data-schema/localStorage version (this app has none yet).
var APP_VERSION = "1.0+6bf24e2c";
// Sorted into one logical sequence -- nature, fitness/routine, pirate/
// nautical, then animals -- rather than grouped under separate UI headers.
var EMOJI_CHOICES = ["🌴","🌱","☀️","🌊","🥥","🥕","🌙","💪","🏋️","🧘","🤸","📖","💊","🛏️","⛵","🏴‍☠️","🧭","⚓","🦜","🐚","🗺️","🏝️","🐶","🐕","🐩","🦮","🐕‍🦺","🐺","🐱","🐈","🐈‍⬛","🦁"];

var REWARDS = [
  {
    id: "portrait",
    title: "Castaway Portrait",
    desc: "Your very own castaway.",
    starter: true,
    image: function(state){ return state.avatar === "female" ? ASSET.cutout_female : ASSET.cutout_male; }
  },
  {
    id: "island_home",
    title: "Island Home",
    desc: "The treehouse you call home.",
    starter: true,
    image: function(){ return ASSET.home_scene; }
  },
  {
    id: "first_habit",
    title: "1 Tracked rHabbit",
    desc: "Alternative portrait option.",
    starter: true,
    // The road not taken -- a glimpse of the *other* castaway look, as a
    // small surprise alongside your own chosen portrait.
    image: function(state){ return state.avatar === "female" ? ASSET.cutout_male : ASSET.cutout_female; }
  },
  {
    // Not rendered via the generic unlocked-rewards loop below (see
    // renderRewardsScreen(), which filters this id out and instead renders
    // its own interactive renderCocoCannonCard() at a fixed position right
    // after Treasure Hunt) -- kept in this array purely so the existing
    // condition-check + "New Reward Unlocked!" celebration machinery in
    // evaluateRewards() applies to it same as everything else. Placed
    // right after the starters so it's the very first thing "Next
    // Rewards" points to -- logging a first habit is meant to unlock it
    // almost immediately.
    id: "coco_cannon",
    title: "Coco Cannon",
    desc: "Defend your carrot seeds from Captain Crow and his evil garden invaders.",
    medallion: "🥥",
    condition: function(state){ return state.habits.some(function(h){ return h.completions.length>0; }); },
    progress: function(){ return "Log a rHabbit to unlock"; }
  },
  {
    // Used to gate behind 7 carrots (folding in what was once also a
    // separate 28-day "Monthly & Once-off Tasks" reward) -- now granted as
    // a starter reward instead (see unlockStarterRewards()) so a second
    // habit slot and every schedule type are available from minute one,
    // rather than something to earn.
    id: "second_garden",
    title: "More rHabbits to track",
    desc: "Unlocked multiple rHabbits. Track once off, daily/weekly/monthly/annual and more.",
    medallion: "🥕",
    starter: true,
    condition: function(state){ return state.carrots >= 7; },
    progress: function(state){ return Math.min(state.carrots,7) + "/7 carrots"; }
  },
  {
    // Long-term (a ~7-month goal) -- see imminent() below and
    // nextLockedReward()'s use of it: this only surfaces in the Logbook's
    // "Next reward" teaser once it's genuinely close, rather than sitting
    // there as a many-months-away line item from day one. New Discovery
    // (the 7-carrot picture+story pair, see evaluateSightings()) isn't
    // gated this way -- that one's on a short, ever-recurring cycle, not a
    // single long-term goal, so it stays visible in the teaser as usual.
    id: "seven_seasons",
    title: "7-Month Streak Badge",
    desc: "Log a monthly rHabbit 7 times.",
    medallion: "🌙",
    condition: function(state){ return monthlyStreakBest(state)>=7; },
    progress: function(state){ return Math.min(monthlyStreakBest(state),7) + "/7 months"; },
    imminent: function(state){ return monthlyStreakBest(state) >= 5; } // last 2 months
  },
  {
    // Same "long-term, only tease once imminent" treatment as seven_seasons
    // above.
    id: "bucket_list",
    title: "7 Once-Offs Completed Badge",
    desc: "Complete 7 once-off adventures.",
    medallion: "🏴‍☠️",
    condition: function(state){ return onceoffCompletedCount(state) >= 7; },
    progress: function(state){ return Math.min(onceoffCompletedCount(state),7) + "/7 once-offs"; },
    imminent: function(state){ return onceoffCompletedCount(state) >= 5; } // last 2 once-offs
  }
];
function monthlyStreakBest(state){
  return state.habits.filter(function(h){return h.type==="monthly";})
    .reduce(function(m,h){ return Math.max(m,h.completions.length); },0);
}
var STARTER_REASON = "Reward issued: Starting to use the app!";

// ---------------- Treasure Hunt ----------------
// A slow-burn side quest layered on top of daily habit logging: one
// grid-square move per day (earned exactly like New Discovery credits below,
// via hasCompletionToday() -- at most one per calendar day, no matter how
// many habits get completed that day), spent on whichever of the 8

// (water is bluish; blank parchment margin and true land are told apart by
// local variance, since the illustration's ink linework has far more of it
// than a flat parchment stain), then flood-fill (8-connected, matching the
// diagonal movement above) from a chest cell to keep only the one
// connected landmass -- automatically dropping the two disconnected
// northern islets, the ship, and stray misclassified cells. See the
// grid-detection work in this session's history for the derivation; there

// map art's 3 red X marks, located the same pixel-detection way as the
// gridlines above (largest red-hued blob within each cell).
var TREASURE_CHESTS = [ {r:8,c:6}, {r:6,c:13}, {r:9,c:15} ];
// 8-directional step deltas, cardinal + diagonal.
var TREASURE_DIRS = {
  N:{dr:-1,dc:0}, S:{dr:1,dc:0}, E:{dr:0,dc:1}, W:{dr:0,dc:-1},
  NE:{dr:-1,dc:1}, NW:{dr:-1,dc:-1}, SE:{dr:1,dc:1}, SW:{dr:1,dc:-1}
};

function treasureCellKey(r,c){ return r+","+c; }
function isTreasureLand(r,c){
  return r>=0 && r<TREASURE_ROWS && c>=0 && c<TREASURE_COLS && TREASURE_LAND.indexOf(treasureCellKey(r,c))!==-1;
}
function treasureChestAt(r,c){
  for(var i=0;i<TREASURE_CHESTS.length;i++){
    if(TREASURE_CHESTS[i].r===r && TREASURE_CHESTS[i].c===c) return i;
  }
  return -1;
}
// Same one-credit-per-calendar-day cap as New Discovery (see
// hasCompletionToday() below) -- a move becomes available the moment any
// habit is logged today, and (unlike Discovery credits) doesn't expire if
// unspent -- it just waits until a direction is picked. Normally that's a
// single move/day, but the very first time the map is opened (see
// "show-treasure-hunt" in onAction()) grants 7 moves usable that one day
// only, so a brand new player can actually see some of the map right away
// instead of crawling one tile/day -- treasureTrialGrantedOn being today
// is the only thing that raises the cap, so it automatically reverts to
// the normal 1/day the moment the calendar date moves on, no separate
// "expire it" step needed.
function treasureMovesUsedToday(){
  var t = todayStr(), n = 0;
  for(var i=0;i<state.treasureMoveDays.length;i++){ if(state.treasureMoveDays[i]===t) n++; }
  return n;
}
function treasureMovesAllowedToday(){
  var base = state.treasureTrialGrantedOn===todayStr() ? 7 : 1;
  var streakBonus = state.treasureStreakBonusDays.indexOf(todayStr())!==-1 ? 1 : 0;
  return base + streakBonus;
}
function treasureMoveAvailable(){
  return !state.treasureMapComplete && hasCompletionToday(state) && treasureMovesUsedToday() < treasureMovesAllowedToday();
}
function treasureLegalDirections(){
  var p = state.treasurePos;
  var legal = {};
  for(var dir in TREASURE_DIRS){
    var d = TREASURE_DIRS[dir];
    legal[dir] = isTreasureLand(p.r+d.dr, p.c+d.dc);
  }
  return legal;
}
function treasureStatusText(){
  if(state.treasureMapComplete) return "You mapped the whole island!";
  if(state.treasureFound.length>=TREASURE_CHESTS.length) return "All treasure found — keep exploring the map.";
  var status = state.treasureFound.length+"/"+TREASURE_CHESTS.length+" treasures found.";
  if(treasureMoveAvailable()){
    var left = treasureMovesAllowedToday() - treasureMovesUsedToday();
    status += left>1 ? " "+left+" moves ready!" : " Move ready!";
  }
  return status;
}
function treasureMove(dir){
  if(!treasureMoveAvailable()) return;
  var legal = treasureLegalDirections();
  if(!legal[dir]) return;
  var p = state.treasurePos;
  var d = TREASURE_DIRS[dir];
  var np = {r:p.r+d.dr, c:p.c+d.dc};
  state.treasurePos = np;
  state.treasureMoveDays.push(todayStr());
  var key = treasureCellKey(np.r, np.c);
  if(state.treasureFog.indexOf(key)===-1) state.treasureFog.push(key);
  var chestIdx = treasureChestAt(np.r, np.c);
  if(chestIdx!==-1 && state.treasureFound.indexOf(chestIdx)===-1){
    state.treasureFound.push(chestIdx);
    state.pendingTreasureFound = chestIdx;
  }
  // Every land tile walked -- the whole map (water included) opens up as a
  // finished-map reward, distinct from (and possibly later than) finding
  // all 3 chests, which only requires walking the *right* tiles.
  if(!state.treasureMapComplete && state.treasureFog.length>=TREASURE_LAND.length){
    state.treasureMapComplete = true;
    state.pendingMapComplete = true;
  }
  save(); render();
}
// Only reachable once treasureMapComplete (see renderTreasureHuntModal()) --
// resets every bit of hunt progress back to the fresh-landing state so the
// player can walk the whole island again, without touching anything else
// (habits, carrots, the REWARDS chain, or the favorite-heart on this card).
function treasurePlayAgain(){
  if(!confirm("Restart the treasure hunt from the beach?")) return;
  state.treasureFog = [treasureCellKey(TREASURE_START.r, TREASURE_START.c)];
  state.treasurePos = {r:TREASURE_START.r, c:TREASURE_START.c};
  state.treasureFound = [];
  state.treasureMoveDays = [];
  state.treasureMapComplete = false;
  state.pendingTreasureFound = null;
  state.pendingMapComplete = false;
  save(); render();
}

// Percentage-based background-position/-size (the standard responsive-CSS-
// sprite formula) rather than fixed pixels, so a tile fills whatever size
// its container (a responsive grid cell, or a larger detail view) actually
// renders at, instead of a hardcoded 96px clashing with the grid's own
// column width.
function sightingTileStyle(index){
  var col = index % SIGHTINGS_COLS, row = Math.floor(index / SIGHTINGS_COLS);
  var posX = (col/(SIGHTINGS_COLS-1))*100, posY = (row/(SIGHTINGS_ROWS-1))*100;
  return 'background-image:url('+ASSET.sightings_sprite+');' +
    'background-size:'+(SIGHTINGS_COLS*100)+'% '+(SIGHTINGS_ROWS*100)+'%; background-position:'+posX+'% '+posY+'%;';
}

// the very first discovery and roughly once a month after that (every
// GROWTH_INTERVAL-th discovery, matching the 1-discovery/week pace), plus
// always on the very last one. Spacing them out keeps each one meaningful
// instead of a reflection after every single find. Growth beats play in
// the *same order* for every player, keyed only to discovery count, not to

// Returns the growth-arc line for a given 0-indexed discovery position, or
// null on the many discoveries that are pure discovery with no line 2 --
// growth beats land on the 1st discovery, every GROWTH_INTERVAL-th after
// that, and always on the very last (100th) discovery as a capstone.
function growthLineForPosition(position){
  if(position === SIGHTINGS_TOTAL - 1) return GROWTH_FINALE;
  if(position % GROWTH_INTERVAL === 0){
    var idx = position / GROWTH_INTERVAL;
    if(idx < GROWTH_LINE.length) return GROWTH_LINE[idx];
  }
  return null;
}

function daysAshore(state){ return daysSince(state.startDate) + 1; }
// Builds one log entry per discovered sighting, in discovery order (index
// 0 = first ever discovery), pairing that sighting's fixed flavor line with
// a growth-arc line where growthLineForPosition() returns one (most
// discoveries are pure discovery, line1 alone). Newest-first for display.
function unlockedJournalEntries(state){
  var entries = state.sightings.map(function(sightingIdx, position){
    var f = SIGHTING_FLAVOR[sightingIdx];
    var growth = growthLineForPosition(position);
    return {
      title: f.title,
      sightingIdx: sightingIdx,
      body: growth ? (f.line1 + " " + growth) : f.line1
    };
  }).slice().reverse();
  // Day One always unlocks immediately -- it's appended last so it always
  // sits at the bottom of the newest-first list, as the oldest entry.

// same as daily, and become due again once enough days have rolled by
// since the last one -- a rolling interval, unlike the named Weekly/Monthly

// worth the complexity here).

  if(!h.completions.length) return 0;

var SPECIAL_DAY_MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// sd.month/sd.day, as stored). A handful of holidays instead float to a
// different day each year -- Easter moves by the lunar calendar, and
// Mother's/Father's/Thanksgiving are all "Nth weekday of month" rules --
// so those are computed per-year via sd.rule instead of stored statically.
// nth=1..5 counts from the start of the month; nth=-1 means "last".
function nthWeekdayOfMonth(year, month, weekday, nth){
  if(nth>0){
    var first = new Date(year, month-1, 1);

// Western (Gregorian) Easter -- accurate for any Gregorian-calendar year.
function computeEasterSunday(year){

  var d = Math.floor(b/4), e = b % 4;
  var f = Math.floor((b+8)/25);
  var g = Math.floor((b-f+1)/3);
  var h = (19*a + b - d - g + 15) % 30;
  var i = Math.floor(c/4), k = c % 4;
  var l = (32 + 2*e + 2*i - h - k) % 7;
  var m = Math.floor((a + 11*h + 22*l)/451);
  var n = h + l - 7*m + 114;

function easterOffset(year, offsetDays){
  var d = new Date(year, computeEasterSunday(year).month-1, computeEasterSunday(year).day);

// Days from today (0 = today) until this year's -- or, if already passed,
// next year's -- occurrence. A leap-day (Feb 29) entry naturally rolls
// forward to March 1 in a non-leap year, same as plain JS Date math always
// does -- not worth special-casing for a personal reminder list. Floating
// holidays (see resolvedMonthDay()) get their target date recomputed for
// next year too, rather than just adding 365 days, since e.g. Easter can
// land in a different month year to year.
function specialDayNextOccurrenceDays(sd){
  var now = new Date();

  var now = new Date();

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    for(var k in d){ if(!(k in parsed)) parsed[k]=d[k]; }
    return parsed;
  }catch(e){ return defaultState(); }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

var state = load();
// Every fresh app open (icon tap, browser relaunch) lands on the Logbook --
// that's the default view -- regardless of whatever screen/modal was open
// when the user last left. Mid-session bottom-nav taps to Rewards/Profile
// still work as normal; this only resets the *boot* screen.
state.screen = "logbook";
// One-time back-fill for players who onboarded before second_garden became
// a starter unlock (see unlockStarterRewards()) -- without this, anyone
// who hadn't already banked 7 carrots would be stuck forever, since
// evaluateRewards() now skips starter entries' condition check entirely.
if(state.onboarded && !state.unlocks.second_garden){
  state.unlocks.second_garden = { unlockedAt: todayStr(), reason: STARTER_REASON };
}

function evaluateRewards(){
  if(!state.onboarded) return;
  for(var i=0;i<REWARDS.length;i++){
    var r = REWARDS[i];
    if(r.starter) continue;
    if(state.unlocks[r.id]) continue;
    if(r.condition(state)){
      state.unlocks[r.id] = { unlockedAt: todayStr() };
      state.pendingCelebration = r.id;
    }
  }
  evaluateSightings();
  evaluateCocoCannon();
  evaluateActiveDays();
  evaluateStreakBonus();
}

// Coco Cannon lives reset (not accumulate) on each new day a habit gets
// logged: day 1 of play = 1 life, day 2 = 2, and so on up to a 7-life cap --
// an increasing reward for continued logging, rather than a bank that just
// trickles +1/day on top of whatever's left over from playing. Losing
// lives in-game only ever reduces cocoLives within the same day; the next
// new day resets it back up to that day's ration regardless of how many
// were spent. Same one-credit-per-calendar-day cap as New Discovery/
// Treasure Hunt (see hasCompletionToday() below) -- at most one reset per
// day, regardless of how many habits get completed that day.
function evaluateCocoCannon(){
  if(!state.onboarded) return;
  var t = todayStr();
  if(state.cocoLivesDays.indexOf(t)===-1 && hasCompletionToday(state)){
    state.cocoLivesDays.push(t);
    // The one-time trial bonus (see startPlaying()) stays intact for the
    // rest of the exact calendar day it was granted, even if today's
    // ration gets credited (or credited late) that same day -- only a
    // genuinely later day resumes the normal reset-to-ration behavior.
    if(state.cocoTrialGrantedOn !== t){
      state.cocoLives = Math.min(7, state.cocoLivesDays.length);
    }
  }
}

// A general, type-agnostic "was the player active on day X" record --
// separate from cocoLivesDays/treasureMoveDays/discoveryCarrotDays (which
// are each their own currency's day-cap) so the 7-day streak bonus below
// isn't tangled up with any one reward's own bookkeeping, and keeps
// counting correctly even before Coco Cannon/Treasure Hunt happen to be
// relevant. Same one-credit-per-day gate as everything else.
function evaluateActiveDays(){
  if(!state.onboarded) return;
  var t = todayStr();
  if(state.activeDays.indexOf(t)===-1 && hasCompletionToday(state)) state.activeDays.push(t);
}
// Consecutive days (ending today, or yesterday if today's not logged yet)
// the player has been active, per evaluateActiveDays() above -- a gap of
// even one day breaks the count back to 0.
function activeDayStreak(){
  var n = 0, d = new Date();
  if(state.activeDays.indexOf(todayStr())===-1) d.setDate(d.getDate()-1);
  while(true){
    var ds = localDateStr(d);
    if(state.activeDays.indexOf(ds)!==-1){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
// Every fresh 7-day milestone (7, 14, 21, ...) of an unbroken active
// streak earns a one-time top-up: Coco Cannon lives refilled to a full 7
// (regardless of gameplay losses so far today) and one extra Treasure Hunt
// move usable today (see treasureMovesAllowedToday()). streakBonusCount
// tracks how many milestones have been rewarded so far on the *current*
// streak -- reset to 0 the moment the streak breaks, so a brand new streak
// earns the day-7 bonus again rather than being stuck remembering a much
// higher watermark from before the gap.
function evaluateStreakBonus(){
  if(!state.onboarded) return;
  var streak = activeDayStreak();
  if(streak===0){ state.streakBonusCount = 0; return; }
  var milestone = Math.floor(streak/7);
  if(milestone > state.streakBonusCount){
    state.streakBonusCount = milestone;
    state.cocoLives = 7;
    state.treasureStreakBonusDays.push(todayStr());
    showToast("🔥 7-day streak! Bonus Coco Cannon life + Treasure Hunt move earned.");
  }
}

// True the first time, on a given calendar day, that any habit has a
// completion logged for that day (month-token for monthly habits) -- used
// to cap discovery pacing at one credit per day regardless of how many
// habits get completed that day.
function hasCompletionToday(state){
  var t = todayStr(), w = isoWeekStr(), m = monthStr();
  return state.habits.some(function(h){
    if(h.type==="monthly") return h.completions.indexOf(m)!==-1;
    if(h.type==="weekly") return h.completions.indexOf(w)!==-1;
    return h.completions.indexOf(t)!==-1;
  });
}

// New Discovery: an open-ended collectible track, separate from the
// structured REWARDS chain above. One random not-yet-discovered sighting
// unlocks every 7 "discovery carrots" -- a separate, day-capped counter
// (at most +1/day, see hasCompletionToday() above) rather than raw
// state.carrots, so a player tracking several habits at once earns
// discoveries at the exact same pace as a player tracking one: a constant
// max of one discovery -- and one new Castaway's Log entry, see
// unlockedJournalEntries() -- per week. Extra habits still grow
// state.carrots normally to fund the REWARDS chain above.
function evaluateSightings(){
  if(!state.onboarded) return;
  var t = todayStr();
  if(state.discoveryCarrotDays.indexOf(t)===-1 && hasCompletionToday(state)){
    state.discoveryCarrotDays.push(t);
    state.discoveryCarrots++;
  }
  // state.sightings.length includes the one free discovery granted at
  // finishOnboarding (see unlockFirstDiscoveryFree()), which didn't cost
  // any discoveryCarrots -- earnedCount backs it out so every *paid*
  // discovery still costs exactly 7 carrots, the free one included or not.
  var earnedCount = state.sightings.length - state.freeSightings;
  var eligible = Math.min(SIGHTINGS_TOTAL - state.freeSightings, Math.floor(state.discoveryCarrots/7));
  var unlockedAny = false, lastNewIdx = null;
  while(earnedCount < eligible){
    var remaining = [];
    for(var i=0;i<SIGHTINGS_TOTAL;i++){ if(state.sightings.indexOf(i)===-1) remaining.push(i); }
    if(remaining.length===0) break;
    lastNewIdx = remaining[Math.floor(Math.random()*remaining.length)];
    state.sightings.push(lastNewIdx);
    earnedCount++;
    unlockedAny = true;
  }
  if(unlockedAny){
    showToast(lastNewIdx!==null ? '🔭 New discovery! "'+SIGHTING_FLAVOR[lastNewIdx].title+'"' : "🔭 New discovery!");
  }
}

// A one-time freebie, separate from evaluateSightings()'s normal 7-carrot
// discovery pacing above -- the castaway's very first sighting is
// guaranteed the moment their first habit exists (see finishOnboarding()),
// rather than something they might not reach for a week or more depending
// on how consistently they log. Called once, on brand-new state, so
// state.sightings is always empty here -- no duplicate-index check needed.
// Position 0's growth-arc line (GROWTH_LINE[0], see growthLineForPosition())
// is the "scared, but didn't panic" admission that follows the bravado of
// the python encounter -- it only makes narrative sense paired with that
// exact close call, so the free first discovery is pinned to "Roots
// Everywhere" (the Mangroves entry) by title lookup rather than random,
// unlike every discovery after it. Falls back to random if that title ever
// changes/moves, rather than silently unlocking nothing.
function unlockFirstDiscoveryFree(){
  var idx = -1;
  for(var i=0;i<SIGHTING_FLAVOR.length;i++){
    if(SIGHTING_FLAVOR[i].title==="Roots Everywhere"){ idx = i; break; }
  }
  if(idx===-1) idx = Math.floor(Math.random()*SIGHTINGS_TOTAL);
  state.sightings.push(idx);
  state.freeSightings++;
  showToast("Reward issued: 1st rHabbit created!");
}

function unlockStarterRewards(){
  ["portrait","island_home","first_habit","second_garden"].forEach(function(id){
    state.unlocks[id] = { unlockedAt: todayStr(), reason: STARTER_REASON };
  });
}

function nextLockedReward(){

function renderHabitGroup(type, label){

function habitLogged(h){
  if(h.type==="daily") return h.completions.indexOf(todayStr())!==-1;
  if(h.type==="weekly") return h.completions.indexOf(isoWeekStr())!==-1;
  if(h.type==="monthly") return h.completions.indexOf(monthStr())!==-1;
  if(h.type==="every") return !habitEveryDue(h);
  return h.completions.length>0; // onceoff
}
// "years" is the one everyUnit that can actually be 1 (see everyMinN()) --
// singular-strip it ("Every 1 year", not "Every 1 years") rather than
// leaving the raw plural unit string on that one legitimate case.
function everyUnitLabel(h){
  return h.everyN===1 ? h.everyUnit.slice(0,-1) : h.everyUnit;
}
function habitTypeBadge(h){
  if(h.type==="daily") return "Daily";
  if(h.type==="weekly") return typeof h.dayOfWeek==="number" ? "Weekly · "+SPECIAL_DAY_WEEKDAY_ABBR[h.dayOfWeek] : "Weekly";
  if(h.type==="monthly") return "Monthly";
  if(h.type==="every") return "Every "+h.everyN+" "+everyUnitLabel(h);
  return "Once-off";
}
// A habit is "due" right now if it's not currently satisfied for its
// period/interval -- daily/weekly/monthly/every all reduce to "not
// logged"; once-off additionally needs its due date to have arrived (a
// future due date isn't due *yet*, though it's still tracked normally).
// Legacy once-offs from before this feature has no dueDate at all -- those
// stay "always due until done", matching how they behaved before.
function habitDueToday(h){
  if(h.type==="onceoff"){
    if(h.completions.length) return false;
    return !h.dueDate || h.dueDate<=todayStr();
  }
  return !habitLogged(h);
}
function dueTodayHabits(state){
  return state.habits.filter(habitDueToday);
}

// Compact single-line row -- this is deliberately minimal (emoji, name, type,
// one status glyph) rather than the old full card with inline week-pips/log
// button, so the Logbook stays scannable as someone accumulates many habits
// across daily/monthly/once-off. Tapping opens renderHabitDetailModal() for
// everything else (log/toggle, streak, delete).
function renderHabitCard(h){
  var badge = habitTypeBadge(h);
  var logged = habitLogged(h);
  var status = logged ? '<span class="habit-status done">✓</span>'
    : (h.type==="daily" && dailyStreak(h)>0) ? '<span class="habit-status streak">🔥'+dailyStreak(h)+'</span>'
    : '<span class="habit-status idle"></span>';
  return (
    '<button class="habit-row" data-action="show-habit-detail" data-id="'+h.id+'">' +
      '<span class="habit-emoji">'+h.emoji+'</span>' +
      '<span class="habit-name">'+escapeHtml(h.name)+'</span>' +
      '<span class="habit-type-badge">'+badge+'</span>' +
      status +
    '</button>'
  );
}

  }

      // deleteHabitNoteFor()).

      // stays a plain toggle) opens that day's note for add/edit/delete --
      // clickable whenever the day is logged OR still carries a note from
      // before it was unchecked (unchecking no longer deletes the note,
      // see toggleDaily()), so it stays reachable until the user deletes
      // it explicitly from the note pop-up.
      if(done || hasNote){
        pips += '<button class="'+pipCls+'" data-action="open-habit-note" data-id="'+h.id+'" data-date="'+ds+'">'+pipInner+'</button>';
      } else {
        pips += '<div class="'+pipCls+'">'+pipInner+'</div>';
      }
    }
    html += '<div class="habit-week">'+pips+'</div>';
    logBtnHtml = '<button class="log-btn log-btn-sm '+(doneToday?'done':'')+'" data-action="toggle-daily" data-id="'+h.id+'">'+(doneToday?'✓ Logged Today':'Log Today  +1 🥕')+'</button>';
    metaHtml = '<div class="habit-meta">Streak: '+dailyStreak(h)+' day'+(dailyStreak(h)===1?'':'s')+'</div>';
  } else if(h.type==="monthly"){
    var m = monthStr();
    var doneMonth = h.completions.indexOf(m)!==-1;
    if(doneMonth){
      logBtnHtml = '<button class="log-btn log-btn-sm done" data-action="open-habit-note" data-id="'+h.id+'">'+(habitHasNote(h)?'📝':'✓')+' Logged this month</button>';
    } else {
      logBtnHtml = '<button class="log-btn log-btn-sm" data-action="toggle-monthly" data-id="'+h.id+'">Log this Month  +1 🥕</button>';
    }
    metaHtml = '<div class="habit-meta">'+h.completions.length+'/7 months toward next reward</div>';
  } else if(h.type==="weekly"){
    var w = isoWeekStr();
    var doneWeek = h.completions.indexOf(w)!==-1;
    if(doneWeek){
      logBtnHtml = '<button class="log-btn log-btn-sm done" data-action="open-habit-note" data-id="'+h.id+'">'+(habitHasNote(h)?'📝':'✓')+' Logged this week</button>';
    } else {
      logBtnHtml = '<button class="log-btn log-btn-sm" data-action="toggle-weekly" data-id="'+h.id+'">Log this Week  +1 🥕</button>';
    }
    metaHtml = '<div class="habit-meta">'+h.completions.length+' week'+(h.completions.length===1?'':'s')+' logged'+(typeof h.dayOfWeek==="number" ? ' · Target: '+SPECIAL_DAY_WEEKDAY_ABBR[h.dayOfWeek] : '')+'</div>';
  } else if(h.type==="every"){
    var everyDue = habitEveryDue(h);
    if(!everyDue){
      logBtnHtml = '<button class="log-btn log-btn-sm done" data-action="open-habit-note" data-id="'+h.id+'">'+(habitHasNote(h)?'📝':'✓')+' Logged</button>';
      var remaining = habitEveryDaysRemaining(h);
      metaHtml = '<div class="habit-meta">Due again in '+remaining+' day'+(remaining===1?'':'s')+'</div>';
    } else {
      logBtnHtml = '<button class="log-btn log-btn-sm" data-action="toggle-every" data-id="'+h.id+'">Log Now  +1 🥕</button>';
      metaHtml = '<div class="habit-meta">Repeats every '+h.everyN+' '+everyUnitLabel(h)+'</div>';
    }
  } else {
    var done = h.completions.length>0;
    if(done){
      logBtnHtml = '<button class="log-btn log-btn-sm done" data-action="open-habit-note" data-id="'+h.id+'">'+(habitHasNote(h)?'📝':'✓')+' Completed</button>';
      metaHtml = '<div class="habit-meta">'+h.completions[0]+'</div>';
    } else {
      logBtnHtml = '<button class="log-btn log-btn-sm" data-action="toggle-onceoff" data-id="'+h.id+'">Mark Complete  +1 🥕</button>';
      metaHtml = h.dueDate ? '<div class="habit-meta">Due '+h.dueDate+'</div>' : '';
    }
  }
  // Log and Delete sit in one row, pinned to opposite edges (justify-content:
  // space-between) and both shrunk to log-btn-sm/btn-sm -- keeps them far
  // apart on purpose so a fast repeat tap to log a habit can't land on
  // Delete, which used to sit directly below a full-width Log button.
  html += '<div class="habit-log-row">'+logBtnHtml+'<button class="btn btn-danger btn-sm" data-action="delete-habit" data-id="'+h.id+'">Delete rHABBIT</button></div>';
  html += metaHtml;
  html += '</div></div>';
  return html;
}

function dailyStreak(h){
  var n=0, d=new Date();
  var today = todayStr();
  if(h.completions.indexOf(today)===-1){ d.setDate(d.getDate()-1); }
  while(true){
    var ds = localDateStr(d);
    if(h.completions.indexOf(ds)!==-1){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

function renderTreasureMapHtml(compact){
  var html = '<div class="tmap-wrap'+(compact?' compact':'')+'">';

    html += '<div class="tmap-grid">';

      for(var c=0;c<TREASURE_COLS;c++){
        var revealed = state.treasureFog.indexOf(treasureCellKey(r,c))!==-1;
        var isCurrent = state.treasurePos.r===r && state.treasurePos.c===c;
        var chestIdx = treasureChestAt(r,c);

        // Carrot Juice barrel photo marks the castaway's current position.
        if(revealed && isCurrent){ inner = '<img class="tmap-pin" src="'+ASSET.carrot_juice+'" alt="">'; }

      }
    }

  }
  html += '</div>';
  return html;
}

function renderRewardsScreen(){
  var html = '<section class="screen">';
  html += '<h2 style="color:var(--parchment-hi); margin-bottom:4px;">Your Rewards</h2>';
  html += '<p style="color:var(--parchment-edge); font-size:.85rem; margin-bottom:16px;">Bonus rewards: 7 days in a row = +1 life (Coco Cannons) and +1 move (Treasure Hunt)</p>';
  html += '<div class="reward-grid">';

  // "Next Rewards" always leads the grid -- it's the one card that answers
  // "what am I working toward right now," so it shouldn't require scrolling
  // past everything already earned to find.
  var chainNext = nextLockedReward();
  var sightingsActive = state.sightings.length < SIGHTINGS_TOTAL;
  if(chainNext || sightingsActive){
    html += '<div class="reward-card" data-action="show-next-rewards-detail">';
    html += '<div class="reward-media"><img src="'+ASSET.chest+'" alt=""></div>';
    html += '<div class="reward-lock">🔒</div>';
    html += '<div class="reward-body">';
    html += '<div class="reward-title">Next Rewards</div>';
    html += renderNextRewardsList(chainNext, sightingsActive);
    html += '<div class="pip-row compact">'+carrotPipsHtml(state.carrots%7,7)+'</div>';
    html += '</div></div>';
  }

  // Treasure Hunt sits right after Next Rewards -- it answers the same
  // "what am I working toward" question via a completely different,
  // exploration-based track -- for as long as there's still map left to
  // uncover, taking priority over every other favorited card below. Once
  // the whole island is mapped it steps aside (see the un-pinned render
  // call further down) unless the player has favorited it, which keeps it
  // pinned here regardless.
  var treasureFavorited = state.favoriteRewards.indexOf("treasure_hunt")!==-1;
  var treasurePinned = !state.treasureMapComplete || treasureFavorited;
  if(treasurePinned){ html += renderTreasureHuntCard(treasureFavorited); }

  // Coco Cannon sits right after Treasure Hunt, once unlocked (see its
  // REWARDS-array condition -- logging a first habit) -- a fixed position
  // rather than something that competes in the favorite-sort below,
  // mirroring Treasure Hunt's own placement immediately above it.
  if(state.unlocks.coco_cannon){
    var cocoFavorited = state.favoriteRewards.indexOf("coco_cannon")!==-1;
    html += renderCocoCannonCard(cocoFavorited);
  }

  // Every other card (New Discovery + each unlocked REWARDS entry) can be
  // favorited from its own main card (the heart button rendered on each,
  // never tucked into a detail view) to jump the queue ahead of whichever
  // of these aren't favorited -- the whole point being that once there are
  // enough unlocked rewards to actually scroll past, a player can choose
  // which ones they want to keep front-and-center. Everything still locked
  // beyond the "Next Rewards" teaser above is intentionally not spelled out
  // individually -- seeing "7-Month Streak Badge" or "7 Once-Offs Completed
  // Badge" as their own locked cards on day one is just clutter/overwhelm
  // before they're even relevant.
  var newDiscoveryFavorited = state.favoriteRewards.indexOf("new_discovery")!==-1;
  var otherCards = [{ favorited: newDiscoveryFavorited, html: renderNewDiscoveryCard(newDiscoveryFavorited) }];
  REWARDS.filter(function(r){ return !!state.unlocks[r.id] && r.id!=="coco_cannon"; }).forEach(function(r){
    var favorited = state.favoriteRewards.indexOf(r.id)!==-1;
    otherCards.push({ favorited: favorited, html: renderUnlockedRewardCard(r, favorited) });
  });
  // Stable partition, not a full re-sort -- favorited cards keep their
  // relative order among themselves (New Discovery first, then REWARDS
  // array order), same for the unfavorited ones, so favoriting one card
  // never reshuffles any other pair's relative order.
  otherCards.filter(function(c){ return c.favorited; }).forEach(function(c){ html += c.html; });
  otherCards.filter(function(c){ return !c.favorited; }).forEach(function(c){ html += c.html; });

  // Demoted position: map fully uncovered and not favorited -- see the
  // pinned render call above for the paired condition.
  if(!treasurePinned){ html += renderTreasureHuntCard(treasureFavorited); }

  html += '</div>';
  html += '</section>';
  return html;
}

// Reached by tapping the New Discovery summary card on the Rewards
// screen. Pre-discovery this is just "No discoveries yet" -- the full
// gallery (grid + favorites filter) only has anything to show from the

function renderSightingsGalleryModal(){

    html += '<p class="sightings-teaser">No discoveries yet. Keep logging rHabbits — your first island sighting unlocks at 7 carrots.</p>';
    html += '</div></div>';
    return html;
  }
  // Featured: the single most recent find, picture and story together --
  // shares its journal text with the Story So Far log (unlockedJournalEntries()
  // is newest-first, so index 0 is always this same discovery) rather than
  // duplicating/drifting from it.
  var latestEntry = unlockedJournalEntries(state)[0];
  html += '<div class="sighting-featured">';
  html += '<div class="sighting-featured-img" style="'+sightingTileStyle(latestEntry.sightingIdx)+'"></div>';
  html += '<div class="sighting-featured-text">';
  html += '<span class="log-entry-when">'+latestEntry.title+'</span>';
  html += '<p class="log-entry-body">'+latestEntry.body+'</p>';
  html += '</div></div>';

  html += '<div class="sightings-grid">';
  state.sightings.forEach(function(idx){
    html += '<div class="sighting-tile" style="'+sightingTileStyle(idx)+'"></div>';
  });
  html += '</div>';
  if(state.sightings.length < SIGHTINGS_TOTAL){
    // Mirrors evaluateSightings()'s earnedCount math -- the free discovery
    // (see unlockFirstDiscoveryFree()) doesn't count against the carrot
    // pacing, so every *paid* discovery, the next one included, is always
    // exactly a 7-carrot step from the last.
    var nextThreshold = ((state.sightings.length - state.freeSightings) + 1) * 7;
    html += '<p class="sightings-footer">'+state.sightings.length+' / '+SIGHTINGS_TOTAL+' discovered — next at '+nextThreshold+' carrots.</p>';
  } else {
    html += '<p class="sightings-footer">All '+SIGHTINGS_TOTAL+' island sightings discovered!</p>';
  }
  html += '</div></div>';
  return html;
}

  html += '    <button class="special-days-add-btn" data-action="open-add-special-day" aria-label="Add a special day">+</button>';
  html += '    <button class="modal-close" data-action="close-modal" style="float:none; margin:0;">✕</button>';
  html += '  </div>';
  html += '</div>';
  var list = specialDaysSorted();
  if(list.length===0){
    html += '<p class="due-today-empty">No special days added yet. Tap + to add one.</p>';
  } else {
    list.forEach(function(sd){
      // No badge at all for a regioned holiday (specialDayOccasionLabel()
      // returns "" -- its flag icon already says which country) rather
      // than rendering an empty, still-padded/backgrounded pill.
      var occasionLabel = specialDayOccasionLabel(sd);
      var rowInner = '<span class="habit-emoji special-day-icon">'+specialDayIcon(sd)+'</span>' +
        '<span class="habit-name'+(sd.builtin?' builtin-holiday':'')+'">'+escapeHtml(sd.names)+'</span>' +
        (occasionLabel ? '<span class="habit-type-badge">'+escapeHtml(occasionLabel)+'</span>' : '') +
        '<span class="special-day-date">'+specialDayDateLabel(sd)+'</span>';
      // Built-in holidays (see GLOBAL_HOLIDAYS) aren't user data -- nothing
      // to edit or delete, so render as a plain non-interactive row instead
      // of the tappable button that opens the edit/delete form.
      html += sd.builtin
        ? '<div class="habit-row">'+rowInner+'</div>'
        : '<button class="habit-row" data-action="show-special-day-detail" data-id="'+sd.id+'">'+rowInner+'</button>';
    });
  }
  html += '</div></div>';
  return html;
}
