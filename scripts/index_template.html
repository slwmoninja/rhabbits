function renderAddHabitModal(){
  var d = state._draft;
  var dailyCount = countActive(state,"daily"), dailyMax = maxDailySlots(state);
  var typesUnlocked = !!state.unlocks.second_garden;
  var monthlyCount = countActive(state,"monthly"), monthlyMax = 3;
  var onceoffCount = countActive(state,"onceoff"), onceoffMax = 3;
  var weeklyCount = countActive(state,"weekly"), weeklyMax = 3;
  var everyCount = countActive(state,"every"), everyMax = 3;

  var dailyDisabled = dailyCount >= dailyMax;
  var monthlyDisabled = !typesUnlocked || monthlyCount >= monthlyMax;
  var onceoffDisabled = !typesUnlocked || onceoffCount >= onceoffMax;
  var weeklyDisabled = !typesUnlocked || weeklyCount >= weeklyMax;
  var everyDisabled = !typesUnlocked || everyCount >= everyMax;

  if(dailyDisabled && d.type==="daily"){
    d.type = !monthlyDisabled ? "monthly" : (!onceoffDisabled ? "onceoff" : (!weeklyDisabled ? "weekly" : (!everyDisabled ? "every" : "daily")));
  }

  var html = '<div class="modal-backdrop" data-backdrop="add-habit">';
  html += '<div class="modal">';
  html += '<button class="modal-close" data-action="close-modal">✕</button>';
  html += '<h3>Add a rHabbit</h3>';
  html += '<div class="field"><label>Name</label><input type="text" id="addHabitName" maxlength="40" placeholder="e.g. Stretch for 5 minutes" value="'+escapeAttr(d.name)+'"></div>';
  html += '<div class="field"><label><span style="text-transform:lowercase">r</span>Habbit description (optional)</label><textarea id="addHabitDescription" maxlength="140" placeholder="e.g. Right after brushing my teeth">'+escapeHtml(d.description)+'</textarea></div>';
  html += '<div class="emoji-picker">'+EMOJI_CHOICES.map(function(e){return '<button class="emoji-opt '+(d.emoji===e?'selected':'')+'" data-action="pick-emoji" data-emoji="'+e+'">'+e+'</button>';}).join('')+'</div>';
  html += '<div class="type-picker">';
  if(!typesUnlocked){
    // Pre-unlock: the original 3-way picker, unchanged in spirit -- just
    // re-pointed at the reward that now actually gates it (see the
    // second_garden REWARDS entry, which folded in the old 28-day gate).
    html += typeOptRow("daily","Daily", dailyCount+"/"+dailyMax+" rHabbits used", d.type==="daily", dailyDisabled);
    html += typeOptRow("monthly","Monthly", "🔒 Unlocks at 7 carrots", d.type==="monthly", monthlyDisabled);
    html += typeOptRow("onceoff","Once-off", "🔒 Unlocks at 7 carrots", d.type==="onceoff", onceoffDisabled);
  } else {
    html += typeOptRow("onceoff","Once", onceoffCount+"/"+onceoffMax+" used", d.type==="onceoff", onceoffDisabled);
    if(d.type==="onceoff"){
      html += '<div class="field freq-subfield"><label>Due date</label><input type="date" id="addHabitDueDate" value="'+escapeAttr(d.dueDate||todayStr())+'"></div>';
    }
    html += typeOptRow("daily","Daily", dailyCount+"/"+dailyMax+" rHabbits used", d.type==="daily", dailyDisabled);
    html += typeOptRow("weekly","Weekly", weeklyCount+"/"+weeklyMax+" used", d.type==="weekly", weeklyDisabled);
    if(d.type==="weekly"){
      html += '<div class="field freq-subfield"><label>Day of week</label><select id="addHabitWeekday">' +
        SPECIAL_DAY_WEEKDAY_ABBR.map(function(name,i){return '<option value="'+i+'"'+(d.dayOfWeek===i?' selected':'')+'>'+name+'</option>';}).join('') +
      '</select></div>';
    }
    html += typeOptRow("monthly","Monthly", monthlyCount+"/"+monthlyMax+" used", d.type==="monthly", monthlyDisabled);
    html += typeOptRow("every","Every X", everyCount+"/"+everyMax+" used", d.type==="every", everyDisabled);
    if(d.type==="every"){
      // "years" is the one unit where 1 is a meaningful, common value (an
      // annual habit -- a checkup, a renewal) rather than a duplicate of
      // one of the fixed daily/weekly/monthly types above, so its floor is
      // 1 instead of the usual 2 (see everyMinN()).
      html += '<div class="field freq-subfield"><label>Repeat every</label><div class="freq-every-inputs">' +
        '<input type="number" id="addHabitEveryN" min="'+everyMinN(d.everyUnit)+'" max="365" value="'+(d.everyN||2)+'">' +
        '<select id="addHabitEveryUnit">' +
          '<option value="days"'+(d.everyUnit==="days"?' selected':'')+'>days</option>' +
          '<option value="weeks"'+(d.everyUnit==="weeks"?' selected':'')+'>weeks</option>' +
          '<option value="months"'+(d.everyUnit==="months"?' selected':'')+'>months</option>' +
          '<option value="years"'+(d.everyUnit==="years"?' selected':'')+'>years</option>' +
        '</select>' +
      '</div></div>';
    }
  }
  html += '</div>';
  var canSubmit = d.name.trim() &&
    !(d.type==="daily"&&dailyDisabled) && !(d.type==="monthly"&&monthlyDisabled) &&
    !(d.type==="onceoff"&&onceoffDisabled) && !(d.type==="weekly"&&weeklyDisabled) && !(d.type==="every"&&everyDisabled);
  html += '<button class="btn btn-block" data-action="confirm-add-habit" '+(canSubmit?'':'disabled')+'>Start tracking 🌴</button>';
  html += '</div></div>';
  return html;
}
function typeOptRow(value,title,sub,selected,disabled){
  return '<button class="type-opt '+(selected?'selected':'')+' '+(disabled?'disabled':'')+'" data-action="pick-type" data-type="'+value+'" '+(disabled?'disabled':'')+'>' +
    '<div><div class="t-title">'+title+'</div><div class="t-sub">'+sub+'</div></div>' +
  '</button>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- events ---------------- */
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(function(){ state.toast=null; render(); }, 1800);
}

function wireEvents(){
  var els = root.querySelectorAll("[data-action]");
  els.forEach(function(el){
    el.addEventListener("click", onAction);
  });
  var backdrops = root.querySelectorAll(".modal-backdrop");
  backdrops.forEach(function(bd){
    bd.addEventListener("click", function(e){
      if(e.target!==bd) return;
      // The celebration overlay isn't a navigated screen (it's shown via
      // state.pendingCelebration layered on top of whatever screen is
      // active, regardless of history) -- dismissing it must NOT go through
      // closeModal()/history.back(), or tapping its backdrop would pop
      // whatever real screen/modal history entry is actually current out
      // from under it. Mirrors the "Nice!" button's own ack-celebration case.
      // Same reasoning applies to the three Treasure Hunt pending overlays.
      var backdropType = bd.getAttribute("data-backdrop");
      if(backdropType==="celebration"){
        state.pendingCelebration = null;
        save(); render();
      } else if(backdropType==="treasure-found"){
        state.pendingTreasureFound = null;
        save(); render();
      } else if(backdropType==="map-complete"){
        state.pendingMapComplete = false;
        save(); render();
      } else if(backdropType==="treasure-trial"){
        state.pendingTreasureTrial = false;
        save(); render();
      } else {
        closeModal();
      }
    });
  });
  var nameInput = root.querySelector("#firstHabitName");
  if(nameInput){
    nameInput.addEventListener("input", function(e){
      state._draft.name = e.target.value;
      var btn = root.querySelector('[data-action="finish-onboarding"]');
      if(btn) btn.disabled = !state._draft.name.trim();
    });
  }
  var firstDescInput = root.querySelector("#firstHabitDescription");
  if(firstDescInput){
    firstDescInput.addEventListener("input", function(e){ state._draft.description = e.target.value; });
  }
  var addNameInput = root.querySelector("#addHabitName");
  if(addNameInput){
    addNameInput.addEventListener("input", function(e){
      state._draft.name = e.target.value;
      var btn = root.querySelector('[data-action="confirm-add-habit"]');
      if(btn) btn.disabled = !e.target.value.trim();
    });
    addNameInput.focus();
  }
  var addDescInput = root.querySelector("#addHabitDescription");
  if(addDescInput){
    addDescInput.addEventListener("input", function(e){ state._draft.description = e.target.value; });
  }
  // Once/Every X sub-fields (see renderAddHabitModal()) -- only present in
  // the DOM while that option is actually selected, same pattern as the
  // name/description inputs above (write straight to _draft, no render()).
  var addDueDateInput = root.querySelector("#addHabitDueDate");
  if(addDueDateInput){
    addDueDateInput.addEventListener("input", function(e){ state._draft.dueDate = e.target.value; });
  }
  var addWeekdaySelect = root.querySelector("#addHabitWeekday");
  if(addWeekdaySelect){
    addWeekdaySelect.addEventListener("change", function(e){ state._draft.dayOfWeek = parseInt(e.target.value,10); });
  }
  var addEveryNInput = root.querySelector("#addHabitEveryN");
  if(addEveryNInput){
    addEveryNInput.addEventListener("input", function(e){
      var n = parseInt(e.target.value,10);
      var min = everyMinN(state._draft.everyUnit);
      state._draft.everyN = (!n || n<min) ? min : n;
    });
  }
  var addEveryUnitSelect = root.querySelector("#addHabitEveryUnit");
  if(addEveryUnitSelect){
    addEveryUnitSelect.addEventListener("change", function(e){
      state._draft.everyUnit = e.target.value;
      // Re-clamp on unit change too -- e.g. "1 year" switched to "days"
      // shouldn't silently leave everyN at 1 (a duplicate of the plain
      // Daily type), and re-rendering the field's own min= alone wouldn't
      // fix a value already below the new floor.
      var min = everyMinN(state._draft.everyUnit);
      if(state._draft.everyN < min) state._draft.everyN = min;
      render();
    });
  }
  // Special Day add/edit form (see renderSpecialDayFormModal()) -- occasion
  // re-renders (unlike month/day/names) since picking "Other" needs to
  // reveal the custom-occasion-name text field.
  var sdNamesInput = root.querySelector("#specialDayNames");
  if(sdNamesInput){
    sdNamesInput.addEventListener("input", function(e){
      state._specialDayDraft.names = e.target.value;
      var btn = root.querySelector('[data-action="confirm-special-day"]');
      if(btn) btn.disabled = !e.target.value.trim();
    });
    sdNamesInput.focus();
  }
  var sdOccasionSelect = root.querySelector("#specialDayOccasion");
  if(sdOccasionSelect){
    sdOccasionSelect.addEventListener("change", function(e){ state._specialDayDraft.occasion = e.target.value; render(); });
  }
  var sdOccasionCustomInput = root.querySelector("#specialDayOccasionCustom");
  if(sdOccasionCustomInput){
    sdOccasionCustomInput.addEventListener("input", function(e){
      state._specialDayDraft.occasionCustom = e.target.value;
      var btn = root.querySelector('[data-action="confirm-special-day"]');
      if(btn) btn.disabled = !e.target.value.trim();
    });
  }
  var sdMonthSelect = root.querySelector("#specialDayMonth");
  if(sdMonthSelect){
    sdMonthSelect.addEventListener("change", function(e){ state._specialDayDraft.month = parseInt(e.target.value,10); });
  }
  var sdDaySelect = root.querySelector("#specialDayDay");
  if(sdDaySelect){
    sdDaySelect.addEventListener("change", function(e){ state._specialDayDraft.day = parseInt(e.target.value,10); });
  }
  // Habit-detail edit fields write straight to the habit object (not a
  // _draft) and only save(), never render() -- re-rendering on every
  // keystroke would rebuild the input out from under itself and drop focus/
  // cursor position mid-edit, same reasoning as the name inputs above.
  var detailNameInput = root.querySelector("#habitDetailName");
  if(detailNameInput){
    detailNameInput.addEventListener("input", function(e){
      var h = findHabit(state._detailHabitId);
      if(h){ h.name = e.target.value; save(); }
    });
    detailNameInput.addEventListener("blur", function(e){
      var h = findHabit(state._detailHabitId);
      if(h && !h.name.trim()){ h.name = "Untitled rHabbit"; e.target.value = h.name; save(); }
    });
  }
  var detailDescInput = root.querySelector("#habitDetailDescription");
  if(detailDescInput){
    detailDescInput.addEventListener("input", function(e){
      var h = findHabit(state._detailHabitId);
      if(h){ h.description = e.target.value; save(); }
    });
  }
  // Backup restore <input type=file> -- lives inside Profile (rebuilt fresh
  // by render() every time, unlike the bottombar), so it's safe to wire
  // from here. Onboarding no longer has its own restore entry point --
  // that's covered by Profile plus the proactive maybeOfferAutoRestore()
  // prompt (its own #ar-file-input is wired independently, see
  // offerAutoRestorePathB()).
  var restoreInput = root.querySelector("#profileRestoreInput");
  if(restoreInput){
    restoreInput.addEventListener("change", function(){
      importLatestBackupFromFiles(restoreInput.files);
      restoreInput.value = ""; // lets picking the exact same file again re-fire "change"
    });
  }
}

// Just steps history back one entry -- the popstate listener (see
// onPopState below) performs the actual screen restore + render(). Safe to
// call unconditionally here because every modal/screen this closes was
// itself opened via navigateTo(), which always pushed exactly one entry.
function closeModal(){
  history.back();
}

function onAction(e){
  var el = e.currentTarget;
  var action = el.getAttribute("data-action");
  switch(action){
    // Every explicit forward navigation below (onboarding steps, tapping the
    // home-icon/avatar to switch screens, opening the add-habit modal) goes
    // through navigateTo() so it participates in real one-step-at-a-time
    // back navigation (hardware back, Android gesture-nav swipe, the
    // browser's own back button) -- see navigateTo()/onPopState() below.
    case "onb-next":
      navigateTo(function(){ state.onbStep++; });
      break;
    case "pick-avatar":
      state.avatar = el.getAttribute("data-gender");
      navigateTo(function(){ state.onbStep++; });
      break;
    case "pick-emoji":
      state._draft.emoji = el.getAttribute("data-emoji");
      render();
      break;
    case "pick-special-day-icon":
      state._specialDayDraft.icon = el.getAttribute("data-icon");
      render();
      break;
    case "pick-type":
      if(el.hasAttribute("disabled")) return;
      state._draft.type = el.getAttribute("data-type");
      render();
      break;
    case "finish-onboarding":
      finishOnboarding();
      break;
    case "show-profile":
      navigateTo(function(){ state.screen = "profile-modal"; });
      break;
    case "open-add-habit":
      navigateTo(function(){
        state._draft = freshHabitDraft();
        state.screen = "add-habit-modal";
      });
      break;
    case "show-habit-detail":
      navigateTo(function(){
        state._detailHabitId = el.getAttribute("data-id");
        state._detailEmojiPickerOpen = false;
        state.screen = "habit-detail-modal";
      });
      break;
    case "toggle-detail-emoji-picker":
      state._detailEmojiPickerOpen = !state._detailEmojiPickerOpen;
      render();
      break;
    case "pick-detail-emoji":
      var detailHabit = findHabit(el.getAttribute("data-id"));
      if(detailHabit){ detailHabit.emoji = el.getAttribute("data-emoji"); save(); }
      state._detailEmojiPickerOpen = false;
      render();
      break;
    case "show-reward-detail":
      navigateTo(function(){
        state._detailRewardId = el.getAttribute("data-id");
        state.screen = "reward-detail-modal";
      });
      break;
    case "show-sightings-gallery":
      navigateTo(function(){ state.screen = "sightings-gallery-modal"; });
      break;
    case "show-due-today":
      navigateTo(function(){ state.screen = "due-today-modal"; });
      break;
    case "show-special-days":
      navigateTo(function(){ state.screen = "special-days-modal"; });
      break;
    case "open-add-special-day":
      navigateTo(function(){
        state._specialDayDraft = freshSpecialDayDraft();
        state._detailSpecialDayId = null;
        state.screen = "special-day-form-modal";
      });
      break;
    case "show-special-day-detail":
      navigateTo(function(){
        var sd = findSpecialDay(el.getAttribute("data-id"));
        if(!sd) return;
        state._specialDayDraft = { names:sd.names, occasion:sd.occasion, occasionCustom:sd.occasionCustom, month:sd.month, day:sd.day, icon: sd.icon||SPECIAL_DAY_ICON_CHOICES[0] };
        state._detailSpecialDayId = sd.id;
        state.screen = "special-day-form-modal";
      });
      break;
    case "confirm-special-day":
      saveSpecialDay();
      break;
    case "delete-special-day":
      deleteSpecialDay(el.getAttribute("data-id"));
      break;
    case "open-coco-cannon":
      navigateTo(function(){ state.screen = "coco-cannon"; });
      break;
    case "show-next-rewards-detail":
      navigateTo(function(){ state.screen = "next-rewards-detail-modal"; });
      break;
    case "show-treasure-hunt":
      navigateTo(function(){
        state.screen = "treasure-hunt-modal";
        // One-time trial: the very first time the map is actually opened,
        // not just when it exists (it's always unlocked from minute one),
        // grant 7 moves usable today only, so a brand new player can see a
        // real chunk of the island right away instead of one tile/day --
        // see treasureMovesAllowedToday() for how the bonus expires
        // automatically the next calendar day.
        if(!state.treasureTrialGrantedOn){
          state.treasureTrialGrantedOn = todayStr();
          state.pendingTreasureTrial = true;
        }
      });
      break;
    case "treasure-move":
      treasureMove(el.getAttribute("data-dir"));
      break;
    case "treasure-play-again":
      treasurePlayAgain();
      break;
    case "show-story":
      navigateTo(function(){ state.screen = "story-modal"; });
      break;
    case "toggle-favorite-reward":
      // Nested inside the reward-card's own show-reward-detail element --
      // stop the click from also bubbling up and opening the detail modal.
      e.stopPropagation();
      var rewardId = el.getAttribute("data-id");
      var rIdx = state.favoriteRewards.indexOf(rewardId);
      if(rIdx!==-1){ state.favoriteRewards.splice(rIdx,1); }
      else { state.favoriteRewards.push(rewardId); }
      save(); render();
      break;
    case "close-modal":
      closeModal();
      break;
    case "confirm-add-habit":
      addHabit();
      break;
    case "toggle-daily":
      toggleDaily(el.getAttribute("data-id"));
      break;
    case "toggle-monthly":
      toggleMonthly(el.getAttribute("data-id"));
      break;
    case "toggle-onceoff":
      toggleOnceoff(el.getAttribute("data-id"));
      break;
    case "toggle-weekly":
      toggleWeekly(el.getAttribute("data-id"));
      break;
    case "toggle-every":
      toggleEvery(el.getAttribute("data-id"));
      break;
    case "open-habit-note":
      // data-date is only present on a daily habit's day-pip (any of the 7,
      // not just today); monthly/once-off log-btns don't pass one, so this
      // falls back to whichever period is currently logged.
      var noteHabit = findHabit(el.getAttribute("data-id"));
      if(!noteHabit) return;
      state._noteKey = el.getAttribute("data-date") || habitNoteKey(noteHabit);
      navigateTo(function(){ state.screen = "habit-note-modal"; });
      break;
    case "save-habit-note":
      var noteInput = root.querySelector("#habitNoteText");
      saveHabitNote(el.getAttribute("data-id"), state._noteKey, noteInput ? noteInput.value : "");
      break;
    case "delete-habit-note":
      deleteHabitNote(el.getAttribute("data-id"), state._noteKey);
      break;
    case "delete-habit":
      deleteHabit(el.getAttribute("data-id"));
      break;
    case "switch-avatar":
      state.avatar = state.avatar==="female" ? "male" : "female";
      save(); render();
      break;
    case "toggle-us-holidays":
      state.showUSHolidays = !state.showUSHolidays;
      save(); render();
      break;
    case "toggle-sa-holidays":
      state.showSAHolidays = !state.showSAHolidays;
      save(); render();
      break;
    case "ack-celebration":
      state.pendingCelebration = null;
      save(); render();
      break;
    case "ack-treasure-found":
      state.pendingTreasureFound = null;
      save(); render();
      break;
    case "ack-map-complete":
      state.pendingMapComplete = false;
      save(); render();
      break;
    case "ack-treasure-trial":
      state.pendingTreasureTrial = false;
      save(); render();
      break;
    case "install-pill":
      if(isInstalled()){ openInfoModal("Uninstall", UNINSTALL_STEPS_HTML); }
      else { triggerInstall(); }
      break;
    case "backup-now":
      backupNow();
      break;
    case "restore-backup":
      openBackupRestorePicker(root.querySelector("#profileRestoreInput"));
      break;
    case "your-data":
      openInfoModal("Your Data", "Your data is private, only accessible to you on this device.");
      break;
  }
}

function finishOnboarding(){
  var name = state._draft.name.trim();
  if(!name) return;
  state.startDate = todayStr();
  state.habits.push({
    id: uid(), name:name, emoji: state._draft.emoji, type:"daily",
    description: state._draft.description.trim(),
    createdAt: todayStr(), completions:[]
  });
  unlockStarterRewards();
  state.onboarded = true;
  state.screen = "logbook";
  // Must come after state.onboarded=true -- showToast()'s toast only
  // renders as part of renderApp(), not renderOnboarding().
  unlockFirstDiscoveryFree();
  save();
  render();
  // Onboarding finishing and handing off to the main app is a one-time setup
  // flow completing, not a forward navigation -- replaceState establishes a
  // fresh baseline here so the bottombar/topbar are correctly synced (see
  // render()) and so Install/backup features relying on isInstalled()/
  // maybeShowInstallPrompt() start from the real "now in the main app" state.
  try{ history.replaceState(currentNavState(), ""); }catch(e){}
  // Proactive install ask happens here (after onboarding, never during it)
  // -- see maybeShowInstallPrompt() below for the once-ever gate.
  maybeShowInstallPrompt();
}

function addHabit(){
  var d = state._draft;
  var name = d.name.trim();
  if(!name) return;
  var habit = { id:uid(), name:name, emoji:d.emoji, type:d.type, description:d.description.trim(), createdAt:todayStr(), completions:[] };
  if(d.type==="onceoff") habit.dueDate = d.dueDate || todayStr();
  if(d.type==="every"){ habit.everyUnit = d.everyUnit; habit.everyN = Math.max(everyMinN(d.everyUnit), parseInt(d.everyN,10)||everyMinN(d.everyUnit)); }
  if(d.type==="weekly") habit.dayOfWeek = (typeof d.dayOfWeek==="number") ? d.dayOfWeek : new Date().getDay();
  state.habits.push(habit);
  save();
  // Pops the add-habit-modal's history entry (pushed by navigateTo() when it
  // was opened) rather than setting state.screen directly -- keeps the
  // history stack accurate so a later back-press doesn't return to a stale
  // add-habit form. onPopState() performs the actual re-render.
  closeModal();
}

function findHabit(id){
  return state.habits.filter(function(h){return h.id===id;})[0];
}

function toggleDaily(id){
  var h = findHabit(id); if(!h) return;
  var t = todayStr();
  var idx = h.completions.indexOf(t);
  // Unchecking does NOT delete that day's note -- a daily habit's note key
  // is always todayStr() regardless of completions, so it stays perfectly
  // reachable (and re-checking the same day reunites with it) until the
  // user deletes it explicitly from the note pop-up.
  if(idx===-1){ h.completions.push(t); state.carrots++; }
  else { h.completions.splice(idx,1); state.carrots=Math.max(0,state.carrots-1); }
  evaluateRewards();
  save(); render();
}
function toggleMonthly(id){
  var h = findHabit(id); if(!h) return;
  var m = monthStr();
  var idx = h.completions.indexOf(m);
  // Unlike toggleDaily(), monthly has no day-pip-style surface that stays
  // visible/clickable once unlogged (its log-btn IS the note trigger, only
  // while doneMonth), so a note would become genuinely unreachable while
  // unlogged this month -- deleting it here, same as toggleOnceoff(), is
  // more honest than leaving orphaned, inaccessible data.
  if(idx===-1){ h.completions.push(m); state.carrots++; }
  else { h.completions.splice(idx,1); state.carrots=Math.max(0,state.carrots-1); deleteHabitNoteFor(h,m); }
  evaluateRewards();
  save(); render();
}
function toggleWeekly(id){
  var h = findHabit(id); if(!h) return;
  var w = isoWeekStr();
  var idx = h.completions.indexOf(w);
  // Same reasoning as toggleMonthly() -- period key, note goes with it.
  if(idx===-1){ h.completions.push(w); state.carrots++; }
  else { h.completions.splice(idx,1); state.carrots=Math.max(0,state.carrots-1); deleteHabitNoteFor(h,w); }
  evaluateRewards();
  save(); render();
}
function toggleEvery(id){
  var h = findHabit(id); if(!h) return;
  var t = todayStr();
  // "Every" logs a fresh date each time it's due, like daily, but only
  // ever un-toggles *today's* specific entry (the log-btn only ever shows
  // "Log Now" when due, so a re-tap always means "undo today's own log",
  // never an older logged date).
  var idx = h.completions.indexOf(t);
  if(idx===-1){ h.completions.push(t); state.carrots++; }
  else { h.completions.splice(idx,1); state.carrots=Math.max(0,state.carrots-1); deleteHabitNoteFor(h,t); }
  evaluateRewards();
  save(); render();
}
function toggleOnceoff(id){
  var h = findHabit(id); if(!h) return;
  // Once-off is the one type whose note key (habitNoteKey() -> h.completions[0])
  // is *derived from* completions rather than independent of it -- clearing
  // completions here would leave any note permanently unreachable (no
  // "today"/"this month" fallback exists for a once-off), so unlike
  // toggleDaily()/toggleMonthly() its note has to go too.
  if(h.completions.length){ deleteHabitNoteFor(h,h.completions[0]); h.completions=[]; state.carrots=Math.max(0,state.carrots-1); }
  else { h.completions=[todayStr()]; state.carrots++; }
  evaluateRewards();
  save(); render();
}

/* ---------------- habit log notes ----------------
   A note is optional, per-completion context the player can attach to
   *today's* daily log, *this month's* monthly log, or the one-and-only
   once-off log -- keyed by the exact same date/month string already used
   in h.completions, so it always tracks whichever period is currently
   logged rather than needing its own separate identity. Stored in a
   parallel h.notes map (not inline on completions, which stay plain
   date/month strings everywhere else in this file -- dailyStreak(),
   habitLogged(), evaluateRewards(), onceoffCompletedCount() etc. all still
   just see an array of strings) so nothing else has to change shape. */
function habitNoteKey(h){
  if(h.type==="daily") return todayStr();
  if(h.type==="weekly") return isoWeekStr();
  if(h.type==="monthly") return monthStr();
  if(h.type==="every") return h.completions[h.completions.length-1]; // most recently logged date
  return h.completions[0]; // onceoff -- undefined if not yet completed
}
function getHabitNote(h){
  return (h.notes||{})[habitNoteKey(h)];
}
function habitHasNote(h){
  return !!getHabitNote(h);
}
function deleteHabitNoteFor(h, key){
  if(h.notes && key in h.notes) delete h.notes[key];
}
// Both close the pop-up (history.back(), same as addHabit()/deleteHabit())
// rather than just re-rendering in place -- the note modal is reached via
// navigateTo() (see "open-habit-note" below) so it owns a real history
// entry that needs popping, exactly like every other modal in this file.
// `key` is whichever specific date/month string the pop-up was opened for
// (state._noteKey -- a past day-pip's own date, not necessarily "today"),
// not re-derived from habitNoteKey(h) here.
function saveHabitNote(id, key, text){
  var h = findHabit(id); if(!h) return;
  text = text.trim();
  if(!text) return; // nothing to persist -- delete-habit-note removes an existing one
  if(!h.notes) h.notes = {};
  var existing = h.notes[key];
  var now = new Date().toISOString();
  h.notes[key] = { text: text, loggedAt: existing ? existing.loggedAt : now, updatedAt: now };
  save();
  closeModal();
}
function deleteHabitNote(id, key){
  var h = findHabit(id); if(!h) return;
  deleteHabitNoteFor(h, key);
  save();
  closeModal();
}
function formatNoteTimestamp(iso){
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
// Human-readable label for whichever key the note pop-up was opened for --
// shown regardless of whether that's today, so opening a past day-pip's
// note never reads ambiguously as "is this today's note?".
function formatNoteDateLabel(key, type){
  if(type==="monthly"){
    return new Date(key+"-01T00:00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"});
  }
  return new Date(key+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
// Reached by tapping a logged day-pip (daily -- any of the 7, not just
// today) or the "Logged"/"Completed" button (monthly/once-off, which have
// no per-day pip strip of their own) -- state._noteKey (set by
// "open-habit-note" in onAction()) says exactly which entry this is for.
function renderHabitNoteModal(id){
  var h = findHabit(id);
  if(!h) return '';
  var key = state._noteKey;
  var note = (h.notes||{})[key];
  var html = '<div class="modal-backdrop" data-backdrop="habit-note">';
  html += '<div class="modal">';
  // Save note lives as a small checkmark next to the close X, not a
  // full-width button down in .habit-note-actions -- same header-row
  // pattern as renderProfileModal's install pill next to its own close X.
  html += '<div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">';
  html += '  <h3 style="margin:0;">'+h.emoji+' '+escapeHtml(h.name)+'</h3>';
  html += '  <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">';
  html += '    <button class="note-save-btn" data-action="save-habit-note" data-id="'+h.id+'" aria-label="Save note">✓</button>';
  html += '    <button class="modal-close" data-action="close-modal" style="float:none; margin:0;">✕</button>';
  html += '  </div>';
  html += '</div>';
  html += '<div class="habit-note-daylabel">'+formatNoteDateLabel(key, h.type)+'</div>';
  html += '<div class="habit-note-info">Notes reset after 7 entries. Notes are accessible only to you on this device.</div>';
  if(note){
    html += '<div class="habit-note-meta">'+(note.updatedAt!==note.loggedAt?"Updated ":"Logged ")+formatNoteTimestamp(note.updatedAt)+'</div>';
  }
  html += '<textarea class="habit-note-input" id="habitNoteText" maxlength="280" placeholder="Add a note...">'+escapeHtml(note?note.text:"")+'</textarea>';
  if(note){
    html += '<div class="habit-note-actions">';
    html += '<button class="btn-ghost btn-block" data-action="delete-habit-note" data-id="'+h.id+'">Delete note</button>';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}
function deleteHabit(id){
  if(!confirm("Delete this rHabbit?")) return;
  var h = findHabit(id);
  // Closes a carrot-farming loophole: create a habit, log it, delete it to
  // free its slot, create another, log it, delete it again... would
  // otherwise out-earn what the slot limits intend, since a fresh habit id
  // sidesteps every period-based "already logged" check. Only claws back a
  // habit that's BOTH still within its very first day AND currently
  // logged -- exactly as if the player had unlogged it themselves right
  // before deleting -- so a long-lived habit keeps every carrot it ever
  // earned, deleted or not. Rewards already unlocked stay unlocked
  // regardless (see evaluateRewards()'s "already unlocked, skip" guard) --
  // this only protects the raw carrot count itself, which is the one
  // number with no day-cap of its own.
  if(h && h.createdAt===todayStr() && habitLogged(h)){
    state.carrots = Math.max(0, state.carrots-1);
  }
  state.habits = state.habits.filter(function(hb){return hb.id!==id;});
  save();
  // Only ever called from inside the habit-detail modal now (the compact
  // Logbook row has no inline delete) -- pop that history entry the same way
  // addHabit() pops the add-habit-modal's, rather than leaving state.screen
  // pointed at a detail view for a habit that no longer exists.
  closeModal();
}

// Add or edit, same function -- state._detailSpecialDayId set means editing
// an existing entry in place, null means appending a new one (same
// add-vs-edit contract as addHabit() vs the habit-detail edit fields).
function saveSpecialDay(){
  var d = state._specialDayDraft;
  var names = d.names.trim();
  if(!names) return;
  if(d.occasion==="other" && !d.occasionCustom.trim()) return;
  // icon only persists for "other" -- birthday/anniversary always render
  // their own fixed icon (see specialDayIcon()), so there's nothing to save
  // for those even if a stale value is still sitting in the draft from an
  // earlier occasion selection in this same form session.
  var entry = { names:names, occasion:d.occasion, occasionCustom:d.occasionCustom.trim(), month:d.month, day:d.day, icon: d.occasion==="other" ? d.icon : "" };
  var existing = state._detailSpecialDayId ? findSpecialDay(state._detailSpecialDayId) : null;
  if(existing){
    existing.names = entry.names;
    existing.occasion = entry.occasion;
    existing.occasionCustom = entry.occasionCustom;
    existing.month = entry.month;
    existing.day = entry.day;
    existing.icon = entry.icon;
  } else {
    entry.id = uid();
    state.specialDays.push(entry);
  }
  save();
  closeModal();
}
function deleteSpecialDay(id){
  if(!confirm("Remove this special day?")) return;
  state.specialDays = state.specialDays.filter(function(sd){ return sd.id!==id; });
  save();
  closeModal();
}

/* =========================================================
   HISTORY / BACK-NAVIGATION (Phone gesture support, part 1)
   Every explicit forward navigation (onboarding steps, switching to
   Rewards/Profile/an Add-Habit modal, the bottombar) goes through
   navigateTo(), which both applies the change and pushes exactly one
   history entry. A single popstate listener below just reflects whatever
   the browser already walked back to -- it must NOT push anything itself,
   which is what makes a hardware back press / Android gesture-nav swipe /
   the browser's own back button always undo exactly one step instead of
   jumping straight to some fixed "home" screen.
   ========================================================= */
function currentNavState(){
  return state.onboarded ? {screen: state.screen} : {onbStep: state.onbStep};
}
function navigateTo(mutate){
  mutate();
  save();
  render();
  try{ history.pushState(currentNavState(), ""); }catch(e){}
}
function onPopState(e){
  var target = e.state;
  if(!target){
    // No state to restore (popped past the first entry this app ever
    // established) -- fall back to whatever "root" currently means; in
    // practice the browser is usually navigating away from the app entirely
    // at this point, so this is mostly a defensive no-op.
    target = state.onboarded ? {screen:"logbook"} : {onbStep:0};
  }
  if(typeof target.onbStep === "number"){
    state.onboarded = false;
    state.onbStep = target.onbStep;
  } else if(target.screen){
    state.onboarded = true;
    state.screen = target.screen;
  }
  render(); // reflect only -- see the comment above, must not push
}
window.addEventListener("popstate", onPopState);

/* =========================================================
   INSTALL / HOME SCREEN
   ========================================================= */
// True once actually running as the installed/home-screen app rather than a
// regular browser tab -- display-mode covers Chrome/Edge/Android,
// navigator.standalone is Safari's own (non-standard, iOS-only) equivalent.
function isStandaloneApp(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
// What the Install pill actually checks -- not just isStandaloneApp() alone,
// since a regular tab that just walked through a manual/native install
// doesn't itself flip to display-mode:standalone until the user actually
// relaunches from the real Home Screen icon.
function isInstalled(){
  return isStandaloneApp() || !!state.installPromptAccepted;
}
// Shown top-right on every main screen's topbar (same row as the icon/
// wordmark row) so the call-to-action is visible immediately no matter
// where someone lands -- not just tucked into Profile. Once actually
// installed there's nothing left to act on there, so it disappears from
// Logbook/Rewards; Profile passes keepAfterInstall=true to keep showing it
// as an inert "Installed" status line instead, since that's the one place
// people go looking to confirm state. Label always mirrors isInstalled()
// directly -- no separate "uninstalled" state, since a page can't actually
// uninstall itself (see INSTALL_STEPS_HTML/UNINSTALL_STEPS_HTML below).
function installTopbarBtnHtml(keepAfterInstall){
  var installed = isInstalled();
  if(installed && !keepAfterInstall) return "";
  return '<button class="topbar-install-btn'+(installed?' installed':'')+'" data-action="install-pill">'+(installed?'Installed':'Install')+'</button>';
}
// Platform-agnostic (a page can't reliably detect device type) instructions

// Reusable centered popup, appended straight to <body> -- deliberately
// outside #app/state.screen, since these can be shown regardless of which
// screen is current (e.g. the auto-restore prompt fires before onboarding
// even renders its first real screen) and don't need back-navigation
// history of their own the way a real screen/modal does.
function openInfoModal(title, bodyHtml){
  var wrap = document.createElement("div");
  wrap.innerHTML =
    '<div class="modal-backdrop center">' +
      '<div class="modal">' +
        '<button class="modal-close" data-close-info>✕</button>' +
        '<h3>'+title+'</h3>' +

      '</div>' +
    '</div>';
